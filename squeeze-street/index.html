<!doctype html><html><head>
<meta name="viewport" content="width=device-width, initial-scale=1"><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Squeeze Street</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;700;800;900&display=swap">
<style>
  :root{
    color-scheme: light;
    --page:#fff7dc; --ink:#1f4250; --ink-2:#5c7c86;
    --cash:#ffd23f; --cash-ink:#5c3b00;
    --btn:#ffffff; --btn-edge:#cde2da; --lock:#edf6f1;
    --red:#ff5461; --red-edge:#c8303e;
    --green:#1fb070; --green-edge:#12804d;
    --orange:#ff8a1c; --orange-edge:#cc6200;
    --display:"Lilita One","Arial Rounded MT Bold","Trebuchet MS",system-ui,sans-serif;
    --body:"Nunito","Segoe UI",system-ui,-apple-system,sans-serif;
  }
  [hidden]{display:none!important}
  html,body{height:100%;margin:0}
  body{background:#fff7dc linear-gradient(180deg,#c6ecff 0%,#fff7dc 34%,#fff1c2 100%);color:var(--ink);font-family:var(--body);font-weight:700;overflow:hidden;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
  .app{height:100%;max-width:480px;margin:0 auto;display:flex;flex-direction:column;gap:10px;padding-inline:16px;padding-block:10px 12px;box-sizing:border-box}
  button{font-family:inherit;color:inherit;cursor:pointer}
  button:focus-visible{outline:3px solid var(--orange);outline-offset:2px}

  .hud{display:flex;align-items:center;gap:10px}
  .loc{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1}
  .loc b{font-family:var(--display);font-weight:400;font-size:clamp(13px,3.9vw,16px);line-height:1.05;letter-spacing:.04em;text-transform:uppercase;color:var(--orange)}
  .loc span{font-size:12px;color:var(--ink-2);font-weight:800}
  .money{text-align:center;display:flex;flex-direction:column;line-height:1;flex:none}
  .money #money{font-family:var(--display);font-size:clamp(28px,8vw,36px);color:var(--ink);font-variant-numeric:tabular-nums}
  .money #rate{font-size:12px;color:var(--ink-2);margin-top:3px;font-variant-numeric:tabular-nums}
  .tools{flex:1;display:flex;justify-content:flex-end;gap:6px}
  .icon-btn{width:38px;height:38px;border-radius:12px;border:0;background:var(--btn);box-shadow:0 3px 0 var(--btn-edge);display:grid;place-items:center;flex:none}
  .icon-btn svg{width:20px;height:20px}

  .stage{position:relative;flex:1;min-height:200px;border-radius:22px;overflow:hidden;background:#fdf6e3;box-shadow:inset 0 0 0 3px rgba(31,66,80,.10),0 4px 0 rgba(31,66,80,.08)}
  #cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
  .hint{position:absolute;left:50%;top:10px;transform:translateX(-50%);background:rgba(31,66,80,.86);color:#fff;font-weight:800;font-size:12.5px;padding:7px 14px 7px 10px;border-radius:999px;display:flex;align-items:center;gap:8px;pointer-events:none;white-space:nowrap}
  .hint i{width:16px;height:16px;border-radius:50%;background:var(--cash);animation:tap 1.1s ease-in-out infinite;flex:none}
  @keyframes tap{0%,100%{transform:scale(1)}40%{transform:scale(.7)}60%{transform:scale(1.1)}}
  .rush{position:absolute;right:10px;top:42px;background:var(--orange);color:#fff;font-family:var(--display);font-size:14px;padding:3px 10px;border-radius:999px;pointer-events:none;box-shadow:0 3px 0 var(--orange-edge)}
  .float{position:absolute;font-family:var(--display);color:var(--cash);text-shadow:0 2px 0 #1f4250,1.5px 0 0 #1f4250,-1.5px 0 0 #1f4250,0 -1.5px 0 #1f4250;pointer-events:none;white-space:nowrap;font-size:16px;animation:rise 1.1s ease-out forwards;z-index:1}
  .float.lv{color:#fff;font-size:14px}
  @keyframes rise{0%{opacity:0;transform:translate(-50%,-30%) scale(.7)}15%{opacity:1;transform:translate(-50%,-50%) scale(1.1)}100%{opacity:0;transform:translate(-50%,-170%) scale(1)}}
  .banner{position:absolute;left:50%;top:34%;transform:translate(-50%,-50%);background:var(--ink);color:#fff;border-radius:16px;padding:10px 18px 12px;text-align:center;pointer-events:none;box-shadow:0 5px 0 rgba(0,0,0,.2);animation:bn 2.4s ease-out forwards;white-space:nowrap;z-index:2}
  .banner small{display:block;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--cash);font-weight:900}
  .banner b{font-family:var(--display);font-weight:400;font-size:25px}
  .banner.big{background:linear-gradient(#ffe066,#ffb21e);color:#4a2b00;box-shadow:0 5px 0 #c77f00}
  .banner.big small{color:#7a4300}
  @keyframes bn{0%{opacity:0;transform:translate(-50%,-50%) scale(.6)}12%{opacity:1;transform:translate(-50%,-50%) scale(1.08)}20%{transform:translate(-50%,-50%) scale(1)}85%{opacity:1}100%{opacity:0;transform:translate(-50%,-70%)}}

  .info{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:13px;color:var(--ink-2);font-weight:800;font-variant-numeric:tabular-nums}
  .info span:first-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pay{font-family:var(--display);font-weight:400;color:var(--green);font-size:16px;white-space:nowrap}

  .upgrades{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .up{border:0;border-radius:16px;background:var(--btn);box-shadow:0 4px 0 var(--btn-edge);padding:9px 8px;display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:left;min-width:0;transition:transform .06s}
  .up:active{transform:translateY(3px);box-shadow:0 1px 0 var(--btn-edge)}
  .up-h{display:flex;align-items:center;gap:6px;min-width:0;width:100%}
  .up-h i{width:24px;height:24px;border-radius:8px;background:var(--lock);display:grid;place-items:center;flex:none}
  .up-h i svg{width:18px;height:18px}
  .up-h b{font-size:12.5px;font-weight:900;line-height:1.08;min-width:0}
  .up small{font-size:11px;color:var(--ink-2);line-height:1.2;min-height:2.4em;width:100%}
  .cost{font-family:var(--display);font-size:14px;background:var(--cash);color:var(--cash-ink);padding:2px 9px;border-radius:8px;font-variant-numeric:tabular-nums}
  .up.poor .cost,.up.off .cost{background:var(--lock);color:var(--ink-2)}
  .up.off{opacity:.62}
  .up.prim{background:var(--red);color:#fff;box-shadow:0 4px 0 var(--red-edge)}
  .up.prim small{color:#ffe1e4}.up.prim .up-h i{background:rgba(255,255,255,.24)}
  .up.prim:active{box-shadow:0 1px 0 var(--red-edge)}
  .up.prim.poor{background:#ff9aa2;box-shadow:0 4px 0 #d9737d}
  .up.prim.poor .cost{background:rgba(255,255,255,.55);color:#9a3a44}
  .up.hot{background:var(--green);color:#fff;box-shadow:0 4px 0 var(--green-edge);animation:glow 1.2s ease-in-out infinite}
  .up.hot small{color:#dcfff0}.up.hot .up-h i{background:rgba(255,255,255,.24)}
  .up.buy{animation:pop .25s}
  @keyframes pop{50%{transform:scale(1.05)}}
  @keyframes glow{50%{filter:brightness(1.12)}}

  .expand{position:relative;overflow:hidden;border:0;border-radius:14px;height:46px;font-weight:900;font-size:13.5px;white-space:nowrap;padding:0 8px;background:#f2c894;color:#fff;box-shadow:0 4px 0 #c99a60;flex:none;text-shadow:0 1px 0 rgba(0,0,0,.15)}
  .expand .fill{position:absolute;inset:0;width:0;background:var(--orange);transition:width .2s}
  .expand span{position:relative}
  .expand.ready{background:var(--orange);box-shadow:0 4px 0 var(--orange-edge);animation:glow 1.2s ease-in-out infinite}

  .modal{position:fixed;inset:0;background:rgba(31,66,80,.5);display:grid;place-items:center;padding-inline:16px;z-index:10}
  .sheet{background:#fffdf5;border-radius:22px;padding:20px;width:100%;max-width:380px;box-sizing:border-box;box-shadow:0 8px 0 var(--btn-edge)}
  .sheet h2{font-family:var(--display);font-weight:400;font-size:24px;margin:0 0 6px;text-wrap:balance}
  .sheet p{margin:0 0 14px;color:var(--ink-2);font-size:14px;line-height:1.45}
  .sheet .big{font-family:var(--display);font-size:34px;color:var(--green);margin:6px 0 14px;font-variant-numeric:tabular-nums}
  .row{display:flex;gap:8px}
  .row button{flex:1;border:0;border-radius:14px;height:46px;font-weight:900;font-size:14px}
  .b-alt{background:var(--lock);box-shadow:0 4px 0 #cfe0d8}
  .b-gold{background:var(--cash);color:var(--cash-ink);box-shadow:0 4px 0 #c79a1e}
  .b-red{background:var(--red);color:#fff;box-shadow:0 4px 0 var(--red-edge)}
  .toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 14px);transform:translateX(-50%);background:var(--ink);color:#fff;font-weight:800;font-size:13px;padding:8px 14px;border-radius:999px;z-index:20;pointer-events:none;white-space:nowrap}
  @media (prefers-reduced-motion: reduce){.hint i,.expand.ready,.up.hot,.up.buy{animation:none}.float,.banner{animation-duration:.01s}}
  @media (max-width:400px){.up-h i{display:none}.up{padding:8px 7px}}
  @media (max-height:680px){.up small{min-height:0}.app{gap:7px;padding-block:8px 10px}.up{padding:7px 7px}.expand{height:42px}.money #money{font-size:28px}}
</style>

<div class="app">
  <header class="hud">
    <div class="loc"><b id="tierName">Corner Stand</b><span id="tierStep">Tier 1 of 5</span></div>
    <div class="money"><span id="money">$0</span><span id="rate">$0 / min</span></div>
    <div class="tools">
      <button class="icon-btn" id="sndBtn" aria-label="Turn sound on"><svg viewBox="0 0 24 24" fill="none" stroke="#1f4250" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h4l5-4v14l-5-4H4z" fill="#1f4250"/><path id="sndWave" d="M16 9l5 6M21 9l-5 6"/></svg></button>
      <button class="icon-btn" id="resetBtn" aria-label="Start over"><svg viewBox="0 0 24 24" fill="none" stroke="#1f4250" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12a8 8 0 1 0 2.4-5.7"/><path d="M4 4v4.5h4.5"/></svg></button>
    </div>
  </header>

  <div class="stage" id="stage">
    <canvas id="cv"></canvas>
    <div class="hint" id="hint"><i></i>Tap machines to upgrade · tap belt to rush</div>
    <div class="rush" id="rushTag" hidden>RUSH ×1.5</div>
  </div>

  <div class="info"><span id="slots">Lemonade · Machines 3/5</span><span class="pay" id="ips">$0/s</span></div>

  <div class="upgrades">
    <button class="up prim" id="bUp"><div class="up-h"><i><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V6M6 11l6-6 6 6"/></svg></i><b id="bUpName">Upgrade</b></div><small></small><span class="cost"></span></button>
    <button class="up" id="bAdd"><div class="up-h"><i><svg viewBox="0 0 24 24"><rect x="3" y="7" width="18" height="11" rx="3" fill="#1fb070"/><rect x="6" y="4" width="12" height="4" rx="1.5" fill="#12804d"/><path d="M12 9.5v6M9 12.5h6" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/><rect x="2" y="19" width="20" height="2.2" rx="1.1" fill="#5c7c86"/></svg></i><b>Add Machine</b></div><small></small><span class="cost"></span></button>
    <button class="up" id="bMkt"><div class="up-h"><i><svg viewBox="0 0 24 24"><path d="M4 10v4l3 .5V9.5z" fill="#ff8a1c"/><path d="M7 9.5l10-5v15l-10-5z" fill="#ff5461"/><path d="M8 14.6l1.5 5h2.6l-1.2-4.6z" fill="#1f4250"/><path d="M19.5 9.5l2-1M19.5 14.5l2 1M20 12h2" stroke="#ff8a1c" stroke-width="1.6" stroke-linecap="round"/></svg></i><b>Marketing</b></div><small></small><span class="cost"></span></button>
  </div>
  <button class="expand" id="bExpand"><div class="fill" id="expFill"></div><span id="expLabel">Expand</span></button>
</div>

<div class="modal" id="modal" hidden><div class="sheet" id="sheet"></div></div>

<script>
(()=>{
'use strict';
const $=s=>document.querySelector(s);
const stage=$('#stage'),cv=$('#cv'),ctx=cv.getContext('2d');
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const TAU=Math.PI*2,clamp=(v,a,b)=>v<a?a:v>b?b:v,ease=t=>t<=0?0:t>=1?1:t*t*(3-2*t),seg=(p,a,b)=>clamp((p-a)/(b-a),0,1);

/* ================= fruit (convex polygons with rind + flesh, from the slicer prototype) ================= */
const FRUIT={
  lemon: {r:8,  ax:1.16,ay:.9, skin:'#ffe03a',rind:'#efc100',flesh:'#fff29a',edge:'#e8d45a',pith:'#fffbe6',juice:'#ffe95c',rw:.9, det:'seg',segc:'#fffdf0'},
  lime:  {r:7.2,ax:1.1, ay:.95,skin:'#8fd14f',rind:'#5ea82a',flesh:'#d9f59a',edge:'#b5dc6a',pith:'#f4ffe0',juice:'#c6ec6a',rw:.8, det:'seg',segc:'#f6ffe6'},
  orange:{r:8.4,ax:1,   ay:1,  skin:'#ff9a1f',rind:'#ec7a0b',flesh:'#ffb547',edge:'#e98f22',pith:'#fff0d0',juice:'#ffa22e',rw:1,  det:'seg',segc:'#fff4dc',pores:1},
  grapefruit:{r:9,ax:1, ay:.97,skin:'#ffc15a',rind:'#f09a2a',flesh:'#ff7a6b',edge:'#e8605a',pith:'#fff1e0',juice:'#ff8672',rw:1.1,det:'seg',segc:'#ffe3dc',pores:1},
  straw: {r:8,  ax:.96, ay:1.02,skin:'#ff3b4e',rind:'#e0233b',flesh:'#ff9aa6',edge:'#ff5a6a',juice:'#ff4a6b',rw:1.5,det:'straw'},
  grape: {r:7,  ax:.92, ay:1.06,skin:'#8e44c9',rind:'#6a2c9e',flesh:'#dff3a8',edge:'#bcd97d',juice:'#a646d8',rw:.7, det:'pips',seed:'#9a7430'},
  pine:  {r:8.6,ax:.84, ay:1.12,skin:'#e0a12e',rind:'#a86a17',flesh:'#ffe25e',edge:'#e9c43c',juice:'#ffe76a',rw:1.1,det:'pine',core:'#fff4b0'},
  mango: {r:8.6,ax:1.12,ay:.88,skin:'#ffb02e',rind:'#e0701a',flesh:'#ffc233',edge:'#f0a020',juice:'#ffb21e',rw:.7, det:'pit',pit:'#fff3c2',blush:'#ff5a3c'},
  dragon:{r:8.4,ax:.92, ay:1.08,skin:'#f23b8f',rind:'#d11f70',flesh:'#fbf7f9',edge:'#e8d4dd',juice:'#ff64ad',rw:.9, det:'dots',seed:'#1c1c1c'},
  gold:  {r:9,  ax:1.06,ay:1,  skin:'#ffcf3a',rind:'#d49b0c',flesh:'#fff1ae',edge:'#ead27a',pith:'#fffbe0',juice:'#ffd23a',rw:1.2,det:'seeds',stripes:'#f2b51c',seed:'#b07d12',glow:1},
  peach: {r:8.4,ax:1,   ay:1,  skin:'#ffa66b',rind:'#f07c4a',flesh:'#ffc46b',edge:'#f0a850',juice:'#ffb070',rw:.6, det:'pit',pit:'#9a4a2a',blush:'#ff5d5d',crease:1}};

/* ================= tiers, machines, economy ================= */
const TIERS=[
  {name:'Corner Stand',    product:'Lemonade',       fruits:['lemon','lemon','lemon','lime'],   tiles:['#fffaf0','#f6ecd2'],grout:'#eadfbf',awn:'#ffd23f',wall:'#fff3cf',rail:'#ffc83d',railD:'#e0a300',box:'#ffe066'},
  {name:'Juice Bar',       product:'Orange Juice',   fruits:['orange','orange','orange','grapefruit'],tiles:['#f2fff8','#d9f5e7'],grout:'#c3e8d6',awn:'#ff8a1c',wall:'#e6fff2',rail:'#ff9a3c',railD:'#d86d0c',box:'#ffb05a'},
  {name:'Bottling Plant',  product:'Berry Smoothies',fruits:['straw','straw','grape'],          tiles:['#f1f8ff','#dbecfb'],grout:'#c6dcf0',awn:'#3fa9f5',wall:'#e6f4ff',rail:'#5cb8ff',railD:'#2a86d6',box:'#8fd0ff'},
  {name:'Smoothie Factory',product:'Tropical Mix',   fruits:['pine','mango','dragon'],          tiles:['#fff3f8','#fcdcea'],grout:'#f1c6d9',awn:'#ff5fa2',wall:'#ffe9f3',rail:'#ff7fb6',railD:'#d9468a',box:'#ff9ccb'},
  {name:'Fruit Empire',    product:'Golden Nectar',  fruits:['gold','gold','peach'],            tiles:['#fffbef','#f7e8bf'],grout:'#ecd79c',awn:'#f2b21c',wall:'#fff5da',rail:'#ffcf3a',railD:'#c9951a',box:'#ffd966'}];
// line order. b = speed factor (the red tag moves between machines), mult = value per bottle
const MACH=[
  {key:'washer',   name:'Washer',        short:'WASHER',  tier:0,mult:1,  b:1.10,col:'#3cc6dc',dark:'#1f94a8'},
  {key:'slicer',   name:'Slicer',        short:'SLICER',  tier:0,mult:1,  b:.95, col:'#ff6f61',dark:'#d24a3d'},
  {key:'press',    name:'Press',         short:'PRESS',   tier:0,mult:1,  b:1.00,col:'#ffc23c',dark:'#d99a11'},
  {key:'mixer',    name:'Flavor Mixer',  short:'MIXER',   tier:3,mult:1.7,b:1.05,col:'#9b6bff',dark:'#6f43d6'},
  {key:'strainer', name:'Pulp Strainer', short:'STRAINER',tier:1,mult:1.6,b:.97, col:'#7fd84a',dark:'#56a92c'},
  {key:'blender',  name:'Blender',       short:'BLENDER', tier:2,mult:1.7,b:1.02,col:'#ff5fa2',dark:'#d63a7e'},
  {key:'infuser',  name:'Nectar Infuser',short:'INFUSER', tier:4,mult:1.7,b:1.08,col:'#ffb81c',dark:'#d58a00'},
  {key:'bottler',  name:'Bottler',       short:'BOTTLER', tier:0,mult:1.8,b:.93, col:'#4aa8ff',dark:'#2479d1'},
  {key:'chiller',  name:'Ice Chiller',   short:'CHILLER', tier:1,mult:1.6,b:1.04,col:'#86dcff',dark:'#45b0dc'},
  {key:'capper',   name:'Capper & Labeler',short:'CAPPER',tier:0,mult:1.6,b:.98, col:'#ff5a5f',dark:'#cc3a40'},
  {key:'garnish',  name:'Fruit Garnisher',short:'GARNISH',tier:2,mult:1.7,b:1.06,col:'#3dbb6a',dark:'#27904d'},
  {key:'gift',     name:'Gift Pack',     short:'GIFT PACK',tier:3,mult:1.7,b:.96,col:'#ff8fc7',dark:'#e0609f'},
  {key:'foil',     name:'Gold Foil',     short:'GOLD FOIL',tier:4,mult:1.7,b:1.03,col:'#f5c542',dark:'#c9951a'}];
const TIER_BUILD=[[7,9],[4,8],[5,10],[3,11],[6,12]];                 // machines added per tier, in build order
const MCOST=[[45,350],[8500,64e3],[2.7e6,2e7],[1.5e9,1.1e10],[3e10,2.2e11]];
const EXP=[800,140e3,45e6,24e9];
const TB=[3,15,75,375,1875];                                             // base $ per bottle for each product
const R0=.4,RG=1.15,CU=3,CG=1.42,MK0=25,MKG=1.65,MKM=1.2,RUSH=1.5;
const ADS=['Flyers','Chalkboard Sign','Balloons','Billboard','Radio Jingle','Lemon Mascot','Food Blogger','TV Ad','Neon Sign','Blimp'];
const adName=n=>n<=ADS.length?ADS[n-1]:'Campaign '+n;
const F_WASH=1,F_MIX=2,F_STRAIN=4,F_BLEND=8,F_NECTAR=16,F_CHILL=32,F_CAP=64,F_GARNISH=128,F_FOIL=256;

const KEY='squeeze-street-v1';
const FRESH=()=>({money:30,tier:0,lv:{truck:1,van:1,0:1,1:1,2:1},built:[0,1,2],mkt:0,t:Date.now(),hint:0,best:1});
const S=FRESH();
try{const s=JSON.parse(localStorage.getItem(KEY)||'null');if(s&&Array.isArray(s.built)&&s.lv)Object.assign(S,s);}catch(e){}
S.tier=clamp(S.tier|0,0,4);S.built=S.built.filter(i=>MACH[i]&&MACH[i].tier<=S.tier);for(const i of[0,1,2])if(!S.built.includes(i))S.built.push(i);
for(const k of['truck','van',...S.built])S.lv[k]=Math.max(1,S.lv[k]|0);S.mkt=Math.max(0,S.mkt|0);if(!isFinite(S.money))S.money=30;
function save(){if(WARM)return;try{S.t=Date.now();localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}

const baseOf=k=>k==='truck'?1:k==='van'?1.05:MACH[k].b;
const rateL=(k,L)=>R0*baseOf(k)*Math.pow(RG,L-1);
const stKeys=s=>['truck',...s.built.slice().sort((a,b)=>a-b),'van'];
function bottleneck(s){let best='truck',r=1e300;for(const k of stKeys(s)){const v=rateL(k,s.lv[k]);if(v<r*(1-1e-9)){r=v;best=k;}}return[best,r];}
const TS=s=>TB[s.tier]/TB[0];
const upCost=(s,k)=>CU*TS(s)*Math.pow(CG,s.lv[k]-1);

function bottlePath(B,x,y){const p=B.p,n=p.length,pts=[];for(let i=0;i<n;i++)pts.push([x+p[i][1],y+p[i][0]]);for(let i=n-1;i>=0;i--)pts.push([x-p[i][1],y+p[i][0]]);

  ctx.fillStyle='rgba(255,255,255,.7)';ctx.fillRect(x-4.4,y-12,1,8);}

/* ---------- one item (plain state) ---------- */
function drawItem(it,x,y,t){const dy=it.drop>0?-it.drop*it.drop*16:0,dx=it.drop>0?it.drop*10*ST[0].dir:0;

let AX=null,muted=true,noiseBuf=null,amb=null;const lastS={};
function initAudio(){if(AX||muted)return;try{AX=new(window.AudioContext||window.webkitAudioContext)();noiseBuf=AX.createBuffer(1,AX.sampleRate*.5|0,AX.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
  const src=AX.createBufferSource();src.buffer=noiseBuf;src.loop=true;const f=AX.createBiquadFilter();f.type='lowpass';f.frequency.value=420;amb=AX.createGain();amb.gain.value=.018;src.connect(f).connect(amb).connect(AX.destination);src.start();}catch(e){AX=null;}}
function ok(name,gap){if(!AX||muted||WARM)return false;const t=AX.currentTime;if(t-(lastS[name]||0)<gap)return false;lastS[name]=t;return true;}
function noise(freq,q,vol,dur,type){try{const t=AX.currentTime,s=AX.createBufferSource();s.buffer=noiseBuf;const f=AX.createBiquadFilter();f.type=type||'bandpass';f.frequency.value=freq;f.Q.value=q;const g=AX.createGain();
  g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(vol,t+.005);g.gain.exponentialRampToValueAtTime(.001,t+dur);s.connect(f).connect(g).connect(AX.destination);s.start(t,Math.random()*.3,dur+.02);}catch(e){}}
function tone(f1,f2,dur,vol,type,delay){try{const t=AX.currentTime+(delay||0),o=AX.createOscillator(),g=AX.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f1,t);o.frequency.exponentialRampToValueAtTime(f2,t+dur);
  g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(vol,t+.01);g.gain.exponentialRampToValueAtTime(.001,t+dur);o.connect(g).connect(AX.destination);o.start(t);o.stop(t+dur+.02);}catch(e){}}

  if(S.lv[k]%10===0){banner(`${nameOf(k)} Lv ${S.lv[k]}`,'★ Speed Star','');blip([784,988,1319],.07);}else blip([660,880],.045,.08);

modal.addEventListener('click',e=>{if(e.target===modal)closeModal();});
$('#resetBtn').addEventListener('click',()=>{openModal(`<h2>Start over?</h2><p>This wipes your cash, machines, levels and marketing so you can play Squeeze Street from the first lemon.</p><div class="row"><button class="b-alt" id="mNo">Keep juicing</button><button class="b-red" id="mYes">Start over</button></div>`);
  $('#mNo').onclick=closeModal;$('#mYes').onclick=()=>{try{localStorage.removeItem(KEY);}catch(_){}const f=FRESH();for(const k in S)delete S[k];Object.assign(S,f);taps=0;$('#hint').hidden=false;
    resize(true);items.length=0;van.crate=0;van.state=0;prewarm(24);closeModal();updateUI();save();};});
function offline(){const away=Math.min(7200,(Date.now()-S.t)/1000);if(away<60)return;const v=incomeSec(S)*away*.5;if(v<1)return;const h=Math.floor(away/3600),m=Math.floor(away%3600/60);
  openModal(`<h2>Welcome back</h2><p>The vans kept delivering for ${h?h+'h ':''}${m}m while you were away (half speed, max 2h).</p><div class="big">+${fmt(v)}</div>
    <div class="row"><button class="b-alt" id="mTake">Collect</button><button class="b-gold" id="mAd">Collect ×2</button></div><p style="margin:10px 0 0;font-size:12px">In the real game ×2 plays a rewarded ad. In this prototype it just doubles.</p>`);
  $('#mTake').onclick=()=>{S.money+=v;closeModal();updateUI();save();};$('#mAd').onclick=()=>{S.money+=v*2;closeModal();updateUI();save();};}

/* ================= layout / camera ================= */
// fit: width-bound camera; spare height goes to row spacing (up to 122), then floor above the line, then sky
function fit(){const rows=Math.ceil((tierSlots(S.tier)+2)/3),base=TOPM+58+32,K0=W/WW,Hv=H/K0;
  const rp=rows>1?clamp((Hv-base-26)/(rows-1),RP,122):RP;let wh=base+(rows-1)*rp;K=Math.min(K0,H/wh);
  const gap=clamp((H/K-wh)*.45,0,46);RPc=Math.round(rp);Y0=Math.round(TOPM+58+gap);WH=Y0+(rows-1)*RPc+32;
  OX=(W-WW*K)/2;OY=H-WH*K-Math.min(6,Math.max(0,(H-WH*K)*.5));}
function resize(force){const r=stage.getBoundingClientRect();const nW=Math.max(120,r.width),nH=Math.max(160,r.height),nd=Math.min(3,window.devicePixelRatio||1);
  if(!force&&nW===W&&nH===H&&nd===dpr)return;W=nW;H=nH;dpr=nd;cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);
  const o1=RPc,o2=Y0;fit();if(force||o1!==RPc||o2!==Y0||!PX){buildLayout();if(!force){items.length=0;prewarm(16);}}paintBg();}

/* ================= loop ================= */
function prewarm(sec){WARM=true;const dt=1/30;for(let i=0;i<sec*30;i++)stepLine(dt);WARM=false;owed=0;for(let i=0;i<PN;i++)pL[i]=0;
  for(const it of items)if(it.form>=2){lastJuice=it.col;break;}}
let last=performance.now(),lastUI=0;
function frame(now){const dt=Math.min(.05,(now-last)/1000);last=now;const t=now/1000;
  stepLine(dt);stepParticles(dt);pumpBanner(dt);draw(t);
  const vs=ST[ST.length-1];if(vs.cur)lastJuice=vs.cur.col;
  if(now-lastUI>150){lastUI=now;updateUI();}
  requestAnimationFrame(frame);}
let roT=0;new ResizeObserver(()=>{clearTimeout(roT);roT=setTimeout(()=>resize(false),60);}).observe(stage);

/* ================= debug: pacing bot using the live economy ================= */
window.__squeeze={state:S,items:()=>items.length,
  simulate(maxT=1200,dt=.25){const s={money:30,tier:0,lv:{truck:1,van:1,0:1,1:1,2:1},built:[0,1,2],mkt:0};const ev=[];let t=0,levels=0;
    while(t<maxT){s.money+=incomeSec(s)*dt;t+=dt;
      for(let g=0;g<8;g++){const I=incomeSec(s),Tm=bottleneck(s)[1],opts=[];
        const tgt=Tm*RG*.999;let c=0;const plan=[];for(const q of stKeys(s)){let L=s.lv[q];while(rateL(q,L)<tgt){c+=CU*TS(s)*Math.pow(CG,L-1);L++;}if(L>s.lv[q])plan.push([q,L]);}
        opts.push({k:'up',cost:c,gain:(RG-1)*I,f:()=>{for(const[q,L]of plan){levels+=L-s.lv[q];s.lv[q]=L;}}});
        opts.push({k:'mkt',cost:mktCost(s),gain:I*(MKM-1),f:()=>{s.mkt++;ev.push([t,'Marketing '+s.mkt]);}});
        const nm=nextMachine(s);
        if(nm)opts.push({k:'m',cost:nm.cost,gain:I*(MACH[nm.idx].mult-1)*1.5,f:()=>{s.lv[nm.idx]=startLevel(s,nm.idx);s.built.push(nm.idx);ev.push([t,'Build '+MACH[nm.idx].name]);}});
        else if(s.tier<4)opts.push({k:'e',cost:EXP[s.tier],gain:I*(TB[s.tier+1]/TB[s.tier]-1)*.6,f:()=>{s.tier++;ev.push([t,'TIER '+(s.tier+1)+' '+TIERS[s.tier].name]);}});
        let o=opts[0];for(const q of opts)if(q.gain/q.cost>o.gain/o.cost)o=q;
        if(s.money>=o.cost){s.money-=o.cost;o.f();if(o.k==='up')ev.push([t,'up']);continue;}break;}}
    const at=re=>{const e=ev.find(e=>re.test(e[1]));return e?e[0]:null;};
    const news=ev.filter(e=>e[1]!=='up'&&e[0]<=900).map(e=>e[0]);let gap=0,prev=0,gapAt=0;for(const x of news){if(x-prev>gap){gap=x-prev;gapAt=prev;}prev=x;}
    const upT=ev.filter(e=>e[1]==='up'&&e[0]<=600).map(e=>e[0]);let ug=0,up=0;for(const x of upT){ug=Math.max(ug,x-up);up=x;}
    return{incomeAt0:incomeSec({money:30,tier:0,lv:{truck:1,van:1,0:1,1:1,2:1},built:[0,1,2],mkt:0}),firstUpgrade:at(/^up$/),firstMachine:at(/^Build/),firstMarketing:at(/^Marketing/),tier2:at(/^TIER 2/),tier3:at(/^TIER 3/),tier4:at(/^TIER 4/),tier5:at(/^TIER 5/),
      longestGapNewThing15min:gap,gapStartsAt:gapAt,longestGapBetweenUpgradeRounds10min:ug,levelsBought:levels,
      milestones:ev.filter(e=>e[1]!=='up').map(e=>Math.round(e[0])+'s '+e[1])};}};

/* ================= boot ================= */
if(S.hint)$('#hint').hidden=true;
resize(true);prewarm(26);updateUI();draw(performance.now()/1000);offline();
setInterval(save,5000);document.addEventListener('visibilitychange',()=>{if(document.hidden)save();});
requestAnimationFrame(t=>{last=t;requestAnimationFrame(frame);});
})();
</script>
