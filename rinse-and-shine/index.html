<style>

  for(let i=0;i<PN;i++){if(pLife[i]<=0)continue;pLife[i]-=dt;if(pLife[i]<=0){pPos[i*3+1]=-99;continue;}
    pVel[i*3+1]-=pGrav[i]*dt;pPos[i*3]+=pVel[i*3]*dt;pPos[i*3+1]+=pVel[i*3+1]*dt;pPos[i*3+2]+=pVel[i*3+2]*dt;if(pPos[i*3+1]<.02&&pGrav[i]>0){pLife[i]=0;pPos[i*3+1]=-99;}}
  pGeo.attributes.position.needsUpdate=true;pGeo.attributes.color.needsUpdate=true;
  {const g=9.8*D/3;for(let i=0;i<CN;i++){if(cLife[i]<=0)continue;cLife[i]-=dt;cVel[i*3+1]-=g*dt;cPos[i*3]+=cVel[i*3]*dt;cPos[i*3+1]+=cVel[i*3+1]*dt;cPos[i*3+2]+=cVel[i*3+2]*dt;
    if(cPos[i*3+1]<.03){cPos[i*3+1]=.03;cVel[i*3]*=.5;cVel[i*3+2]*=.5;cVel[i*3+1]=0;}if(cLife[i]<=0)cPos[i*3+1]=-99;}
  cGeo.attributes.position.needsUpdate=true;chunkMat.size=.13*D/3;chunkMat.color.copy(cMud).multiplyScalar(.7);}
  if(hiss&&AC&&!muted)hiss.gain.setTargetAtTime(Math.min(.09,spraying*.025),AC.currentTime,.05);
  if(now-lastUI>150){lastUI=now;updateUI();}
}

/* ================= actions ================= */
function bump(el){el.classList.remove('buy');void el.offsetWidth;el.classList.add('buy');}
let tt=null;function toast(m){let t=$('.toast');if(!t){t=document.createElement('div');t.className='toast';document.body.appendChild(t);}t.textContent=m;t.hidden=false;clearTimeout(tt);tt=setTimeout(()=>t.hidden=true,1600);}
$('#bAdd').addEventListener('click',e=>{initAudio();if(S.noz.length>=T().slots){toast(findPair()?'Slots full — merge two nozzles!':'Slots full — clear this level for +1 slot');return;}
  const c=addCost();if(S.money<c){toast(`Need ${fmt(c-S.money)} more`);return;}
  S.money-=c;S.noz.push(1);const n=makeNozzle(1);n.pop=1;nozzles.push(n);blip([660,880],.05,.1);bump(e.currentTarget);updateUI();save();});
$('#bMerge').addEventListener('click',e=>{initAudio();const L=findPair();if(!L){toast('Need two nozzles of the same level');return;}
  const c=mergeCost();if(S.money<c){toast(`Need ${fmt(c-S.money)} more`);return;}
  S.money-=c;const ids=[];for(let i=nozzles.length-1;i>=0&&ids.length<2;i--)if(nozzles[i].lv===L)ids.push(i);
  const mid=nozzles[ids[0]].g.position.clone().add(nozzles[ids[1]].g.position).multiplyScalar(.5);
  ids.sort((a,b)=>b-a).forEach(i=>{killNozzle(nozzles[i]);nozzles.splice(i,1);});
  const n=makeNozzle(L+1,mid);n.pop=1;nozzles.splice(Math.min(...ids),0,n);S.noz=nozzles.map(x=>x.lv);
  for(let k=0;k<30;k++)emit(mid,tB.set(0,-1,0),Math.random()<.5?cGold:cWhite,1,1.4,-.5);
  if(L+1>S.seen){S.seen=L+1;banner('New nozzle unlocked',LV[L].name);blip([784,988,1319,1568],.08);}else blip([523,784],.07);
  bump(e.currentTarget);updateUI();save();});
$('#bStation').addEventListener('click',e=>{initAudio();const c=stCost();if(S.money<c){toast(`Need ${fmt(c-S.money)} more`);return;}
  S.money-=c;S.soap++;banner('Better soap',`Pay ×${soapMult().toFixed(2)}`);blip([523,659,784],.07);bump(e.currentTarget);updateUI();save();});
function setBtn(el,sub,cost,state){el.querySelector('small').textContent=sub;el.querySelector('.cost').textContent=cost;el.className='up'+(state?' '+state:'');}
function updateUI(){
  $('#money').textContent=fmt(S.money);const rpm=ratePerMin();$('#rate').textContent=fmt(rpm)+' / min';if(rpm>0)S.rate=rpm/60;
  const Ti=T(),full=S.noz.length>=Ti.slots,pair=findPair();
  $('#bayName').textContent=Ti.name;$('#bayStep').textContent='Next: '+OBJ[keyOf(S.level+1)][0];
  if(cur){const pct=Math.max(0,Math.min(100,(1-cur.remain/cur.tot)/DONE*100));$('#barFill').style.width=pct+'%';$('#pct').textContent=Math.floor(pct)+'% clean';$('#objPay').textContent='Level pays '+fmt(jobValue());}
  $('#slots').textContent=`Nozzles ${S.noz.length}/${Ti.slots}`+(cur?` · Parts ${cur.bigDone}/${cur.big}`:'');
  const ac=addCost();setBtn($('#bAdd'),full?'Slots full':`${S.noz.length}/${Ti.slots} slots · Lv 1`,full?'FULL':fmt(ac),full?'off':S.money<ac?'poor':'');
  const mc=mergeCost();setBtn($('#bMerge'),pair?`2× ${LV[pair-1].name} → ${LV[pair].name}`:'Need 2 of the same level',pair?fmt(mc):'—',!pair?'off':S.money<mc?'poor':full?'hot':'');
  const sc=stCost();setBtn($('#bStation'),`Pay ×${soapMult().toFixed(2)} → ×${(soapMult()*1.25).toFixed(2)}`,fmt(sc),S.money<sc?'poor':'');
}

/* ================= modals ================= */
const modal=$('#modal'),sheet=$('#sheet');
function open(html){sheet.innerHTML=html;modal.hidden=false;}function close(){modal.hidden=true;}
modal.addEventListener('click',e=>{if(e.target===modal)close();});
$('#resetBtn').addEventListener('click',()=>{open(`<h2>Start over?</h2><p>This wipes your cash, nozzles, stations and bays so you can play the prototype from the beginning.</p><div class="row"><button class="b-alt" id="mNo">Keep playing</button><button class="b-red" id="mYes">Start over</button></div>`);
  $('#mNo').onclick=close;$('#mYes').onclick=()=>{try{localStorage.removeItem(KEY);}catch(_){ }Object.assign(S,FRESH());earnLog.length=0;t0=performance.now();
    applyTierLook(true);buildNozzles();spawn();close();updateUI();};});
function offline(){const away=Math.min(7200,(Date.now()-S.t)/1000);if(away<60||!S.rate)return;const v=S.rate*away*.5;if(v<1)return;const h=Math.floor(away/3600),m=Math.floor(away%3600/60);
  open(`<h2>Welcome back</h2><p>Your nozzles kept washing for ${h?h+'h ':''}${m}m while you were away (half speed, max 2h).</p><div class="big">+${fmt(v)}</div>
    <div class="row"><button class="b-alt" id="mTake">Collect</button><button class="b-gold" id="mAd">Collect ×2</button></div><p style="margin:10px 0 0;font-size:12px">In the real game ×2 plays a rewarded ad. In this prototype it just doubles.</p>`);
  $('#mTake').onclick=()=>{S.money+=v;close();updateUI();save();};$('#mAd').onclick=()=>{S.money+=v*2;close();updateUI();save();};}

/* ================= boot ================= */
resize();applyTierLook(true);buildNozzles();spawn();updateUI();offline();
setInterval(save,5000);document.addEventListener('visibilitychange',()=>{if(document.hidden)save();});
requestAnimationFrame(t=>{last=t;requestAnimationFrame(frame);});
</script>

</body></html>
