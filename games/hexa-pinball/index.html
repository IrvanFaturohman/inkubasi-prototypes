<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#0d1222" />
    <title>Hexa Pinball</title>
    <link rel="icon" href="data:," />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0d1222;
        overflow: hidden;
        touch-action: none;
        overscroll-behavior: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #game {
        width: 100vw;
        height: 100vh;
        height: 100dvh;
      }
      @media (min-aspect-ratio: 10/16) {
        body {
          background: radial-gradient(circle at 50% 30%, #1a2244, #06080f 70%);
        }
        #game {
          height: min(94vh, 1280px);
          width: calc(min(94vh, 1280px) * 9 / 16);
          border-radius: 30px;
          overflow: hidden;
          box-shadow:
            0 0 0 10px #10162a,
            0 0 0 12px #262f52,
            0 30px 90px rgba(0, 0, 0, 0.65);
        }
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
