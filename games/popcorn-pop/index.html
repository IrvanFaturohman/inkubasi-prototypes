<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#f3d8b4" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='24' cy='26' r='14' fill='%23fff8ec'/%3E%3Ccircle cx='40' cy='24' r='13' fill='%23fff3dc'/%3E%3Ccircle cx='32' cy='38' r='15' fill='%23fffaf0'/%3E%3Ccircle cx='31' cy='37' r='4' fill='%23f6b93b'/%3E%3C/svg%3E"
    />
    <title>Popcorn Pop!</title>
  </head>
  <body data-kiosk="cinema">
    <div id="app">
      <header id="hud">
        <div class="hud-row">
          <button id="btn-kiosk" class="chip" aria-label="Switch kiosk">
            <svg viewBox="0 0 24 24" class="ico"><path d="M3.5 9.5 5.5 4h13l2 5.5" /><path d="M5 10v10h14V10" /><path d="M3.5 9.5c0 1.4 1.1 2.5 2.5 2.5s2.5-1.1 2.5-2.5c0 1.4 1.1 2.5 2.5 2.5s2.5-1.1 2.5-2.5c0 1.4 1.1 2.5 2.5 2.5s2.5-1.1 2.5-2.5" /><path d="M10 20v-5h4v5" /></svg>
            <span id="loc-name">CINEMA POPCORN</span>
            <svg viewBox="0 0 24 24" class="ico chev"><path d="m7 10 5 5 5-5" /></svg>
            <span id="kiosk-badge" class="badge" hidden>!</span>
          </button>
          <div class="hud-icons">
            <button id="btn-mute" class="icon-btn" aria-label="Toggle sound">
              <svg viewBox="0 0 24 24" class="ico on"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z" class="fill" /><path d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11" /></svg>
              <svg viewBox="0 0 24 24" class="ico off"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z" class="fill" /><path d="m16 9.5 5 5M21 9.5l-5 5" /></svg>
            </button>
            <button id="btn-menu" class="icon-btn" aria-label="Menu">
              <svg viewBox="0 0 24 24" class="ico"><path d="M5 7h14M5 12h14M5 17h14" /></svg>
            </button>
          </div>
        </div>
        <div class="money-row">
          <span class="coin big"></span>
          <span id="money">40</span>
          <span id="income" class="pill">+0/s</span>
        </div>
        <div id="mission" class="mission">
          <svg viewBox="0 0 24 24" class="star"><path d="m12 3 2.7 5.6 6.1.8-4.5 4.2 1.1 6.1L12 16.8l-5.4 2.9 1.1-6.1-4.5-4.2 6.1-.8z" /></svg>
          <div class="mission-body">
            <div class="mission-top">
              <span id="mission-title">Sell 5 cups</span>
              <span id="mission-count">0/5</span>
            </div>
            <div class="bar"><i id="mission-bar"></i></div>
          </div>
          <span id="mission-reward" class="reward"><span class="coin"></span>60</span>
        </div>
      </header>

      <main id="stage">
        <canvas id="scene"></canvas>
        <div id="labels"></div>
        <div id="toast" class="toast" hidden></div>
        <button id="btn-shake" aria-label="Shake the pot">
          <span class="in">
            <svg viewBox="0 0 24 24" class="ico"><path d="M4 12c2-3 4 3 6 0s4 3 6 0 4 3 4 3" /><path d="M6 7l1.5-2M12 6V3.5M18 7l-1.5-2" /></svg>
            <b id="shake-label">SHAKE</b>
          </span>
        </button>
        <div id="fade"></div>
      </main>

      <footer id="upgrades">
        <button class="upg" data-kind="feed" style="--accent: var(--butter); --accent-deep: #e0a526">
          <span class="hint">SLOWEST</span>
          <span class="upg-top">
            <svg viewBox="0 0 24 24" class="upg-ico"><path d="M12 21c-3.6-2.9-5.5-6-5.5-9a5.5 5.5 0 0 1 11 0c0 3-1.9 6.1-5.5 9z" /><path d="M10 9.5c.4-1 1.1-1.5 2-1.6" class="shine" /></svg>
            <span class="nm"><b>FEED</b><span class="lv">LV 1</span></span>
          </span>
          <span class="stat">1.18 → 1.39/s</span>
          <span class="sub">kernels per sec</span>
          <span class="price"><span class="coin"></span><span class="cost">20</span></span>
        </button>
        <button class="upg" data-kind="heat" style="--accent: var(--orange); --accent-deep: #cf6522">
          <span class="hint">SLOWEST</span>
          <span class="upg-top">
            <svg viewBox="0 0 24 24" class="upg-ico"><path d="M12 22a6 6 0 0 1-6-6c0-3 2-5 3-6.5.3 1.6 1 2.6 2 3-.5-3.5 1-7 3-9.5.5 3.5 4 6 4 11a6 6 0 0 1-6 8z" /></svg>
            <span class="nm"><b>HEAT</b><span class="lv">LV 1</span></span>
          </span>
          <span class="stat">0.91 → 1.07/s</span>
          <span class="sub">pops per sec</span>
          <span class="price"><span class="coin"></span><span class="cost">25</span></span>
        </button>
        <button class="upg" data-kind="pack" style="--accent: var(--teal); --accent-deep: #17897e">
          <span class="hint">SLOWEST</span>
          <span class="upg-top">
            <svg viewBox="0 0 24 24" class="upg-ico"><path d="M5 9h14l-1.8 12H6.8z" /><circle cx="8.5" cy="7.5" r="2.5" class="pc" /><circle cx="12" cy="6" r="3" class="pc" /><circle cx="15.5" cy="7.5" r="2.5" class="pc" /></svg>
            <span class="nm"><b>PACK</b><span class="lv">LV 1</span></span>
          </span>
          <span class="stat">0.71 → 0.82/s</span>
          <span class="sub">Lv5: +1 cup</span>
          <span class="price"><span class="coin"></span><span class="cost">25</span></span>
        </button>
      </footer>
    </div>
    <div id="overlay"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
