<!doctype html><html><head>
<meta name="viewport" content="width=device-width, initial-scale=1"><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Knock-On Factory</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;700;800;900&display=swap">
<style>
  :root{
    color-scheme: light;
    --paper:#f5e9d2; --ink:#2e1f16; --ink-2:#6f5847;
    --btn:#fffaf1; --btn-edge:#d6be98; --lock:#f1e3c9;
    --cash:#ffb627; --cash-ink:#5b3500;
    --tomato:#e8572a; --tomato-edge:#a63a17; --tomato-dim:#c9a88a; --tomato-dim-edge:#a88b70;
    --merge:#7b3fe4; --merge-edge:#5427a8;
    --display:"Lilita One","Arial Rounded MT Bold","Trebuchet MS",system-ui,sans-serif;
    --body:"Nunito","Segoe UI",system-ui,-apple-system,sans-serif;
  }
  [hidden]{display:none!important}
  html,body{height:100%;margin:0}
  body{background:var(--paper);color:var(--ink);font-family:var(--body);font-weight:700;overflow:hidden;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
  .app{height:100%;max-width:480px;margin:0 auto;display:flex;flex-direction:column;gap:10px;padding-inline:16px;padding-block:10px 12px;box-sizing:border-box}
  button{font-family:inherit;color:inherit;cursor:pointer}
  button:focus-visible{outline:3px solid var(--tomato);outline-offset:2px}

  .hud{display:flex;align-items:center;gap:10px}
  .loc{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1}
  .loc b{font-family:var(--display);font-weight:400;font-size:15px;line-height:1.05;letter-spacing:.03em;text-transform:uppercase;color:var(--tomato)}
  .loc span{font-size:12px;color:var(--ink-2);font-weight:800}
  .money{text-align:center;display:flex;flex-direction:column;line-height:1;flex:none}
  .money #money{font-family:var(--display);font-size:clamp(28px,8vw,36px);color:var(--ink);font-variant-numeric:tabular-nums}
  .money #rate{font-size:12px;color:var(--ink-2);margin-top:3px;font-variant-numeric:tabular-nums}
  .tools{flex:1;display:flex;justify-content:flex-end;gap:6px}
  .icon-btn{width:38px;height:38px;border-radius:12px;border:0;background:var(--btn);box-shadow:0 3px 0 var(--btn-edge);display:grid;place-items:center;flex:none}
  .icon-btn svg{width:20px;height:20px}

  .stage{position:relative;flex:1;min-height:200px;border-radius:22px;overflow:hidden;background:#c48a55;box-shadow:inset 0 0 0 3px rgba(46,31,22,.14)}
  #cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
  .hint{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);background:rgba(46,31,22,.84);color:#fff;font-weight:800;font-size:13px;padding:7px 14px 7px 10px;border-radius:999px;display:flex;align-items:center;gap:8px;pointer-events:none;white-space:nowrap}
  .hint i{width:16px;height:16px;border-radius:50%;background:var(--cash);box-shadow:0 0 0 3px rgba(255,182,39,.35);animation:tap 1.2s ease-in-out infinite}
  @keyframes tap{0%,100%{transform:scale(1)}50%{transform:scale(.7)}}
  .banner{position:absolute;left:50%;top:24%;transform:translate(-50%,-50%);background:var(--ink);color:#fff;border-radius:16px;padding:10px 18px 12px;text-align:center;pointer-events:none;box-shadow:0 5px 0 rgba(0,0,0,.25);animation:bn 2.2s ease-out forwards;white-space:nowrap}
  .banner small{display:block;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--cash);font-weight:900}
  .banner b{font-family:var(--display);font-weight:400;font-size:26px}
  @keyframes bn{0%{opacity:0;transform:translate(-50%,-50%) scale(.6)}12%{opacity:1;transform:translate(-50%,-50%) scale(1.08)}20%{transform:translate(-50%,-50%) scale(1)}85%{opacity:1}100%{opacity:0;transform:translate(-50%,-70%)}}

  .info{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:13px;color:var(--ink-2);font-weight:800;font-variant-numeric:tabular-nums}
  .info span:first-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ips{font-family:var(--display);font-weight:400;color:var(--tomato);font-size:17px;white-space:nowrap}

  .upgrades{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .up{border:0;border-radius:16px;background:var(--btn);box-shadow:0 4px 0 var(--btn-edge);padding:9px 8px 9px;display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:left;min-width:0;transition:transform .06s}
  .up:active{transform:translateY(3px);box-shadow:0 1px 0 var(--btn-edge)}
  .up-h{display:flex;align-items:center;gap:6px;min-width:0}
  .up-h i{width:26px;height:26px;border-radius:8px;background:var(--lock);display:grid;place-items:center;flex:none}
  .up-h i svg{width:18px;height:18px}
  .up-h b{font-size:13px;font-weight:900;line-height:1.1}
  .up small{font-size:11px;color:var(--ink-2);line-height:1.2;min-height:2.4em;width:100%}
  .cost{font-family:var(--display);font-size:14px;background:var(--cash);color:var(--cash-ink);padding:2px 9px;border-radius:8px;font-variant-numeric:tabular-nums}
  .up.poor .cost,.up.off .cost{background:var(--lock);color:var(--ink-2)}
  .up.off{opacity:.62}
  .up.hot{background:var(--merge);color:#fff;box-shadow:0 4px 0 var(--merge-edge);animation:glow 1.2s ease-in-out infinite}
  .up.hot small{color:#e6dcff}.up.hot .up-h i{background:rgba(255,255,255,.2)}
  .up.hot .cost{background:var(--cash);color:var(--cash-ink)}
  .up.buy{animation:pop .25s}
  @keyframes pop{50%{transform:scale(1.05)}}
  @keyframes glow{50%{filter:brightness(1.15)}}

  .expand{position:relative;overflow:hidden;border:0;border-radius:14px;height:46px;font-weight:900;font-size:14px;background:var(--tomato-dim);color:#fff;box-shadow:0 4px 0 var(--tomato-dim-edge);flex:none}
  .expand .fill{position:absolute;inset:0;width:0;background:var(--tomato);transition:width .15s linear}
  .expand span{position:relative}
  .expand.ready{background:var(--tomato);box-shadow:0 4px 0 var(--tomato-edge);animation:glow 1.2s ease-in-out infinite}

  .modal{position:fixed;inset:0;background:rgba(40,24,14,.55);display:grid;place-items:center;padding-inline:16px;z-index:10}
  .sheet{background:#fffaf1;border-radius:22px;padding:20px;width:100%;max-width:380px;box-sizing:border-box;box-shadow:0 8px 0 var(--btn-edge)}
  .sheet h2{font-family:var(--display);font-weight:400;font-size:24px;margin:0 0 6px;text-wrap:balance}
  .sheet p{margin:0 0 14px;color:var(--ink-2);font-size:14px;line-height:1.45}
  .sheet .big{font-family:var(--display);font-size:34px;color:var(--tomato);margin:6px 0 14px;font-variant-numeric:tabular-nums}
  .row{display:flex;gap:8px}
  .row button{flex:1;border:0;border-radius:14px;height:46px;font-weight:900;font-size:14px}
  .b-alt{background:var(--lock);box-shadow:0 4px 0 #d9c49f}
  .b-gold{background:var(--cash);color:var(--cash-ink);box-shadow:0 4px 0 #c48a12}
  .b-red{background:#d6452b;color:#fff;box-shadow:0 4px 0 #9c2f1c}
  .toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 14px);transform:translateX(-50%);background:var(--ink);color:#fff;font-weight:800;font-size:13px;padding:8px 14px;border-radius:999px;z-index:20;pointer-events:none;white-space:nowrap}
  @media (prefers-reduced-motion: reduce){.hint i,.expand.ready,.up.hot,.up.buy{animation:none}.banner{animation-duration:.01s}}
  @media (max-height:680px){.up small{min-height:0}.app{gap:7px;padding-block:8px 10px}}
</style>

<div class="app">
  <header class="hud">
    <div class="loc"><b id="tierName">Garage Workshop</b><span id="tierStep">Tier 1 of 5</span></div>
    <div class="money"><span id="money">$0</span><span id="rate">$0 / min</span></div>
    <div class="tools">
      <button class="icon-btn" id="sndBtn" aria-label="Turn sound on"><svg viewBox="0 0 24 24" fill="none" stroke="#2e1f16" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h4l5-4v14l-5-4H4z" fill="#2e1f16"/><path id="sndWave" d="M16 9l5 6M21 9l-5 6"/></svg></button>
      <button class="icon-btn" id="resetBtn" aria-label="Start over"><svg viewBox="0 0 24 24" fill="none" stroke="#2e1f16" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12a8 8 0 1 0 2.4-5.7"/><path d="M4 4v4.5h4.5"/></svg></button>
    </div>
  </header>

  <div class="stage" id="stage">
    <canvas id="cv"></canvas>
    <div class="hint" id="hint"><i></i>Every machine pays &#183; tap to boost</div>
  </div>

  <div class="info"><span id="status">Balls 1/6 &#183; Machines 0/1</span><span class="ips" id="ips">$0/s</span></div>

  <div class="upgrades">
    <button class="up" id="bAdd"><div class="up-h"><i><svg viewBox="0 0 24 24"><circle cx="10" cy="13" r="7" fill="#3a86ff"/><path d="M6 11c2-3 5-3 7-1" stroke="#ffb627" stroke-width="2" fill="none" stroke-linecap="round"/><circle cx="8" cy="10" r="1.6" fill="#fff" opacity=".8"/><path d="M19 3v6M16 6h6" stroke="#e8572a" stroke-width="2.4" stroke-linecap="round"/></svg></i><b>Add Ball</b></div><small></small><span class="cost"></span></button>
    <button class="up" id="bMerge"><div class="up-h"><i><svg viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-width="2.4"><circle cx="5.5" cy="6" r="3" fill="#7b3fe4" stroke="none"/><circle cx="18.5" cy="6" r="3" fill="#7b3fe4" stroke="none"/><path d="M7.5 9l4.5 5M16.5 9L12 14" stroke="#7b3fe4"/><circle cx="12" cy="18.5" r="4" fill="#7b3fe4" stroke="none"/></svg></i><b>Merge</b></div><small></small><span class="cost"></span></button>
    <button class="up" id="bStation"><div class="up-h"><i><svg viewBox="0 0 24 24"><path d="M12 2.5l1.6 2.6 3-.7.4 3 2.8 1.3-1.3 2.8 1.3 2.8-2.8 1.3-.4 3-3-.7L12 21.5l-1.6-2.6-3 .7-.4-3-2.8-1.3 1.3-2.8-1.3-2.8 2.8-1.3.4-3 3 .7z" fill="#e8572a"/><circle cx="12" cy="12" r="3.4" fill="#fff4e0"/></svg></i><b>Add Machine</b></div><small></small><span class="cost"></span></button>
  </div>
  <button class="expand" id="bExpand"><div class="fill" id="expFill"></div><span id="expLabel">Bigger Floor</span></button>
</div>

<div class="modal" id="modal" hidden><div class="sheet" id="sheet"></div></div>

<script>
(function(){
'use strict';
const $=s=>document.querySelector(s);
const stage=$('#stage'),cv=$('#cv'),ctx=cv.getContext('2d');
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const TAU=Math.PI*2;
const FONT='"Lilita One","Arial Rounded MT Bold","Trebuchet MS",system-ui,sans-serif';
const UIFONT='"Nunito","Segoe UI",system-ui,sans-serif';

/* ================= design data ================= */
const TIERS=[
  {name:'Garage Workshop',R:3,slots:6,st:1,exp:400,base:1.1,
   pal:{rail:'#7a4a26',top:'#e7b06f',frame:'#4a3222',steel:'#6d7b84',accent:'#e8572a',label:'rgba(46,31,22,.78)',floor:'#8e8b86',chan:'rgba(60,30,10,.16)',dark:0}},
  {name:'Toy Factory',R:4,slots:8,st:2,exp:5000,base:3.2,
   pal:{rail:'#e63946',top:'#ffd23f',frame:'#2f6fe0',steel:'#8aa1c2',accent:'#ff8fab',label:'rgba(70,30,70,.78)',floor:'#7fc4e8',chan:'rgba(120,40,90,.12)',dark:0}},
  {name:'Clock Tower',R:5,slots:10,st:3,exp:60000,base:10,
   pal:{rail:'#b08530',top:'#f7d98b',frame:'#24160f',steel:'#9c8a6a',accent:'#d4a017',label:'rgba(255,236,200,.85)',floor:'#3d2a22',chan:'rgba(0,0,0,.2)',dark:1}},
  {name:'Science Lab',R:6,slots:12,st:4,exp:800000,base:30,
   pal:{rail:'#4f6d7a',top:'#dffaff',frame:'#2f4858',steel:'#7d98a3',accent:'#00b4d8',label:'rgba(30,60,70,.8)',floor:'#a9bcc0',chan:'rgba(20,60,80,.12)',dark:0}},
  {name:'Space Station',R:7,slots:14,st:5,exp:null,base:105,
   pal:{rail:'#8d99ae',top:'#7df9ff',frame:'#0d1026',steel:'#6c7896',accent:'#b388ff',label:'rgba(220,230,255,.85)',floor:'#2b3150',chan:'rgba(125,249,255,.08)',dark:1}}
];
const BALLS=['Marble','Steel Ball','Bowling Ball','Bronze Orb','Glass Orb','Magma Ball','Plasma Orb','Planet'];
const GLOW=[null,null,null,null,'#7ff3ff','#ff8a1f','#ff5cf0',null];
const MACH=[{name:'Domino Run',b:.5},{name:'Bell Tower',b:.8},{name:'Xylophone Ramp',b:1.2},{name:'Catapult',b:1.8},{name:'Gear Works',b:2.6}];
const D_LIFT=2.2,D_TOP=.35,D_RAMP=1.5,D_TURN=.45,D_RUN=1.0,RA=.45,GAP=.5;
const DOMC=['#e63946','#ffb627','#3a86ff','#06a77d'];
const XYC=['#ef476f','#f78c3b','#ffd166','#7bd389','#06d6a0','#26a8e0','#5b6cf0','#a45bf0'];
const PINC=['#e63946','#ffb627','#3a86ff','#06d6a0'];

/* ================= state & economy ================= */
const KEY='knock-on-factory-v1';
const FRESH=()=>({money:30,tier:0,balls:[1],st:0,buys:0,merges:0,seen:1,rate:0,t:Date.now(),hint:0});
const S=FRESH();
try{const s=JSON.parse(localStorage.getItem(KEY)||'null');if(s&&Array.isArray(s.balls))Object.assign(S,s);}catch(e){}
S.tier=Math.max(0,Math.min(TIERS.length-1,S.tier|0));S.st=Math.max(0,Math.min(TIERS[S.tier].st,S.st|0));
S.balls=S.balls.filter(l=>l>=1&&l<=8).slice(0,TIERS[S.tier].slots);if(!isFinite(S.money))S.money=30;
function save(){try{S.t=Date.now();S.balls=balls.map(b=>b.lv);S.rate=incomePerSec();localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
const T=()=>TIERS[S.tier];
const pw=l=>Math.pow(2.2,l-1);
const addCost=()=>12*Math.pow(1.3,S.buys),mergeCost=()=>20*Math.pow(1.38,S.merges),stCost=()=>60*Math.pow(7,S.st);
function mult(){let m=1;for(let i=0;i<S.st;i++)m+=MACH[i].b;return m;}
function fmt(n){if(n<1000)return '$'+(n<10&&n%1?n.toFixed(1):Math.floor(n).toLocaleString('en-US'));const u=['K','M','B','T','Qa'];let i=-1;while(n>=1000&&i<u.length-1){n/=1000;i++;}
  return '$'+parseFloat(n<10?n.toFixed(2):n<100?n.toFixed(1):Math.floor(n))+u[i];}
function fmtS(n){return n<10?'$'+(Math.round(n*10)/10):fmt(n);}

/* ================= runtime ================= */
let balls=[],clock=0,boost=0,SIM=false,tokens=8,tierFx=-9,flash=0;
const FX={pin:{hit:-9,a:0,w:1.2},bump:[],bulb:{hit:-9}};
const MS=[];for(let m=0;m<5;m++)MS.push({build:-9,hit:-9,dom:new Float64Array(8).fill(-9),bars:new Float64Array(8).fill(-9),land:-9,a:0,w:.35});
function mkBall(lv){return{lv,show:lv,t:0,next:0,q:false,x:0,y:0,px:NaN,rot:Math.random()*TAU,pop:0,trail:0};}

/* ================= geometry ================= */
let cw=1,ch=1,dpr=1,G={k:1,r1:6},SEG=[],RS=[],LAP=0,EV=[],PP=[],nPay=0;const RL=[6,6,6,6,6,6,6,6];
const P={x:0,y:0,seg:0,u:0,ramp:-1,type:''};
const fOfU=u=>(-RA+Math.sqrt(RA*RA+4*(1-RA)*u))/(2*(1-RA));
function layout(){
  const oldLap=LAP,R=T().R,W=cw,H=ch;
  let k=Math.max(.62,Math.min(1.2,((H-60)/R)/64));
  const r1=6.5*k,yLT=18*k+r1+6,y0=yLT+8*k,yBot=H-r1-12*k,sp=(yBot-y0)/R,drop=sp*.34,rt=Math.min(20*k,(sp-drop)/2);
  const lx=W-12-r1-5*k,xl=12+rt+r1+12*k,xr=lx-2*r1-20*k-rt;
  G={W,H,k,r1,yLT,y0,yBot,sp,drop,rt,lx,xl,xr,R,hop:Math.min(sp*.55,36*k)};
  SEG=[];RS=[];let t=0;const push=s=>{s.t0=t;t+=s.dur;SEG.push(s);return s;};
  push({type:'lift',dur:D_LIFT});push({type:'top',dur:D_TOP});
  for(let i=0;i<R;i++){const dir=i%2?1:-1,ys=y0+i*sp;
    RS.push(push({type:'ramp',dur:D_RAMP,i,dir,xs:dir<0?xr:xl,xe:dir<0?xl:xr,ys,ye:ys+drop}));
    if(i<R-1||dir<0){const yA=ys+drop,yB=y0+(i+1)*sp;push({type:'turn',dur:D_TURN,side:dir,cx:dir<0?xl:xr,yA,yB,c1:yA+rt,c2:yB-rt});}}
  if(R%2)push({type:'run',dur:D_RUN,xs:xl,xe:lx});else push({type:'chute',dur:D_RUN,xs:xr,ys:y0+(R-1)*sp+drop});
  LAP=t;
  if(oldLap&&Math.abs(oldLap-LAP)>1e-6)for(const b of balls)b.t=b.t/oldLap*LAP;
  buildEvents();makeSprites();drawStatic();
}
function segPt(s,f,o){const g=G;o.type=s.type;o.ramp=-1;o.u=f;
  switch(s.type){
    case 'lift':o.x=g.lx;o.y=g.yBot+(g.yLT-g.yBot)*f;break;
    case 'top':{const a=(1-f)*(1-f),b=2*(1-f)*f,c=f*f;o.x=a*g.lx+b*(g.lx-2*g.k)+c*g.xr;o.y=a*g.yLT+b*(g.yLT-16*g.k)+c*g.y0;break;}
    case 'ramp':{const u=RA*f+(1-RA)*f*f;o.u=u;o.ramp=s.i;o.x=s.xs+(s.xe-s.xs)*u;o.y=s.ys+g.drop*u;break;}
    case 'turn':{const rt=g.rt,L=s.c2-s.c1,a=Math.PI/2*rt,d=f*(2*a+L);
      if(d<a){const p=d/rt;o.x=s.cx+s.side*rt*Math.sin(p);o.y=s.c1-rt*Math.cos(p);}
      else if(d<a+L){o.x=s.cx+s.side*rt;o.y=s.c1+(d-a);}
      else{const p=(d-a-L)/rt;o.x=s.cx+s.side*rt*Math.cos(p);o.y=s.c2+rt*Math.sin(p);}break;}
    case 'run':o.x=s.xs+(s.xe-s.xs)*f;o.y=g.yBot;break;
    case 'chute':{const e=.35*f+.65*f*f,a=(1-e)*(1-e),b=2*(1-e)*e,c=e*e;o.x=a*s.xs+b*g.lx+c*g.lx;o.y=a*s.ys+b*s.ys+c*g.yBot;break;}
  }}
function posAt(t,o){let j=SEG.length-1;while(j>0&&t<SEG[j].t0)j--;const s=SEG[j];o.seg=j;segPt(s,Math.min(1,Math.max(0,(t-s.t0)/s.dur)),o);}
const RP={x:0,y:0,sy:0,th:0,dir:1};
function rp(i,u){const s=RS[i];RP.x=s.xs+(s.xe-s.xs)*u;RP.y=s.ys+G.drop*u;RP.sy=RP.y+G.r1+1;RP.dir=s.dir;RP.th=s.dir*Math.atan2(G.drop,Math.abs(s.xe-s.xs));return RP;}
const xu=j=>.18+(j+.5)*.08;
function evAt(i,u){return RS[i].t0+RS[i].dur*fOfU(u);}
function nextIdx(t){let i=0;while(i<EV.length&&EV[i].t<=t)i++;return i;}
function buildEvents(){
  EV=[];PP=[];const k=G.k,r1=G.r1,R=G.R;
  const pay=(t,type,x,y,m,fx)=>{const pp={type,x,y:Math.max(40*k,y),m,fx,ord:0,fl:null};PP.push(pp);EV.push({t,pay:pp,sub:null,m,j:0});};
  const sub=(t,s,m,j)=>EV.push({t,pay:null,sub:s,m,j});
  rp(0,.5);pay(evAt(0,.5),'pin',RP.x,RP.y-r1*1.5-26*k,-1,FX.pin);
  let tj=0;for(const s of SEG)if(s.type==='turn'){const fx=FX.bump[tj]||(FX.bump[tj]={hit:-9});s.fx=fx;tj++;
    pay(s.t0+s.dur*.5,'bump',s.cx+s.side*(G.rt+r1+4*k),(s.c1+s.c2)/2-14*k,-1,fx);}
  rp(R-1,.5);pay(evAt(R-1,.5),'bulb',RP.x,RP.y-r1*1.5-30*k,-1,FX.bulb);

let QUIET=false;
function banner(small,big){if(QUIET)return;const el=document.createElement('div');el.className='banner';el.innerHTML=`<small>${small}</small><b>${big}</b>`;stage.appendChild(el);setTimeout(()=>el.remove(),2300);}
let tt=null;function toast(m){if(QUIET)return;let t=$('.toast');if(!t){t=document.createElement('div');t.className='toast';document.body.appendChild(t);}t.textContent=m;t.hidden=false;clearTimeout(tt);tt=setTimeout(()=>t.hidden=true,1600);}
function bump(id){if(QUIET)return;const el=$(id);el.classList.remove('buy');void el.offsetWidth;el.classList.add('buy');}
function findPair(){const c={};for(const b of balls)c[b.lv]=(c[b.lv]||0)+1;let best=0;for(const k in c)if(c[k]>=2&&+k<8&&(!best||+k<best))best=+k;return best;}
function doAdd(){initAudio();if(balls.length>=T().slots){toast(findPair()?'Loop is full \u00b7 merge two balls!':'Loop is full \u00b7 build a bigger floor');return false;}
  const c=addCost();if(S.money<c){toast(`Need ${fmt(c-S.money)} more`);return false;}
  S.money-=c;S.buys++;const b=mkBall(1);b.q=true;b.pop=1;balls.push(b);blip([660,880],.05);vib(10);bump('#bAdd');updateUI();return true;}
function doMerge(){initAudio();const L=findPair();if(!L){toast('Need two balls of the same level');return false;}
  const c=mergeCost();if(S.money<c){toast(`Need ${fmt(c-S.money)} more`);return false;}
  S.money-=c;S.merges++;const same=balls.filter(b=>b.lv===L).sort((a,b)=>(a.q-b.q));const A=same[0],B=same[1];
  balls.splice(balls.indexOf(B),1);A.lv=L+1;
  if(!SIM){A.show=L;ghosts.push({x:B.x,y:B.y,to:A,lv:L,age:0});}else A.show=L+1;
  if(L+1>S.seen){S.seen=L+1;banner('New ball unlocked',BALLS[L]);blip([784,988,1319,1568],.08);vib([15,30,25]);}else{blip([523,784],.07);vib(15);}
  bump('#bMerge');updateUI();return true;}
function doStation(){initAudio();if(S.st>=T().st){toast(S.tier<TIERS.length-1?'All machine spots built \u00b7 build a bigger floor':'All machines built');return false;}
  const c=stCost();if(S.money<c){toast(`Need ${fmt(c-S.money)} more`);return false;}
  S.money-=c;const m=S.st;S.st++;MS[m].build=clock;buildEvents();banner('Machine built',MACH[m].name);blip([392,523,659,784],.07);vib([10,20,10]);
  if(!SIM){rp(m+1,.5);emit(RP.x,RP.sy-10*G.k,30,['#ffd23f','#ffffff',T().pal.accent,'#c9a8ff'],140*G.k,2.4*G.k,2);}
  bump('#bStation');updateUI();return true;}
function doExpand(){initAudio();const Ti=T(),nx=TIERS[S.tier+1];if(!nx)return false;
  if(S.st<Ti.st){toast(`Build all ${Ti.st} machine${Ti.st>1?'s':''} first`);return false;}
  if(S.money<Ti.exp){toast(`Need ${fmt(Ti.exp-S.money)} more`);return false;}
  S.money-=Ti.exp;S.tier++;layout();tierFx=clock;flash=1;stage.style.background=T().pal.floor;banner('Floor expanded',nx.name);blip([392,523,659,784,1047],.09);vib([20,40,30]);
  if(!SIM)for(let i=0;i<3;i++)emit(cw*(.2+i*.3),ch*.35,20,['#ffd23f','#e63946','#3a86ff','#06d6a0','#ffffff'],180,3,2);
  updateUI();save();return true;}

  const sfull=S.st>=Ti.st,sc=stCost();setBtn($('#bStation'),sfull?'All spots built':`${MACH[S.st].name} \u00b7 +${Math.round(MACH[S.st].b*100)}%`,sfull?'FULL':fmt(sc),sfull?'off':S.money<sc?'poor':'');

  if(!nx){$('#expLabel').textContent='Space Station \u00b7 the biggest floor here';$('#expFill').style.width='0%';ex.classList.remove('ready');}
  else if(S.st<Ti.st){const n=Ti.st-S.st;$('#expLabel').textContent=`Bigger Floor \u00b7 build ${n} more machine${n>1?'s':''}`;$('#expFill').style.width=(S.st/Ti.st*50)+'%';ex.classList.remove('ready');}
  else{$('#expLabel').textContent=`Bigger Floor \u2192 ${nx.name} \u00b7 ${fmt(Ti.exp)}`;$('#expFill').style.width=(50+Math.min(50,S.money/Ti.exp*50))+'%';ex.classList.toggle('ready',S.money>=Ti.exp);}
}

/* ================= modals ================= */
const modal=$('#modal'),sheet=$('#sheet');
function open(html){sheet.innerHTML=html;modal.hidden=false;}function close(){modal.hidden=true;}
modal.addEventListener('click',e=>{if(e.target===modal)close();});
function initBalls(){balls=S.balls.map(l=>mkBall(l));const n=balls.length,t0=RS[0].t0+.05;balls.forEach((b,i)=>{b.t=(t0+i*LAP/Math.max(1,n))%LAP;b.next=nextIdx(b.t);});}
$('#resetBtn').addEventListener('click',()=>{open(`<h2>Start over?</h2><p>This wipes your cash, balls, machines and floors so you can play the prototype from the beginning.</p><div class="row"><button class="b-alt" id="mNo">Keep playing</button><button class="b-red" id="mYes">Start over</button></div>`);
  $('#mNo').onclick=close;$('#mYes').onclick=()=>{try{localStorage.removeItem(KEY);}catch(_){ }Object.assign(S,FRESH());$('#hint').hidden=false;
    for(const m of MS){m.build=-9;m.hit=-9;}LAP=0;balls=[];ghosts.length=0;stage.style.background=T().pal.floor;layout();initBalls();buildEvents();close();updateUI();save();};});
function offline(){const away=Math.min(7200,(Date.now()-S.t)/1000);if(away<60||!S.rate)return;const v=S.rate*away*.5;if(v<1)return;const h=Math.floor(away/3600),m=Math.floor(away%3600/60);
  open(`<h2>Welcome back</h2><p>Your factory kept rolling for ${h?h+'h ':''}${m}m while you were away (half speed, max 2h).</p><div class="big">+${fmt(v)}</div>
    <div class="row"><button class="b-alt" id="mTake">Collect</button><button class="b-gold" id="mAd">Collect \u00d72</button></div><p style="margin:10px 0 0;font-size:12px">In the real game \u00d72 plays a rewarded ad. In this prototype it just doubles.</p>`);
  $('#mTake').onclick=()=>{S.money+=v;close();updateUI();save();};$('#mAd').onclick=()=>{S.money+=v*2;close();updateUI();save();};}

/* ================= loop & boot ================= */
function resize(){const b=stage.getBoundingClientRect();cw=Math.max(1,b.width);ch=Math.max(1,b.height);dpr=Math.min(2,window.devicePixelRatio||1);
  cv.width=Math.round(cw*dpr);cv.height=Math.round(ch*dpr);layout();}
let last=performance.now(),lastUI=0;
function frame(now){const dt=Math.min(.05,Math.max(0,(now-last)/1000));last=now;update(dt);draw();if(now-lastUI>150){lastUI=now;updateUI();}requestAnimationFrame(frame);}
if(S.hint)$('#hint').hidden=true;
stage.style.background=T().pal.floor;
resize();initBalls();buildEvents();updateUI();offline();
new ResizeObserver(()=>{const b=stage.getBoundingClientRect();if(Math.abs(b.width-cw)>.5||Math.abs(b.height-ch)>.5)resize();}).observe(stage);
setInterval(save,5000);document.addEventListener('visibilitychange',()=>{if(document.hidden)save();});
draw();requestAnimationFrame(t=>{last=t;requestAnimationFrame(frame);});

/* debug hooks for headless pacing tests */
window.__kof={S,step(sec,dt){dt=dt||.05;SIM=true;QUIET=true;try{for(let t=0;t<sec;t+=dt)update(dt);}finally{SIM=false;QUIET=false;}},
  act(name){QUIET=true;SIM=true;try{return {add:doAdd,merge:doMerge,station:doStation,expand:doExpand}[name]();}finally{QUIET=false;SIM=false;}},
  info:()=>({money:S.money,tier:S.tier,st:S.st,balls:balls.map(b=>b.lv),q:balls.filter(b=>b.q).length,ips:incomePerSec(),lap:LAP,nPay,slots:T().slots,stCap:T().st,
    addCost:addCost(),mergeCost:mergeCost(),stCost:stCost(),exp:T().exp,pair:findPair()})};
})();
</script>
