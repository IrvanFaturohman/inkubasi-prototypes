<!doctype html><html><head>
<meta name="viewport" content="width=device-width, initial-scale=1"><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Molten Line</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;700;800;900&display=swap">
<style>
  :root{
    color-scheme: dark;
    --page:#140e0c; --ink:#f4e7d7; --ink-2:#b09a88; --ink-3:#7d6a5e;
    --panel:#2c221e; --panel-edge:#110b09; --lock:#3a2e29;
    --hot:#ff8a1f; --hot-2:#ffb347; --hot-edge:#a8490b; --hot-ink:#2a1100;
    --red:#ff4a3a;
    --display:"Lilita One","Arial Rounded MT Bold","Trebuchet MS",system-ui,sans-serif;
    --body:"Nunito","Segoe UI",system-ui,-apple-system,sans-serif;
  }
  [hidden]{display:none!important}
  html,body{height:100%;margin:0}
  body{background:var(--page) radial-gradient(120% 60% at 50% 0%,#2a1712 0%,var(--page) 62%,#0e0a09 100%);color:var(--ink);font-family:var(--body);font-weight:700;overflow:hidden;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
  .app{height:100%;max-width:480px;margin:0 auto;display:flex;flex-direction:column;gap:10px;padding-inline:16px;padding-block:10px 12px;box-sizing:border-box}
  button{font-family:inherit;color:inherit;cursor:pointer}
  button:focus-visible{outline:3px solid var(--hot);outline-offset:2px}

  .hud{display:flex;align-items:center;gap:10px}
  .loc{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1}
  .loc b{font-family:var(--display);font-weight:400;font-size:15px;line-height:1.05;letter-spacing:.05em;text-transform:uppercase;color:var(--hot);text-shadow:0 0 12px rgba(255,138,31,.35)}
  .loc span{font-size:12px;color:var(--ink-2);font-weight:800}
  .money{text-align:center;display:flex;flex-direction:column;line-height:1;flex:none}
  .money #money{font-family:var(--display);font-size:clamp(28px,8vw,36px);color:var(--ink);font-variant-numeric:tabular-nums}
  .money #rate{font-size:12px;color:var(--ink-2);margin-top:3px;font-variant-numeric:tabular-nums}
  .tools{flex:1;display:flex;justify-content:flex-end;gap:6px}
  .icon-btn{width:38px;height:38px;border-radius:12px;border:0;background:var(--panel);box-shadow:0 3px 0 var(--panel-edge),inset 0 1px 0 rgba(255,255,255,.06);display:grid;place-items:center;flex:none}
  .icon-btn svg{width:20px;height:20px}

  .stage{position:relative;flex:1;min-height:220px;border-radius:22px;overflow:hidden;background:#1a1210;box-shadow:inset 0 0 0 2px rgba(255,190,140,.08),0 0 0 1px #0a0706}
  #cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
  .hint{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%);background:rgba(12,8,6,.86);color:var(--ink);font-weight:800;font-size:12px;padding:7px 13px 7px 9px;border-radius:999px;display:flex;align-items:center;gap:8px;pointer-events:none;white-space:nowrap;box-shadow:0 0 0 1px rgba(255,138,31,.3)}
  .hint i{width:16px;height:16px;border-radius:50%;background:var(--hot);box-shadow:0 0 10px var(--hot);animation:tap 1.1s ease-in-out infinite;flex:none}
  @keyframes tap{0%,100%{transform:scale(1)}40%{transform:scale(.7)}60%{transform:scale(1.1)}}
  .float{position:absolute;font-family:var(--display);color:var(--hot-2);text-shadow:0 2px 0 #1a0b04,1.5px 0 0 #1a0b04,-1.5px 0 0 #1a0b04,0 -1.5px 0 #1a0b04,0 0 10px rgba(255,138,31,.6);pointer-events:none;white-space:nowrap;font-size:15px;animation:rise 1.1s ease-out forwards;z-index:1}
  .float.lv{color:#fff;font-size:14px}
  @keyframes rise{0%{opacity:0;transform:translate(-50%,-30%) scale(.7)}15%{opacity:1;transform:translate(-50%,-50%) scale(1.1)}100%{opacity:0;transform:translate(-50%,-170%) scale(1)}}
  .banner{position:absolute;left:50%;top:32%;transform:translate(-50%,-50%);background:#120c0a;color:#fff;border-radius:16px;padding:10px 18px 12px;text-align:center;pointer-events:none;box-shadow:0 5px 0 rgba(0,0,0,.4),0 0 0 1.5px rgba(255,138,31,.55),0 0 28px rgba(255,138,31,.35);animation:bn 2.4s ease-out forwards;white-space:nowrap;z-index:2}
  .banner small{display:block;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--hot);font-weight:900}
  .banner b{font-family:var(--display);font-weight:400;font-size:24px}
  @keyframes bn{0%{opacity:0;transform:translate(-50%,-50%) scale(.6)}12%{opacity:1;transform:translate(-50%,-50%) scale(1.08)}20%{transform:translate(-50%,-50%) scale(1)}85%{opacity:1}100%{opacity:0;transform:translate(-50%,-70%)}}

  .info{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:13px;color:var(--ink-2);font-weight:800;font-variant-numeric:tabular-nums}
  .info span:first-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pay{font-family:var(--display);font-weight:400;color:var(--hot);font-size:16px;white-space:nowrap}

  .upgrades{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .up{border:0;border-radius:16px;background:var(--panel);box-shadow:0 4px 0 var(--panel-edge),inset 0 1px 0 rgba(255,255,255,.06);padding:9px 8px;display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:left;min-width:0;transition:transform .06s}
  .up:active{transform:translateY(3px);box-shadow:0 1px 0 var(--panel-edge)}
  .up-h{display:flex;align-items:center;gap:5px;min-width:0}
  .up-h i{width:24px;height:24px;border-radius:8px;background:#1d1613;display:grid;place-items:center;flex:none}
  .up-h i svg{width:18px;height:18px}
  .up-h b{font-size:12px;font-weight:900;line-height:1.1;letter-spacing:-.1px;min-width:0}
  .up small{font-size:11px;color:var(--ink-2);line-height:1.2;min-height:2.4em;width:100%}
  .cost{font-family:var(--display);font-size:14px;background:var(--hot);color:var(--hot-ink);padding:2px 9px;border-radius:8px;font-variant-numeric:tabular-nums}
  .up.poor .cost,.up.off .cost{background:var(--lock);color:var(--ink-2)}
  .up.off{opacity:.55}
  .up.hot{background:linear-gradient(#ff9d38,#f07512);color:var(--hot-ink);box-shadow:0 4px 0 var(--hot-edge),0 0 18px rgba(255,138,31,.4);animation:glow 1.2s ease-in-out infinite}
  .up.hot small{color:#5a2600}.up.hot .up-h i{background:rgba(60,20,0,.18)}
  .up.hot .cost{background:var(--hot-ink);color:var(--hot-2)}
  .up.buy{animation:pop .25s}
  @keyframes pop{50%{transform:scale(1.05)}}
  @keyframes glow{50%{filter:brightness(1.12)}}

  .expand{position:relative;overflow:hidden;border:0;border-radius:14px;height:46px;font-weight:900;font-size:13.5px;white-space:nowrap;padding-inline:10px;background:#3a2e29;color:var(--ink);box-shadow:0 4px 0 var(--panel-edge);flex:none}
  .expand .fill{position:absolute;inset:0;width:0;background:linear-gradient(90deg,#8a3a0c,#d8650f);transition:width .2s}
  .expand span{position:relative;display:block;overflow:hidden;text-overflow:ellipsis}
  .expand.ready{background:linear-gradient(#ff9d38,#f07512);color:var(--hot-ink);box-shadow:0 4px 0 var(--hot-edge),0 0 20px rgba(255,138,31,.45);animation:glow 1.2s ease-in-out infinite}
  .expand.ready .fill{display:none}

  .modal{position:fixed;inset:0;background:rgba(8,5,4,.7);display:grid;place-items:center;padding-inline:16px;z-index:10}
  .sheet{background:#261d19;border-radius:22px;padding:20px;width:100%;max-width:380px;box-sizing:border-box;box-shadow:0 8px 0 #0c0807,0 0 0 1px rgba(255,190,140,.1)}
  .sheet h2{font-family:var(--display);font-weight:400;font-size:24px;margin:0 0 6px;text-wrap:balance}
  .sheet p{margin:0 0 14px;color:var(--ink-2);font-size:14px;line-height:1.45}
  .sheet .big{font-family:var(--display);font-size:34px;color:var(--hot);margin:6px 0 14px;font-variant-numeric:tabular-nums;text-shadow:0 0 16px rgba(255,138,31,.45)}
  .row{display:flex;gap:8px}
  .row button{flex:1;border:0;border-radius:14px;height:46px;font-weight:900;font-size:14px}
  .b-alt{background:var(--lock);box-shadow:0 4px 0 #1a1311}
  .b-gold{background:linear-gradient(#ff9d38,#f07512);color:var(--hot-ink);box-shadow:0 4px 0 var(--hot-edge)}
  .b-red{background:#c9402a;color:#fff;box-shadow:0 4px 0 #7d2416}
  .toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 14px);transform:translateX(-50%);background:#0d0907;color:#fff;font-weight:800;font-size:13px;padding:8px 14px;border-radius:999px;z-index:20;pointer-events:none;white-space:nowrap;box-shadow:0 0 0 1px rgba(255,138,31,.4)}
  @media (prefers-reduced-motion: reduce){.hint i,.expand.ready,.up.hot,.up.buy{animation:none}.float,.banner{animation-duration:.01s}}
  @media (max-height:680px){.up small{min-height:0}.app{gap:7px;padding-block:8px 10px}.up{padding:7px 7px}.expand{height:42px}.hint{font-size:11px}}
</style>

<div class="app">
  <header class="hud">
    <div class="loc"><b id="tierName">Backyard Kiln</b><span id="tierStep">Tier 1 of 5</span></div>
    <div class="money"><span id="money">$30</span><span id="rate">$0 / min</span></div>
    <div class="tools">
      <button class="icon-btn" id="sndBtn" aria-label="Turn sound on"><svg viewBox="0 0 24 24" fill="none" stroke="#f4e7d7" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h4l5-4v14l-5-4H4z" fill="#f4e7d7"/><path id="sndWave" d="M16 9l5 6M21 9l-5 6"/></svg></button>
      <button class="icon-btn" id="resetBtn" aria-label="Start over"><svg viewBox="0 0 24 24" fill="none" stroke="#f4e7d7" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12a8 8 0 1 0 2.4-5.7"/><path d="M4 4v4.5h4.5"/></svg></button>
    </div>
  </header>

  <div class="stage" id="stage">
    <canvas id="cv"></canvas>
    <div class="hint" id="hint"><i></i>Tap a machine to upgrade · hold the belt to rush</div>
  </div>

  <div class="info"><span id="slots">Machines 2/4</span><span class="pay" id="ips">$0/s</span></div>

  <div class="upgrades">
    <button class="up" id="bUp"><div class="up-h"><i><svg viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M6 13l6-6 6 6" stroke="#ff8a1f" stroke-width="2.8"/><path d="M6 19l6-6 6 6" stroke="#ffb347" stroke-width="2.8"/></svg></i><b>Upgrade</b></div><small></small><span class="cost"></span></button>
    <button class="up" id="bAdd"><div class="up-h"><i><svg viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M3 20V11l5 3V11l5 3V7h8v13z" fill="#6d747b"/><path d="M3 20h18" stroke="#2c221e" stroke-width="1.5"/><rect x="15" y="10" width="3" height="3" fill="#ff8a1f"/><path d="M17 1.5v5M14.5 4h5" stroke="#ffb347" stroke-width="2.2"/></svg></i><b>Add Machine</b></div><small></small><span class="cost"></span></button>
    <button class="up" id="bCon"><div class="up-h"><i><svg viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M5 3h10l4 4v14H5z" fill="#e9dcc4"/><path d="M8 8h6M8 11h8M8 14h5" stroke="#8a7560" stroke-width="1.5"/><circle cx="15.5" cy="17.5" r="3.4" fill="#ff8a1f"/><path d="M14 20.5l-.8 2.8 2.3-1.1 2.3 1.1-.8-2.8" fill="#a8490b"/></svg></i><b>Premium Contracts</b></div><small></small><span class="cost"></span></button>
  </div>
  <button class="expand" id="bExpand"><div class="fill" id="expFill"></div><span id="expLabel">Expand</span></button>
</div>

<div class="modal" id="modal" hidden><div class="sheet" id="sheet"></div></div>

<script>
(()=>{
'use strict';
const $=s=>document.querySelector(s);
const stage=$('#stage'),cv=$('#cv'),ctx=cv.getContext('2d'),hintEl=$('#hint');
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const TAU=Math.PI*2;

/* ================= economy (constants tuned with a headless bot, see __molten.simulate) ================= */
const STEPS=[
  {name:'Furnace',        m:2.0, r:0.85},
  {name:'Mold Press',     m:1.7, r:1.05},
  {name:'Cooling Tunnel', m:1.9, r:0.80},
  {name:'Labeler',        m:1.6, r:1.15},
  {name:'Polisher',       m:1.8, r:0.95},
  {name:'Engraver',       m:1.9, r:0.78},
  {name:'Gold Rimmer',    m:1.9, r:1.00},
  {name:'Crystal Coater', m:2.0, r:0.88},
  {name:'Gift Box Packer',m:2.1, r:1.10}
];
const SRC={name:'Sand Pit',r:1.0}, SHIP={name:'Crate & Truck',r:1.25};
const NST=STEPS.length+2, SHIPI=NST-1;
const TIERS=[
  {name:'Backyard Kiln',       prod:'Bottles',             one:'Bottle', slots:4,rows:3,base:0.5, exp:1700},
  {name:'Bottle Works',        prod:'Jars',                one:'Jar',    slots:6,rows:3,base:1.5, exp:2.7e6},
  {name:'Lamp Factory',        prod:'Light Bulbs',         one:'Bulb',   slots:7,rows:4,base:4.5, exp:9.8e8},
  {name:'Glass Atelier',       prod:'Vases',               one:'Vase',   slots:8,rows:4,base:13.5,exp:3.8e11},
  {name:'Cathedral Glassworks',prod:'Stained-Glass Panels',one:'Panel',  slots:9,rows:5,base:40.5,exp:null}
];
const E={MCOST:[0,0,65,660,15000,1.2e6,2.5e8,7.6e10,1e13],RG:1.2,UC0:6,UCG:1.45,CON_B:.25,CON0:25,CONG:2.7};
const CLIENTS=['Corner Soda Shop','Riverside Brewery','Harbor Pickle Co.','City Pharmacy','Grand Hotel','Lighthouse Authority','Museum Gift Shop','Royal Perfumery','Opera House','Old Town Cathedral','Sky Palace Hotel','The Royal Court'];
const stRate=(i,lv)=>(i===0?SRC.r:i===SHIPI?SHIP.r:STEPS[i-1].r)*Math.pow(E.RG,lv-1);
const upCost=lv=>E.UC0*Math.pow(E.UCG,lv-1);
const conCost=s=>E.CON0*Math.pow(E.CONG,s.con);
const conMult=s=>Math.pow(1+E.CON_B,s.con);
const active=(s,i)=>i===0||i===SHIPI||i<=s.built;
const LI={rate:0,bi:0};
function lineInfo(s,o=LI){let mn=1e300,bi=0;for(let i=0;i<NST;i++){if(!active(s,i))continue;const r=stRate(i,s.lv[i]);if(r<mn-1e-9){mn=r;bi=i;}}o.rate=mn;o.bi=bi;return o;}
function itemValue(s){let v=TIERS[s.tier].base;for(let j=0;j<s.built;j++)v*=STEPS[j].m;return v;}
const payPer=s=>itemValue(s)*conMult(s);
const incomeSec=s=>lineInfo(s,{rate:0,bi:0}).rate*payPer(s);
function newMachineLv(s){const lr=lineInfo(s,{rate:0,bi:0}).rate,r=STEPS[s.built].r;let L=1;while(r*Math.pow(E.RG,L)<lr)L++;return L;}
const stName=i=>i===0?SRC.name:i===SHIPI?SHIP.name:STEPS[i-1].name;
const clientName=n=>n<=CLIENTS.length?CLIENTS[n-1]:'Global Deal #'+(n-CLIENTS.length);
function fmt(n){if(n<1000)return '$'+Math.floor(n).toLocaleString('en-US');const u=['K','M','B','T','Qa','Qi','Sx','Sp'];let i=-1;while(n>=1000&&i<u.length-1){n/=1000;i++;}
  return '$'+parseFloat(n<10?n.toFixed(2):n<100?n.toFixed(1):Math.floor(n))+u[i];}
const fmtS=n=>n<.995?'$'+n.toFixed(2):n<9.95?'$'+n.toFixed(1):fmt(n);

/* ================= state ================= */
const KEY='molten-line-v1';
const FRESH=()=>({money:30,tier:0,lv:new Array(NST).fill(1),built:2,con:0,seen:2,t:Date.now(),hint:0});
const S=FRESH();
try{const s=JSON.parse(localStorage.getItem(KEY)||'null');if(s&&Array.isArray(s.lv))Object.assign(S,s);}catch(e){}
S.tier=clamp(S.tier|0,0,TIERS.length-1);S.built=clamp(S.built|0,2,TIERS[S.tier].slots);S.con=Math.max(0,S.con|0);
S.lv=Array.from({length:NST},(_,i)=>Math.max(1,(S.lv&&S.lv[i])|0||1));if(!(S.money>=0))S.money=0;S.seen=Math.max(S.seen|0,S.built);
function save(){try{S.t=Date.now();localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
const T=()=>TIERS[S.tier];

/* visual speed: real throughput can reach thousands/s, the belt shows a compressed but order-preserving rate.
   each shipped item then pays for the batch it stands for, so on-screen income equals the real income. */
const visR=a=>a<=1?a:7.5-6.5*Math.exp(-Math.log(a)/4.5);
const VIS=new Float32Array(NST);let lineRate=1,batch=1,beltV=40,bneck=1;
function computeVis(){let mx=0;for(let i=0;i<NST;i++){VIS[i]=visR(stRate(i,S.lv[i]));if(active(S,i)&&VIS[i]>mx)mx=VIS[i];}
  lineInfo(S);lineRate=LI.rate;bneck=LI.bi;batch=lineRate/visR(lineRate);beltV=Math.max(L.is*2.6,L.sp*mx*1.3);}

/* ================= layout ================= */
let W=0,H=0,dpr=1;
const L={is:14,sp:18,beltW:12,bw:50,bh:44,rowY:[],xL:0,xR:0,roadY:0,roadH:34,len:0,segs:[],path:null};
const SL=[];               // station layout per station index (null when not in this tier)
let ORDER=[];             // station indexes along the line for this tier
function layout(){
  const r=stage.getBoundingClientRect();W=Math.max(200,r.width);H=Math.max(200,r.height);
  dpr=Math.min(3,window.devicePixelRatio||1);cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);
  const Ti=T(),R=Ti.rows;ORDER=[0];for(let i=1;i<=Ti.slots;i++)ORDER.push(i);ORDER.push(SHIPI);const N=ORDER.length;
  L.roadH=clamp(H*.085,28,42);L.roadY=H-L.roadH;
  let rs=(L.roadY-32)/(R-.4);L.bh=clamp(rs*.6,28,72);rs=(L.roadY-32-L.bh)/(R-1);L.rs=rs;
  L.rowY=[];for(let i=0;i<R;i++)L.rowY.push(18+L.bh+i*rs);
  L.is=clamp(L.bh*.36,11,22);L.beltW=clamp(L.is*.95,10,18);L.sp=L.is*1.3;
  L.xL=8+L.beltW/2+2;L.xR=W-L.xL;const rowLen=L.xR-L.xL;
  const cnt=[];for(let i=0;i<R;i++)cnt.push(Math.floor(N/R)+(i<N%R?1:0));const maxK=Math.max(...cnt);
  L.bw=clamp(Math.min(L.bh*1.15,(rowLen-2*(L.beltW+6))/maxK-16),34,76);
  // path: zigzag rows joined by vertical drops on alternating sides
  L.segs=[];let s=0;const rowS=[];
  for(let i=0;i<R;i++){const dir=i%2?-1:1,x0=dir>0?L.xL:L.xR,x1=dir>0?L.xR:L.xL,y=L.rowY[i];rowS.push(s);
    L.segs.push({x0,y0:y,x1,y1:y,s0:s,len:rowLen,dx:dir,dy:0});s+=rowLen;
    if(i<R-1){L.segs.push({x0:x1,y0:y,x1,y1:L.rowY[i+1],s0:s,len:rs,dx:0,dy:1});s+=rs;}}
  // stations
  for(let i=0;i<NST;i++)SL[i]=null;let k=0;
  for(let i=0;i<R;i++){const dir=i%2?-1:1,x0=dir>0?L.xL:L.xR,c=cnt[i];
    const pS=i===0?L.bw/2+2:L.bw/2+L.beltW+6,pE=i===R-1?L.bw/2+2:L.bw/2+L.beltW+6;
    for(let j=0;j<c;j++){const d=c===1?(pS+rowLen-pE)/2:pS+j*(rowLen-pS-pE)/(c-1),idx=ORDER[k++];
      const sc=rowS[i]+d;SL[idx]={i:idx,row:i,dir,x:x0+dir*d,y:L.rowY[i],sc,sIn:sc-L.bw/2+2,sOut:sc+L.bw/2-2};}}
  SL[0].sOut=SL[0].sc+L.bw*.3;const sh=SL[SHIPI];sh.sIn=sh.sc-L.bw*.5;
  L.len=sh.sc+L.bw*.12;
  // clip the last segment at the crate
  const last=L.segs[L.segs.length-1];last.len=L.len-last.s0;last.x1=last.x0+last.dx*last.len;
  L.path=new Path2D();L.path.moveTo(L.segs[0].x0-2,L.segs[0].y0);for(const g of L.segs)L.path.lineTo(g.x1,g.y1);

function tryUpgrade(i,fromTap,btn){const c=upCost(S.lv[i]);if(S.money<c){toast(`Need ${fmt(c-S.money)} more for ${stName(i)} Lv ${S.lv[i]+1}`);return;}
  S.money-=c;S.lv[i]++;const st=ST[i],g=SL[i];st.pop=1;computeVis();
  floatAt(`${stName(i)} Lv ${S.lv[i]}`,g.x,g.y-L.bh-4,'lv');for(let k=0;k<(reduce?4:10);k++)part(0,g.x+(Math.random()-.5)*L.bw,g.y-Math.random()*L.bh,(Math.random()-.5)*60,-30-Math.random()*40,.5,1.6);
  if(fromTap)hideHint();blip(i===bneck?[523,784]:[523,659],.05,.1);vib(8);bump(btn);updateUI();}
function tryAdd(btn){const Ti=T();if(S.built>=Ti.slots){toast(S.tier<TIERS.length-1?'Line is full · expand the factory':'Every step is built');return;}
  const c=E.MCOST[S.built];if(S.money<c){toast(`Need ${fmt(c-S.money)} more for the ${STEPS[S.built].name}`);return;}
  S.money-=c;const lv=newMachineLv(S),idx=S.built+1;S.lv[idx]=Math.max(S.lv[idx],lv);S.built++;buildStations();ST[idx].item=null;ST[idx].p=0;ST[idx].pop=1;computeVis();
  const g=SL[idx];for(let k=0;k<(reduce?6:22);k++)part(0,g.x+(Math.random()-.5)*L.bw,g.y-Math.random()*L.bh,(Math.random()-.5)*90,-40-Math.random()*60,.6,1.8);
  if(S.built>S.seen){S.seen=S.built;banner('New machine',STEPS[idx-1].name);}else banner('Machine built',STEPS[idx-1].name);
  blip([523,659,784,1047],.07);vib([10,30,10]);bump(btn);updateUI();save();}
function tryCon(btn){const c=conCost(S);if(S.money<c){toast(`Need ${fmt(c-S.money)} more`);return;}
  S.money-=c;S.con++;banner('Premium Contract signed',clientName(S.con));blip([659,880,1175],.07);vib(12);bump(btn);updateUI();save();}
function tryExpand(){const Ti=T(),nx=TIERS[S.tier+1];if(!nx)return;
  if(S.built<Ti.slots){const m=Ti.slots-S.built;toast(`Build ${m} more machine${m>1?'s':''} first`);return;}
  if(S.money<Ti.exp){toast(`Need ${fmt(Ti.exp-S.money)} more`);return;}
  S.money-=Ti.exp;renderBg(bgPrev);bgFade=1;S.tier++;layout();clearLine();prewarm(30);
  banner('Factory expanded',nx.name);banner('New product',nx.prod);blip([392,523,659,784,1047],.09);vib([20,30,20]);updateUI();save();}
$('#bUp').addEventListener('click',e=>{initAudio();tryUpgrade(bneck,false,e.currentTarget);});
$('#bAdd').addEventListener('click',e=>{initAudio();tryAdd(e.currentTarget);});
$('#bCon').addEventListener('click',e=>{initAudio();tryCon(e.currentTarget);});
$('#bExpand').addEventListener('click',()=>{initAudio();tryExpand();});

function setBtn(el,title,sub,cost,state){if(title!==null)el.querySelector('b').textContent=title;el.querySelector('small').textContent=sub;el.querySelector('.cost').textContent=cost;el.className='up'+(state?' '+state:'');}
function updateUI(){
  const inc=incomeSec(S),Ti=T();
  $('#money').textContent=fmt(S.money);$('#rate').textContent=fmt(inc*60)+' / min';$('#ips').textContent=fmtS(inc)+'/s';
  $('#tierName').textContent=Ti.name;$('#tierStep').textContent=`Tier ${S.tier+1} of ${TIERS.length}`;
  $('#slots').textContent=`Machines ${S.built}/${Ti.slots} · ${Ti.one} ${fmtS(payPer(S))} each`;
  const uc=upCost(S.lv[bneck]);setBtn($('#bUp'),`Upgrade ${stName(bneck)}`,`Lv ${S.lv[bneck]} → ${S.lv[bneck]+1} · +${Math.round((E.RG-1)*100)}% speed`,fmt(uc),S.money>=uc?'hot':'poor');
  const full=S.built>=Ti.slots,mc=E.MCOST[S.built];
  setBtn($('#bAdd'),null,full?(S.tier<TIERS.length-1?'Line full · expand for more':'Line complete'):`${STEPS[S.built].name} · ×${STEPS[S.built].m} value`,full?'FULL':fmt(mc),full?'off':S.money<mc?'poor':'');
  const cc=conCost(S);setBtn($('#bCon'),null,`Lv ${S.con} → ${S.con+1} · +${Math.round(E.CON_B*100)}% pay`,fmt(cc),S.money<cc?'poor':'');
  const nx=TIERS[S.tier+1],ex=$('#bExpand');
  if(!nx){$('#expLabel').textContent='Biggest factory in this prototype';$('#expFill').style.width='100%';ex.classList.remove('ready');}
  else if(S.built<Ti.slots){const m=Ti.slots-S.built;$('#expLabel').textContent=`Expand · build ${m} more machine${m>1?'s':''}`;$('#expFill').style.width=(S.built/Ti.slots*50)+'%';ex.classList.remove('ready');}
  else{$('#expLabel').textContent=`Expand to ${nx.name} · ${fmt(Ti.exp)}`;$('#expFill').style.width=(50+Math.min(50,S.money/Ti.exp*50))+'%';ex.classList.toggle('ready',S.money>=Ti.exp);}
}

/* ================= modals ================= */
const modal=$('#modal'),sheet=$('#sheet');
function openModal(html){sheet.innerHTML=html;modal.hidden=false;}function closeModal(){modal.hidden=true;}
modal.addEventListener('click',e=>{if(e.target===modal)closeModal();});
$('#resetBtn').addEventListener('click',()=>{openModal(`<h2>Start over?</h2><p>This wipes your cash, machines, levels, contracts and expansions so you can play the prototype from the beginning.</p><div class="row"><button class="b-alt" id="mNo">Keep playing</button><button class="b-red" id="mYes">Start over</button></div>`);
  $('#mNo').onclick=closeModal;$('#mYes').onclick=()=>{try{localStorage.removeItem(KEY);}catch(_){}Object.assign(S,FRESH());rushT=0;$('#hint').hidden=false;layout();clearLine();prewarm(40);closeModal();updateUI();save();};});
function offline(){const away=Math.min(7200,(Date.now()-S.t)/1000);if(away<60)return;const v=incomeSec(S)*away*.5;if(v<1)return;const h=Math.floor(away/3600),m=Math.floor(away%3600/60);
  openModal(`<h2>Welcome back</h2><p>The furnace kept glowing for ${h?h+'h ':''}${m}m while you were away (half speed, max 2h).</p><div class="big">+${fmt(v)}</div>
    <div class="row"><button class="b-alt" id="mTake">Collect</button><button class="b-gold" id="mAd">Collect ×2</button></div><p style="margin:10px 0 0;font-size:12px">In the real game ×2 plays a rewarded ad. In this prototype it just doubles.</p>`);
  $('#mTake').onclick=()=>{S.money+=v;closeModal();updateUI();save();};$('#mAd').onclick=()=>{S.money+=v*2;closeModal();updateUI();save();};}

/* ================= loop ================= */
function prewarm(sec){warm=true;const n=Math.round(sec*30);for(let i=0;i<n;i++)sim(1/30);for(let i=0;i<PN;i++)pl[i]=0;shipAcc=0;warm=false;}
let last=performance.now(),lastUI=0,lastSnd=0;
function frame(now){const dt=Math.min(.05,(now-last)/1000);last=now;tNow=now/1000;
  sim(dt);stepParts(dt);if(bgFade>0)bgFade=Math.max(0,bgFade-dt*1.2);draw(tNow);
  if(now-lastUI>150){lastUI=now;updateUI();}
  if(roar&&AC&&!muted&&now-lastSnd>150){lastSnd=now;try{roar.gain.setTargetAtTime(rushing?.07:.045,AC.currentTime,.1);}catch(e){}}
  requestAnimationFrame(frame);}
let roT=0;new ResizeObserver(()=>{clearTimeout(roT);roT=setTimeout(()=>{const r=stage.getBoundingClientRect();if(Math.abs(r.width-W)>.5||Math.abs(r.height-H)>.5){layout();clearLine();prewarm(40);}},60);}).observe(stage);

/* ================= debug: headless pacing bot using the live constants ================= */
window.__molten={state:S,belt,
  simulate(maxT=1800){const s={money:30,tier:0,lv:new Array(NST).fill(1),built:2,con:0};let t=0;const ev=[];const dt=.25;const cl=x=>({money:x.money,tier:x.tier,lv:x.lv.slice(),built:x.built,con:x.con});let inc30=0,lvAt10=null;
    while(t<maxT){s.money+=incomeSec(s)*dt;t+=dt;if(t===30)inc30=incomeSec(s);if(t===600)lvAt10=s.lv.slice();
      for(let k=0;k<20;k++){const Ti=TIERS[s.tier],inc=incomeSec(s),c=[];
        if(Ti.exp&&s.built>=Ti.slots){const n=cl(s);n.tier++;c.push({k:'tier',cost:Ti.exp,roi:(incomeSec(n)-inc)*3/Ti.exp,f:()=>{s.tier++;}});}
        if(s.built<Ti.slots){const n=cl(s),L2=newMachineLv(n);n.lv[n.built+1]=L2;n.built++;const cost=E.MCOST[s.built];c.push({k:'machine',cost,roi:(incomeSec(n)-inc)*1.5/cost,f:()=>{s.lv[s.built+1]=L2;s.built++;}});}
        {const li=lineInfo(s,{rate:0,bi:0}),lr=li.rate*E.RG;let lc=0;for(let i=0;i<NST;i++){if(!active(s,i))continue;let q=s.lv[i];while(stRate(i,q)<lr-1e-9){lc+=upCost(q);q++;}}
          const bi=li.bi;c.push({k:'up',cost:upCost(s.lv[bi]),roi:inc*(E.RG-1)/Math.max(lc,1e-9),f:()=>{s.lv[bi]++;}});}
        {const n=cl(s);n.con++;const cost=conCost(s);c.push({k:'con',cost,roi:(incomeSec(n)-inc)/cost,f:()=>{s.con++;}});}
        c.sort((a,b)=>b.roi-a.roi);const b=c[0];if(s.money>=b.cost){s.money-=b.cost;b.f();ev.push([t,b.k==='tier'?'tier'+(s.tier+1):b.k==='machine'?'machine '+STEPS[s.built-1].name:b.k==='con'?'contract'+s.con:'up']);continue;}break;}}
    const at=re=>{const e=ev.find(e=>re.test(e[1]));return e?e[0]:null;};
    const gap=(re,lim)=>{let g=0,p=0,ga=0;for(const e of ev){if(!re.test(e[1])||e[0]>lim)continue;if(e[0]-p>g){g=e[0]-p;ga=p;}p=e[0];}return{gap:g,after:ga};};
    return{incomeAt0:incomeSec({tier:0,lv:new Array(NST).fill(1),built:2,con:0}),incomeAt30:inc30,firstUpgrade:at(/^up/),firstMachine:at(/^machine/),firstContract:at(/^contract/),
      tier2:at(/^tier2/),tier3:at(/^tier3/),tier4:at(/^tier4/),tier5:at(/^tier5/),upgradesFirst10min:ev.filter(e=>e[1]==='up'&&e[0]<=600).length,levelsAt10min:lvAt10,
      longestGapNew15min:gap(/^(tier|machine|contract)/,900),longestGapNew10min:gap(/^(tier|machine|contract)/,600),
      milestones:ev.filter(e=>e[1]!=='up').map(e=>Math.round(e[0])+'s '+e[1])};},
  lineCheck(){return{belt:belt.length,visLine:visR(lineRate),batch,bneck:stName(bneck)};}
};

/* ================= boot ================= */
if(S.hint)$('#hint').hidden=true;
layout();clearLine();prewarm(40);updateUI();draw(performance.now()/1000);offline();
setInterval(save,5000);document.addEventListener('visibilitychange',()=>{if(document.hidden)save();});
requestAnimationFrame(t=>{last=t;requestAnimationFrame(frame);});
})();
</script>
