<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Shine Reveal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#e6f2de; --dot:rgba(255,255,255,.55);
  --panel:#fffdf5; --panel2:#ffffff;
  --ink:#2e3a28; --soft:#6d7a63; --line:#2e3a28; --shade:rgba(46,58,40,.24);
  --coin:#ffeaa6; --coinink:#6b4a00;
  --chip:#dff3d3; --chipink:#2f6a20; --chip2:#fdefd2; --chip2ink:#7a5212;
  --bar:#eef3e6; --fill:#7cc46a; --fill2:#98d887;
  --boost:#ffd34d; --boostd:#d99a12;
  color-scheme: light;
  box-sizing:border-box;
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%}
body{
  height:100%;margin:0;overflow:hidden;overscroll-behavior:none;
  background-color:var(--bg);
  background-image:radial-gradient(var(--dot) 2.4px,transparent 3px);
  background-size:26px 26px;
  color:var(--ink);
  font-family:'Nunito','Trebuchet MS',system-ui,sans-serif;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
  touch-action:manipulation;
}
button{font:inherit;color:inherit}
button:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.num{font-family:'Lilita One','Nunito','Trebuchet MS',system-ui,sans-serif;font-weight:400;letter-spacing:.2px;font-variant-numeric:tabular-nums}

.app{position:relative;height:100%;max-width:520px;margin:0 auto;padding-block:8px 10px;padding-inline:16px;display:flex;flex-direction:column;gap:7px}

.top{display:flex;align-items:center;gap:7px;flex-shrink:0}
.brand{display:flex;align-items:center;gap:7px;background:var(--panel);border:3px solid var(--line);border-radius:999px;padding:3px 12px 3px 4px;box-shadow:0 3px 0 var(--shade);min-width:0}
.logo{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:18px;background:var(--chip);border:2.5px solid var(--line);flex-shrink:0}
.brand b{display:block;font-size:14px;line-height:1.05;font-weight:900;white-space:nowrap}
.brand small{display:block;font-size:11px;color:var(--soft);font-weight:800}
.spacer{flex:1}
.coins{display:flex;align-items:center;gap:5px;background:var(--coin);color:var(--coinink);border:3px solid var(--line);border-radius:999px;padding:3px 12px 3px 8px;font-size:18px;box-shadow:0 3px 0 var(--shade);white-space:nowrap;min-width:0}
.coins .cicon{font-size:16px}
.icon-btn{width:34px;height:34px;flex-shrink:0;border-radius:50%;border:3px solid var(--line);background:var(--panel2);font-size:15px;cursor:pointer;box-shadow:0 3px 0 var(--shade);display:grid;place-items:center;padding:0;-webkit-tap-highlight-color:transparent}
.icon-btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--shade)}

.stats{display:flex;gap:7px;flex-shrink:0}
.chip{flex:1;min-width:0;display:flex;align-items:center;justify-content:space-between;gap:6px;border:2.5px solid var(--line);border-radius:999px;padding:2px 10px;font-size:11.5px;font-weight:800;white-space:nowrap;box-shadow:0 2px 0 var(--shade);background:var(--chip);color:var(--chipink);overflow:hidden}
.chip.alt{background:var(--chip2);color:var(--chip2ink)}
.chip .num{font-size:14px}
.chip span{overflow:hidden;text-overflow:ellipsis}

.mission{display:flex;align-items:center;gap:10px;background:var(--panel);border:3px solid var(--line);border-radius:18px;padding:6px 10px;box-shadow:0 3px 0 var(--shade);flex-shrink:0}
.mt{display:flex;align-items:center;gap:6px;flex:0 1 48%;min-width:0;font-size:13px;font-weight:900}
.mt .star{color:#f2a900;font-size:15px}
.mt span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar{position:relative;flex:1;height:20px;border-radius:999px;background:var(--bar);border:2.5px solid var(--line);overflow:hidden}
.bar i{position:absolute;left:0;top:0;bottom:0;width:0;background:repeating-linear-gradient(45deg,var(--fill) 0 8px,var(--fill2) 8px 16px);transition:width .3s}
.bar span{position:absolute;inset:0;display:grid;place-items:center;font-size:12px;color:var(--ink);text-shadow:0 0 3px var(--panel),0 0 3px var(--panel)}

.stage{position:relative;flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
#c{display:block;touch-action:none}

.toast{position:absolute;left:50%;top:6px;transform:translate(-50%,-14px) scale(.9);opacity:0;pointer-events:none;background:var(--panel2);border:3px solid var(--line);border-radius:999px;padding:6px 14px;font-weight:800;font-size:13px;box-shadow:0 4px 0 var(--shade);transition:opacity .2s,transform .3s cubic-bezier(.3,1.7,.5,1);white-space:nowrap;z-index:5;max-width:calc(100% - 12px);overflow:hidden;text-overflow:ellipsis}
.toast.show{opacity:1;transform:translate(-50%,0) scale(1)}

.discover{position:absolute;left:50%;top:50%;transform:translate(-50%,-40%) scale(.6);opacity:0;pointer-events:none;background:var(--panel2);border:4px solid var(--line);border-radius:26px;padding:12px 22px 14px;text-align:center;box-shadow:0 6px 0 var(--shade);transition:opacity .2s,transform .4s cubic-bezier(.3,1.8,.5,1);z-index:6;min-width:200px;max-width:calc(100% - 20px)}
.discover.show{opacity:1;pointer-events:auto;transform:translate(-50%,-50%) scale(1)}
.discover canvas{display:block;margin:4px auto 2px;width:88px;height:88px}
.discover .dt{font-size:12px;font-weight:800;color:var(--soft)}
.discover .dn{font-size:22px;line-height:1.1}
.discover .dv{font-size:12px;font-weight:800;color:var(--chipink);margin-top:3px}

.boost{position:absolute;right:6px;bottom:6px;width:62px;height:62px;border-radius:50%;border:3px solid var(--line);background:var(--boost);color:#3b2a10;font-weight:900;font-size:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 4px 0 var(--boostd),0 6px 10px var(--shade);touch-action:none;cursor:pointer;line-height:1.05;padding:0;z-index:4;-webkit-tap-highlight-color:transparent}
.boost .ico{font-size:22px}
.boost.on{transform:translateY(3px) scale(.96);box-shadow:0 1px 0 var(--boostd);filter:brightness(1.08)}

.controls{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;flex-shrink:0;padding-top:6px}
.btn{--c:#ddd;--cd:#aaa;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:7px 2px 6px;border:3px solid var(--line);border-radius:18px;background:var(--c);color:#2b2230;cursor:pointer;box-shadow:0 5px 0 var(--cd),0 7px 10px var(--shade);transition:transform .08s,box-shadow .08s,filter .2s,opacity .2s;-webkit-tap-highlight-color:transparent;min-width:0}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--cd),0 2px 4px var(--shade)}
.btn .ico{font-size:22px;line-height:1.1}
.btn .lbl{font-size:11.5px;font-weight:900;white-space:nowrap}
.btn .price{display:inline-flex;align-items:center;gap:2px;background:rgba(255,255,255,.72);border-radius:999px;padding:0 6px;font-size:12px;line-height:17px;margin-top:2px;max-width:100%;white-space:nowrap}
.btn .price i{font-style:normal;font-size:9px}
.btn .tag{position:absolute;top:-10px;right:-5px;background:#fff;color:#2b2230;border:2px solid var(--line);border-radius:999px;font-size:9.5px;font-weight:900;padding:0 5px;line-height:15px;white-space:nowrap;max-width:110%;overflow:hidden}
.btn.off{filter:saturate(.3);opacity:.7}
.btn.ready{animation:ready 1s ease-in-out infinite}
.btn.ready:active{animation:none}
@keyframes ready{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}

.modal{position:fixed;inset:0;background:rgba(30,24,36,.52);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal.open{display:flex}
.card{background:var(--panel);border:4px solid var(--line);border-radius:26px;box-shadow:0 6px 0 var(--shade);padding:16px;width:100%;max-width:310px;text-align:center;display:flex;flex-direction:column;gap:10px}
.card h3{margin:0;font-size:19px;font-weight:900}
.card p{margin:0;font-size:12.5px;color:var(--soft);font-weight:700}
.card .big{font-size:34px;color:var(--coinink);line-height:1}
.card input{width:100%;padding:8px 10px;border:3px solid var(--line);border-radius:14px;font:inherit;font-weight:900;text-align:center;font-size:16px;background:var(--panel2);color:var(--ink);-webkit-user-select:text;user-select:text}
.quick{display:flex;gap:6px;justify-content:center}
.quick button{flex:1;border:2.5px solid var(--line);border-radius:999px;background:var(--panel2);font-weight:900;font-size:12px;padding:4px 0;cursor:pointer}
.row{display:flex;gap:8px}
.row button{flex:1;border:3px solid var(--line);border-radius:16px;padding:9px 0;font-weight:900;font-size:14px;cursor:pointer;color:#2b2230;box-shadow:0 3px 0 var(--shade)}
.row button:active{transform:translateY(2px);box-shadow:0 1px 0 var(--shade)}
.ok{background:#ffd76a}.no{background:#ece6ea}.ad{background:#9be58d}
.linkish{background:none;border:none;color:var(--soft);font-size:12px;font-weight:800;text-decoration:underline;cursor:pointer;padding:2px}

@media (prefers-reduced-motion: reduce){
  .btn.ready{animation:none}
  .toast,.discover{transition:none}
}
@media (max-height:640px){
  .btn .ico{font-size:19px}
  .btn{padding:5px 2px 5px}
  .mission{padding:4px 10px}
}

</style>
<div class="app">
  <header class="top">
    <div class="brand"><span class="logo" id="logo" aria-hidden="true"></span><div><b id="gTitle"></b><small id="lvl">Lv. 1</small></div></div>
    <div class="spacer"></div>
    <div class="coins"><span class="cicon" aria-hidden="true"></span><span class="num" id="money">0</span></div>
    <button class="icon-btn" id="btnSound" aria-label="Toggle sound">🔊</button>
    <button class="icon-btn" id="btnCheat" aria-label="Test tools" style="background:#ffd76a">⚡</button>
  </header>

  <div class="stats">
    <div class="chip"><b>+<span class="num" id="rate">0</span>/s</b><span>🏆 <span class="num" id="best">0</span></span></div>
    <div class="chip alt"><span id="gchip"></span></div>
  </div>

  <section class="mission" aria-live="polite">
    <div class="mt"><span class="star" aria-hidden="true">★</span><span id="mText"></span></div>
    <div class="bar"><i id="mFill"></i><span class="num" id="mNum">0/0</span></div>
  </section>

  <div class="stage" id="stage">
    <canvas id="c"></canvas>
    <div class="toast" id="toast"></div>
    <div class="discover" id="discover">
      <div class="dt" id="dTitle">New!</div>
      <canvas id="dIcon" width="176" height="176" aria-hidden="true"></canvas>
      <div class="dn num" id="dName"></div>
      <div class="dv" id="dVal"></div>
    </div>
    <button class="boost" id="boost" aria-label="Hold for speed boost"><span class="ico">⚡</span><span>Hold to<br>boost</span></button>
  </div>

  <nav class="controls" id="controls"></nav>
</div>

<div class="modal" id="offModal" role="dialog" aria-modal="true" aria-labelledby="offTitle">
  <div class="card">
    <h3 id="offTitle">Welcome back!</h3>
    <p id="offText">While you were away for 1h</p>
    <div class="big num"><span class="cicon"></span> <span id="offAmt">0</span></div>
    <div class="row"><button class="no" id="offCollect">Collect</button><button class="ad" id="offDouble">▶ Collect ×2</button></div>
    <p style="font-size:11px">Offline earnings are 50% of your rate, up to 2 hours.</p>
  </div>
</div>

<div class="modal" id="cheatModal" role="dialog" aria-modal="true" aria-labelledby="cheatTitle">
  <div class="card">
    <h3 id="cheatTitle">⚡ Test tools</h3>
    <p>Add coins to jump ahead</p>
    <input id="cheatAmt" type="number" inputmode="numeric" value="5000" aria-label="Coins to add">
    <div class="quick"><button data-a="5000">5K</button><button data-a="1000000">1M</button><button data-a="1000000000">1B</button><button data-a="1000000000000">1T</button></div>
    <div class="row"><button class="ok" id="cheatOk">Add coins</button><button class="no" id="cheatNo">Close</button></div>
    <button class="linkish" id="cheatAway">Simulate 1 hour away</button>
    <button class="linkish" id="resetBtn">Reset game</button>
  </div>
</div>

<script>
/* Shared idle-prototype engine: HUD, 5 upgrade buttons, missions, save, offline earnings,
   hold-to-boost, particles, floating text, tiny synth. Each game plugs in via IdleEngine.start(GAME). */
(function(){
'use strict';
const TAU = Math.PI * 2;
const $ = id => document.getElementById(id);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;

function fmt(n){
  if(!isFinite(n)) return '∞';
  n = Math.floor(n);
  if(n < 10000) return n.toLocaleString('en-US');
  const u = ['K','M','B','T','Qa','Qi','Sx','Sp','Oc'];
  let v = n, i = -1;
  while(v >= 1000 && i < u.length - 1){ v /= 1000; i++; }
  let s = v.toFixed(v >= 100 ? 0 : v >= 10 ? 1 : 2);
  if(s.indexOf('.') >= 0) s = s.replace(/0+$/, '').replace(/\.$/, '');
  return s + u[i];
}
function fmtTime(sec){
  sec = Math.floor(sec);
  const h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60), s = sec % 60;
  return h ? h + 'h ' + m + 'm' : m ? m + 'm ' + s + 's' : s + 's';
}
// small seeded RNG so static scenery is stable between redraws
function rng(seed){ let s = seed >>> 0 || 1; return () => { s ^= s << 13; s >>>= 0; s ^= s >> 17; s ^= s << 5; s >>>= 0; return s / 4294967296; }; }

function start(G){
  const W = G.W, H = G.H;
  const KEY = 'idle-proto-' + G.id + '-v1';
  const OFF_CAP = 7200, OFF_RATE = 0.5;
  const docRoot = document.documentElement;
  for(const k in G.theme) docRoot.style.setProperty('--' + k, G.theme[k]);
  $('gTitle').textContent = G.title;
  $('logo').textContent = G.logo || G.coin;
  document.querySelectorAll('.cicon').forEach(e => e.textContent = G.coin);

  /* ---------- state ---------- */
  function freshS(){
    const costs = {};
    G.buttons.forEach(b => costs[b.key] = b.base);
    return { money:G.startMoney || 20, costs, level:0, mission:0, progress:0,
             best:0, avgRate:0, total:0, lastSeen:Date.now(), muted:false };
  }
  let S = freshS(), g = null, lock = false;

  /* ---------- audio ---------- */
  let ac = null, lastCoin = 0;
  function unlock(){
    if(!ac){ try{ ac = new (window.AudioContext || window.webkitAudioContext)(); }catch(e){ ac = null; } }
    if(ac && ac.state === 'suspended'){ try{ ac.resume(); }catch(e){} }
  }
  function tone(f, d, type, v, to, delay){
    if(!ac || S.muted) return;
    try{
      const t0 = ac.currentTime + (delay || 0);
      const o = ac.createOscillator(), gn = ac.createGain();
      o.type = type || 'sine';
      o.frequency.setValueAtTime(f, t0);
      if(to) o.frequency.exponentialRampToValueAtTime(to, t0 + d);
      gn.gain.setValueAtTime(0.0001, t0);
      gn.gain.exponentialRampToValueAtTime(v || 0.07, t0 + 0.015);
      gn.gain.exponentialRampToValueAtTime(0.0001, t0 + d);
      o.connect(gn); gn.connect(ac.destination);
      o.start(t0); o.stop(t0 + d + 0.05);
    }catch(e){}
  }
  const sfx = {
    pop(){ tone(420, .12, 'sine', .09, 900); },
    coin(){ const n = performance.now(); if(n - lastCoin < 70) return; lastCoin = n; tone(900 + Math.random() * 250, .09, 'triangle', .045, 1500); },
    merge(){ [523,659,784,1047].forEach((f, i) => tone(f, .18, 'triangle', .07, null, i * .07)); },
    mission(){ [659,784,988].forEach((f, i) => tone(f, .16, 'triangle', .07, null, i * .08)); },
    levelup(){ [523,659,784,1047,1319].forEach((f, i) => tone(f, .22, 'triangle', .07, null, i * .09)); },
    boop(){ tone(240, .16, 'square', .03, 140); },
    splash(){ tone(700, .18, 'sine', .05, 200); },
    thud(){ tone(130, .14, 'sine', .08, 70); }
  };

  /* ---------- particles & floating text ---------- */
  let parts = [], texts = [];
  function spawn(x, y, o){
    o = o || {};
    const n = o.n || 6, cols = o.cols || ['#fff'];
    for(let i = 0; i < n; i++){
      parts.push({
        x, y,
        vx:(Math.random() - .5) * 90 * (o.spread || 1),
        vy:-(25 + Math.random() * 70) * (o.up === undefined ? 1 : o.up),
        g:o.g === undefined ? 90 : o.g,
        life:0, max:(o.life || .7) + Math.random() * .5,
        kind:o.kind || 'dot', ch:o.ch,
        col:cols[Math.floor(Math.random() * cols.length)],
        size:(o.size || 4) * (0.7 + Math.random() * 0.6), rot:Math.random() * TAU
      });
    }
    if(parts.length > 400) parts.splice(0, parts.length - 400);
  }
  function text(txt, x, y, col, size){
    texts.push({ txt, x, y, life:1, col:col || '#fff', size:size || 15 });
    if(texts.length > 60) texts.shift();
  }

  /* ---------- HUD refs ---------- */
  const el = {
    money:$('money'), lvl:$('lvl'), rate:$('rate'), best:$('best'), gchip:$('gchip'),
    mText:$('mText'), mFill:$('mFill'), mNum:$('mNum'), toast:$('toast'), sound:$('btnSound')
  };
  function setText(n, v){ if(n._v !== v){ n._v = v; n.textContent = v; } }
  let toastTimer = 0;
  function toast(msg, ms){
    el.toast.textContent = msg; el.toast.classList.add('show');
    clearTimeout(toastTimer); toastTimer = setTimeout(() => el.toast.classList.remove('show'), ms || 1700);
  }
  let discTimer = 0;
  const dCtx = $('dIcon').getContext('2d');
  function discover(title, name, desc, drawFn){
    $('dTitle').textContent = title; $('dName').textContent = name; $('dVal').textContent = desc || '';
    dCtx.setTransform(1, 0, 0, 1, 0, 0); dCtx.clearRect(0, 0, 176, 176);
    if(drawFn){ dCtx.save(); dCtx.setTransform(2, 0, 0, 2, 0, 0); try{ drawFn(dCtx, 44, 46, 1); }catch(e){} dCtx.restore(); }
    const box = $('discover'); box.classList.add('show');
    clearTimeout(discTimer); discTimer = setTimeout(() => box.classList.remove('show'), 2600);
  }
  $('discover').addEventListener('pointerdown', () => $('discover').classList.remove('show'));

  /* ---------- earnings ---------- */
  let T = 0, hist = [], rate = 0;
  function earn(v, x, y, o){
    o = o || {};
    if(!(v > 0)) return;
    S.money += v; S.total += v;
    hist.push({ t:T, a:v });
    if(x !== undefined && !o.silentText) text('+' + fmt(v), x, y, o.col, o.size);
    if(!o.quiet) sfx.coin();
    missionAdvance('earn', null, v);
  }

  /* ---------- missions ---------- */
  function curM(){ const lv = G.levels[S.level]; return lv ? (lv.missions[S.mission] || null) : null; }
  function missionSync(){
    const m = curM();
    if(!m || lock || m.type !== 'stat') return;
    const v = G.stat(g, m.key);
    S.progress = Math.min(v, m.target);
    if(v >= m.target) completeMission();
  }
  function missionAdvance(type, key, amt){
    const m = curM();
    if(!m || lock || m.type !== type) return;
    if(type === 'buy' && m.key !== key) return;
    S.progress += amt;
    if(S.progress >= m.target){ S.progress = m.target; completeMission(); }
  }
  function confetti(){ spawn(W / 2, H * 0.45, { n:34, cols:['#ff6b8b','#ffd24a','#5ad1a0','#6bb7ff','#c38bff','#fff'], spread:3.4, up:2.4, g:130, size:5, kind:'confetti', life:1.1 }); }
  function completeMission(){
    if(lock) return;
    lock = true;
    const m = curM(); if(m) S.progress = m.target;
    sfx.mission(); toast('★ Mission complete!');
    spawn(W / 2, 30, { n:12, cols:['#ffd24a','#fff'], spread:3, up:.6, size:5, kind:'star' });
    setTimeout(() => {
      lock = false;
      S.mission++; S.progress = 0;
      const lv = G.levels[S.level];
      if(lv && S.mission >= lv.missions.length){
        S.money += lv.bonus; S.level++; S.mission = 0;
        sfx.levelup(); confetti();
        toast(S.level >= G.levels.length ? '🏆 All levels cleared! +' + fmt(lv.bonus) : '🎉 Level ' + (S.level + 1) + '!  +' + fmt(lv.bonus) + ' ' + G.coin, 2600);
      }
      missionSync(); updateHUD(); save();
    }, 600);
  }

  /* ---------- buttons ---------- */
  const btnEls = {};
  const controls = $('controls');
  G.buttons.forEach(b => {
    const e = document.createElement('button');
    e.className = 'btn'; e.id = 'b_' + b.key;
    e.style.setProperty('--c', b.c); e.style.setProperty('--cd', b.cd);
    e.setAttribute('aria-label', b.label);
    e.innerHTML = '<span class="tag"></span><span class="ico" aria-hidden="true">' + b.icon + '</span><span class="lbl">' + b.label +
      '</span><span class="price"><i aria-hidden="true">' + G.coin + '</i><b class="num"></b></span>';
    e.addEventListener('click', () => { unlock(); buy(b); });
    controls.appendChild(e);
    btnEls[b.key] = { e, tag:e.querySelector('.tag'), price:e.querySelector('.price b') };
  });
  function deny(msg){ toast(msg || 'Not enough ' + G.coin); sfx.boop(); }
  function buy(b){
    const st = G.buyState(g, b.key) || {};
    if(st.max) return deny(st.reason || 'Maxed out!');
    if(!st.ok) return deny(st.reason);
    const cost = S.costs[b.key];
    if(S.money < cost) return deny();
    S.money -= cost;
    S.costs[b.key] = Math.ceil(cost * b.mult);
    G.buy(g, b.key, E);
    if(b.key === 'merge') sfx.merge(); else sfx.pop();
    missionAdvance('buy', b.key, 1);
    missionSync(); updateHUD();
  }

  function updateHUD(){
    setText(el.money, fmt(S.money));
    setText(el.lvl, S.level >= G.levels.length ? 'Lv. MAX' : 'Lv. ' + (S.level + 1));
    setText(el.rate, fmt(rate)); setText(el.best, fmt(S.best));
    setText(el.gchip, G.chip ? G.chip(g) : '');
    const m = curM();
    if(m){
      const pr = Math.min(S.progress, m.target);
      setText(el.mText, m.text);
      el.mFill.style.width = (pr / m.target * 100) + '%';
      setText(el.mNum, fmt(pr) + '/' + fmt(m.target));
    } else {
      setText(el.mText, 'All levels cleared!');
      el.mFill.style.width = '100%'; setText(el.mNum, '∞');
    }
    for(const b of G.buttons){
      const st = G.buyState(g, b.key) || {}, r = btnEls[b.key], cost = S.costs[b.key];
      setText(r.price, st.max ? 'MAX' : fmt(cost));
      setText(r.tag, st.tag || '');
      r.tag.style.display = st.tag ? '' : 'none';
      const afford = S.money >= cost;
      r.e.classList.toggle('off', !!st.max || !st.ok || !afford);
      r.e.classList.toggle('ready', !!st.ready && !st.max && afford);
    }
    setText(el.sound, S.muted ? '🔇' : '🔊');
  }

  /* ---------- save / load ---------- */
  function save(){
    try{
      S.lastSeen = Date.now();
      localStorage.setItem(KEY, JSON.stringify({ v:1, S, g:G.serialize(g) }));
    }catch(e){}
  }
  let awaySec = 0;
  function load(){
    try{
      const raw = localStorage.getItem(KEY);
      if(!raw) return false;
      const d = JSON.parse(raw);
      if(!d || d.v !== 1 || !d.S) return false;
      const f = freshS();
      for(const k in f){
        if(k === 'costs'){ for(const c in f.costs){ const v = d.S.costs && d.S.costs[c]; S.costs[c] = Number.isFinite(v) ? v : f.costs[c]; } }
        else if(typeof f[k] === 'number') S[k] = Number.isFinite(d.S[k]) ? d.S[k] : f[k];
        else if(typeof f[k] === 'boolean') S[k] = !!d.S[k];
      }
      g = G.restore(E, d.g) || null;
      awaySec = Math.max(0, (Date.now() - S.lastSeen) / 1000);
      return !!g;
    }catch(e){ return false; }
  }

  /* ---------- offline earnings ---------- */
  let offAmt = 0;
  function showOffline(sec){
    const r = Math.max(S.avgRate, rate);
    offAmt = Math.floor(r * Math.min(sec, OFF_CAP) * OFF_RATE);
    if(offAmt <= 0) return;
    $('offText').textContent = 'Your ' + (G.workers || 'crew') + ' kept going for ' + fmtTime(Math.min(sec, OFF_CAP)) + (sec > OFF_CAP ? ' (2h cap)' : '');
    setText($('offAmt'), fmt(offAmt));
    $('offModal').classList.add('open');
  }
  function collectOffline(mult){
    unlock();
    if(offAmt > 0){ S.money += offAmt * mult; S.total += offAmt * mult; sfx.levelup(); confetti(); toast('+' + fmt(offAmt * mult) + ' ' + G.coin + ' collected'); }
    offAmt = 0; $('offModal').classList.remove('open'); updateHUD(); save();
  }
  $('offCollect').addEventListener('click', () => collectOffline(1));
  $('offDouble').addEventListener('click', () => collectOffline(2));

  /* ---------- canvas ---------- */
  const canvas = $('c'), ctx = canvas.getContext('2d');
  const bg = document.createElement('canvas'), bgctx = bg.getContext('2d');
  let K = 1;
  function renderStatic(){
    bgctx.setTransform(1, 0, 0, 1, 0, 0); bgctx.clearRect(0, 0, bg.width, bg.height);
    bgctx.setTransform(K, 0, 0, K, 0, 0);
    if(G.drawStatic && g) G.drawStatic(g, bgctx, E);
  }
  function resize(){
    const st = $('stage'), bw = st.clientWidth, bh = st.clientHeight;
    if(bw < 10 || bh < 10) return;
    const s = Math.min(bw / W, bh / H);
    const cw = Math.floor(W * s), ch = Math.floor(H * s);
    const dpr = Math.min(window.devicePixelRatio || 1, 2.5);
    canvas.style.width = cw + 'px'; canvas.style.height = ch + 'px';
    canvas.width = Math.round(cw * dpr); canvas.height = Math.round(ch * dpr);
    bg.width = canvas.width; bg.height = canvas.height;
    K = canvas.width / W;
    renderStatic();
  }

  function drawOverlay(){
    for(const p of parts){
      const a = 1 - p.life / p.max;
      ctx.globalAlpha = clamp(a * 1.4, 0, 1);
      ctx.fillStyle = p.col;
      if(p.kind === 'star'){
        ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot + p.life * 3);
        ctx.beginPath();
        for(let i = 0; i < 8; i++){ const r = i % 2 ? p.size * 0.42 : p.size * 1.2, an = i * Math.PI / 4; ctx.lineTo(Math.cos(an) * r, Math.sin(an) * r); }
        ctx.closePath(); ctx.fill(); ctx.restore();
      } else if(p.kind === 'confetti'){
        ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot + p.life * 6);
        ctx.fillRect(-p.size, -p.size * 0.45, p.size * 2, p.size * 0.9); ctx.restore();
      } else if(p.kind === 'ring'){
        ctx.strokeStyle = p.col; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(p.x, p.y, p.size * (1 + p.life * 2), 0, TAU); ctx.stroke();
      } else if(p.kind === 'text'){
        ctx.font = (p.size * 3) + 'px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText(p.ch, p.x, p.y);
      } else {
        ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, TAU); ctx.fill();
      }
    }
    ctx.globalAlpha = 1;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.lineJoin = 'round';
    for(const t of texts){
      ctx.globalAlpha = clamp(t.life * 1.6, 0, 1);
      ctx.font = t.size + "px 'Lilita One', 'Nunito', sans-serif";
      ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(40,30,40,.85)';
      ctx.strokeText(t.txt, t.x, t.y); ctx.fillStyle = t.col; ctx.fillText(t.txt, t.x, t.y);
    }
    ctx.globalAlpha = 1;
  }
  function render(){
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.drawImage(bg, 0, 0);
    ctx.setTransform(K, 0, 0, K, 0, 0);
    G.draw(g, ctx, T, E);
    drawOverlay();
  }

  /* ---------- sim ---------- */
  let statAcc = 0, hudAcc = 0, saveAcc = 0, boostOn = false;
  function step(dt){
    T += dt;
    G.step(g, dt, E);
    for(let i = parts.length - 1; i >= 0; i--){
      const p = parts[i];
      p.life += dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += p.g * dt;
      if(p.life >= p.max) parts.splice(i, 1);
    }
    for(let i = texts.length - 1; i >= 0; i--){
      const t = texts[i]; t.y -= 38 * dt; t.life -= dt * 1.25;
      if(t.life <= 0) texts.splice(i, 1);
    }
  }
  function tick(realDt){
    const speed = boostOn ? 3 : 1;
    let left = realDt * speed;
    while(left > 1e-6){ const h = Math.min(left, 1 / 60); step(h); left -= h; }
    statAcc += realDt;
    if(statAcc >= .25){
      statAcc = 0;
      while(hist.length && T - hist[0].t > 5 * speed) hist.shift();
      let sum = 0; for(const h of hist) sum += h.a;
      rate = sum / 5;
      if(rate > S.best) S.best = rate;
      if(!boostOn) S.avgRate = S.avgRate + (rate - S.avgRate) * 0.06;
    }
    hudAcc += realDt;
    if(hudAcc >= .12){ hudAcc = 0; missionSync(); updateHUD(); }
    saveAcc += realDt;
    if(saveAcc >= 4){ saveAcc = 0; save(); }
  }

  /* ---------- API for games ---------- */
  const E = {
    W, H, TAU, fmt, clamp, lerp, rng,
    rand:(a, b) => a + Math.random() * (b - a),
    irand:(a, b) => Math.floor(a + Math.random() * (b - a + 1)),
    earn, spawn, text, toast, discover, sfx, tone,
    redrawStatic:renderStatic,
    get money(){ return S.money; },
    get T(){ return T; },
    get boost(){ return boostOn; },
    cost:key => S.costs[key],
    // rounded-rect helper
    rr(c, x, y, w, h, r){
      r = Math.min(r, w / 2, h / 2);
      c.beginPath(); c.moveTo(x + r, y);
      c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r);
      c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath();
    },
    // filled shape with the chunky outline used across the prototypes
    fo(c, fill, lw, line){ c.fillStyle = fill; c.fill(); c.lineWidth = lw || 3; c.strokeStyle = line || G.outline || '#2e3a28'; c.stroke(); }
  };

  /* ---------- input ---------- */
  const boostBtn = $('boost');
  function setBoost(on){ if(boostOn === on) return; boostOn = on; boostBtn.classList.toggle('on', on); if(on){ unlock(); toast('⚡ 3× speed', 800); } }
  boostBtn.addEventListener('pointerdown', e => { e.preventDefault(); try{ boostBtn.setPointerCapture(e.pointerId); }catch(_){} setBoost(true); });
  ['pointerup','pointercancel','lostpointercapture'].forEach(n => boostBtn.addEventListener(n, () => setBoost(false)));
  boostBtn.addEventListener('contextmenu', e => e.preventDefault());
  window.addEventListener('blur', () => setBoost(false));
  window.addEventListener('keydown', e => { if(e.code === 'Space' && !/INPUT|TEXTAREA/.test((e.target && e.target.tagName) || '')){ e.preventDefault(); if(!e.repeat) setBoost(true); } });
  window.addEventListener('keyup', e => { if(e.code === 'Space'){ setBoost(false); } });
  canvas.addEventListener('pointerdown', e => {
    unlock();
    const r = canvas.getBoundingClientRect();
    const x = (e.clientX - r.left) / r.width * W, y = (e.clientY - r.top) / r.height * H;
    if(G.tap) G.tap(g, x, y, E);
  });
  el.sound.addEventListener('click', () => { unlock(); S.muted = !S.muted; if(!S.muted) sfx.pop(); updateHUD(); save(); });

  const modal = $('cheatModal'), amt = $('cheatAmt'), resetBtn = $('resetBtn');
  let resetArmed = false;
  function closeCheat(){ modal.classList.remove('open'); resetArmed = false; resetBtn.textContent = 'Reset game'; }
  $('btnCheat').addEventListener('click', () => { unlock(); modal.classList.add('open'); });
  $('cheatNo').addEventListener('click', closeCheat);
  modal.addEventListener('pointerdown', e => { if(e.target === modal) closeCheat(); });
  document.querySelectorAll('.quick button').forEach(b => b.addEventListener('click', () => { amt.value = b.dataset.a; }));
  $('cheatOk').addEventListener('click', () => {
    const v = parseFloat(amt.value);
    if(isFinite(v) && v > 0){ S.money += v; sfx.levelup(); }
    closeCheat(); updateHUD();
  });
  $('cheatAway').addEventListener('click', () => {
    closeCheat();
    if(Math.max(S.avgRate, rate) <= 0){ toast('Earn something first, then try again'); return; }
    showOffline(3600);
  });
  resetBtn.addEventListener('click', () => {
    if(!resetArmed){ resetArmed = true; resetBtn.textContent = 'Tap again to erase everything'; return; }
    const muted = S.muted;
    S = freshS(); S.muted = muted; g = G.init(E);
    try{ localStorage.removeItem(KEY); }catch(e){}
    parts = []; texts = []; hist = []; rate = 0;
    renderStatic(); closeCheat(); missionSync(); updateHUD(); save();
    toast('Fresh start!');
  });

  /* ---------- boot ---------- */
  if(!load()){ S = freshS(); g = G.init(E); awaySec = 0; }
  resize();
  missionSync(); updateHUD();
  if(awaySec >= 60) showOffline(awaySec);
  if('ResizeObserver' in window) new ResizeObserver(resize).observe($('stage'));
  window.addEventListener('resize', resize);
  if(document.fonts){ try{ document.fonts.ready.then(renderStatic).catch(() => {}); }catch(e){} }

  let last = performance.now();
  function frame(now){
    let dt = (now - last) / 1000; last = now;
    if(dt > 0.05) dt = 0.05; if(dt < 0) dt = 0;
    tick(dt); render();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
  document.addEventListener('visibilitychange', () => { if(document.hidden) save(); });
  window.addEventListener('pagehide', save);

  // exposed for automated checks only
  window.__proto = { get S(){ return S; }, get g(){ return g; }, E, G, tick:(s) => { let t = s; while(t > 0){ const h = Math.min(t, .05); tick(h); t -= h; } }, buy:(k) => buy(G.buttons.find(b => b.key === k)) };
}

window.IdleEngine = { start };
})();

</script>
<script>
/* SHINE REVEAL — little cleaning bots pressure-wash grime off big treasures, revealing them shining underneath.
   Restored treasures go to the museum shelf and keep paying forever.
   Add = a new Sponge Bot · Merge = two equal bots become a stronger bot · Pressure = faster, stronger spray ·
   Polish = value multiplier (specks + museum) · Next = wheel in the next treasure (only once the current one is restored). */
const GAME = (function(){
const W = 420, H = 600, TAU = Math.PI * 2;
const OUT = '#3a2a1e';
// treasure area (logical) and grime grid
const AX = 48, AY = 94, AW = 324, AH = 360, CELL = 6, GW = 54, GH = 60, RES = 2;
const ACX = AX + AW / 2;
const MAX_BOTS = 10, MAX_TIER = 8, FINISH = 0.97;
const GA = [0, .36, .66, .95];           // grime alpha per stage (0 = clean)

const TREASURES = [
  { name:'Mosaic Tile',          short:'Mosaic' },
  { name:'Porcelain Vase',       short:'Vase'   },
  { name:'Stained-Glass Window', short:'Window' },
  { name:'Golden Trophy',        short:'Trophy' },
  { name:'Ancient Coin',         short:'Coin'   },
  { name:'Jewelled Crown',       short:'Crown'  }
];
const NT = TREASURES.length;
const GRIME = [   // base, blobs…, speck dark, speck light
  ['#6f5536','#5b4429','#77703f','#4b3a22','#94804f'],
  ['#5f6b3b','#4c592b','#727d46','#3c4722','#8a935a'],
  ['#6c6457','#585146','#827a69','#46403a','#9d937e'],
  ['#4f563a','#3f472d','#626a45','#2e3521','#76603a'],
  ['#3f6556','#325347','#507866','#26423a','#6f5c3b'],
  ['#433a33','#322a25','#554a41','#231d1a','#62553f']
];
const TIERS = [
  { name:'Sponge Bot',  col:'#ffe066', dk:'#cf9d1f' },
  { name:'Spray Bot',   col:'#6cc6ff', dk:'#2f86cf' },
  { name:'Foam Bot',    col:'#ff9fd2', dk:'#cf5a98' },
  { name:'Jet Bot',     col:'#7ee081', dk:'#39a64a' },
  { name:'Steam Bot',   col:'#ff9a4d', dk:'#cf6118' },
  { name:'Laser Bot',   col:'#b18cff', dk:'#7650d4' },
  { name:'Gold Bot',    col:'#ffc21a', dk:'#b97d00' },
  { name:'Diamond Bot', col:'#aef6ff', dk:'#3fb7cc' }
];

// per-treasure economy (normalised to NREF cells so every treasure has the same total dirt/value scale)
const NREF = 2200;
const HBASE = [7, 70, 480, 2400, 9600, 40000];
const VBASE = [1, 6, 36, 216, 1296, 7776];
const MUSEUM = 15;
const polishMult = g => Math.pow(1.3, g.polish);
const pressMult  = g => Math.pow(1.15, g.pressure);
const cellValue  = g => VBASE[g.cur] * NREF / g.N * polishMult(g);
const museumOne  = (g, i) => MUSEUM * VBASE[i] * polishMult(g);
function museumRate(g){ let s = 0; for(let i = 0; i < g.museum; i++) s += museumOne(g, i); return s; }
const tierMult = t => Math.pow(2.5, t - 1);
const botR     = t => 12.5 + t * 1.2;
const sprayR   = t => 14 + 2 * t;
const botPower = (g, t) => 1.5 * tierMult(t) * pressMult(g);
const botSpeed = (g, t) => Math.min(520, 150 * (1 + .07 * (t - 1)) * pressMult(g));
const slotX = i => 35 + i * 70;
const parkX = i => 66 + i * 29;
const PARK_Y = 572;
const parkY = (i, t) => PARK_Y - (i % 2) * 9 - t * .6;

function mk(w, h){ const cv = document.createElement('canvas'); cv.width = w; cv.height = h; return cv; }
function shade(hex, a){
  const n = parseInt(hex.slice(1), 16); let r = n >> 16, gg = n >> 8 & 255, b = n & 255;
  if(a >= 0){ r += (255 - r) * a; gg += (255 - gg) * a; b += (255 - b) * a; } else { r *= 1 + a; gg *= 1 + a; b *= 1 + a; }
  return 'rgb(' + (r | 0) + ',' + (gg | 0) + ',' + (b | 0) + ')';
}
function starPath(c, x, y, R, r, n, rot){
  c.beginPath();
  for(let i = 0; i < n * 2; i++){ const rr = i % 2 ? r : R, a = rot + i * Math.PI / n; c.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr); }
  c.closePath();
}
function archPath(c, x0, x1, yTop, yBot){
  const r = (x1 - x0) / 2, cx = (x0 + x1) / 2;
  c.beginPath(); c.moveTo(x0, yBot); c.lineTo(x0, yTop + r); c.arc(cx, yTop + r, r, Math.PI, 0); c.lineTo(x1, yBot); c.closePath();
}
const easeBack = t => { const s = 1.70158, u = t - 1; return 1 + (s + 1) * u * u * u + s * u * u; };
const easeIO = t => t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;

/* =================== treasure art (local coords 0..324 × 0..360) =================== */
function drawMosaic(c, E){
  E.rr(c, 12, 58, 300, 296, 18); E.fo(c, '#b8743f', 3.5, OUT);
  c.fillStyle = '#d4955b'; E.rr(c, 20, 63, 284, 9, 4); c.fill();
  E.rr(c, 26, 72, 272, 270, 8); E.fo(c, '#efe2c4', 3, OUT);
  const r = E.rng(1234), n = 21, s = 264 / n, x0 = 30, y0 = 75;
  for(let gy = 0; gy < n; gy++) for(let gx = 0; gx < n; gx++){
    const u = (gx + .5) / n * 2 - 1, v = (gy + .5) / n * 2 - 1;
    const d = Math.hypot(u, v), a = Math.atan2(v, u), edge = Math.max(Math.abs(u), Math.abs(v));
    const pc = Math.abs(Math.cos(a * 2)), ps = Math.abs(Math.sin(a * 2));
    const petal = .22 + .54 * Math.pow(pc, 1.1), leaf = .24 + .44 * Math.pow(ps, 2.2);
    let col;
    if(edge > .9) col = (gx + gy) % 2 ? '#1fa5a0' : '#f2b632';
    else if(edge > .8) col = '#2f5fc0';
    else if(d < .12) col = '#ffd23a';
    else if(d < .22) col = '#ff8a3c';
    else if(d < petal) col = d < petal - .17 ? '#ff9cc0' : '#e8456f';
    else if(d < leaf) col = d < leaf - .14 ? '#7ad67a' : '#3f9e58';
    else if(Math.abs(Math.abs(u) - .64) + Math.abs(Math.abs(v) - .64) < .11) col = '#f2b632';
    else col = '#a6e1f4';
    const x = x0 + gx * s + 1, y = y0 + gy * s + 1, w = s - 2;
    c.fillStyle = shade(col, (r() - .5) * .12);
    E.rr(c, x + (r() - .5) * .7, y + (r() - .5) * .7, w, w, 2.2); c.fill();
    c.fillStyle = 'rgba(255,255,255,.4)'; c.fillRect(x + 2, y + 2, w * .45, 1.8);
  }
  // glaze gloss
  c.save(); E.rr(c, 26, 72, 272, 270, 8); c.clip();
  c.fillStyle = 'rgba(255,255,255,.2)';
  c.beginPath(); c.moveTo(26, 150); c.lineTo(110, 72); c.lineTo(160, 72); c.lineTo(26, 200); c.closePath(); c.fill();
  c.beginPath(); c.moveTo(26, 226); c.lineTo(190, 72); c.lineTo(204, 72); c.lineTo(26, 240); c.closePath(); c.fill();
  c.restore();
  E.rr(c, 26, 72, 272, 270, 8); c.lineWidth = 3; c.strokeStyle = OUT; c.stroke();
}

function vasePath(c){
  c.beginPath();
  c.moveTo(116, 12); c.lineTo(208, 12);
  c.quadraticCurveTo(214, 28, 196, 34);
  c.bezierCurveTo(186, 62, 190, 90, 214, 110);
  c.bezierCurveTo(300, 160, 300, 250, 236, 318);
  c.lineTo(242, 352); c.lineTo(82, 352); c.lineTo(88, 318);
  c.bezierCurveTo(24, 250, 24, 160, 110, 110);
  c.bezierCurveTo(134, 90, 138, 62, 128, 34);
  c.quadraticCurveTo(110, 28, 116, 12);
  c.closePath();
}
function drawVase(c, E){
  const B1 = '#1f4fa8', B2 = '#3b6fd6', B3 = '#8fb0ee';
  vasePath(c); c.fillStyle = '#f7f9ff'; c.fill();
  c.save(); vasePath(c); c.clip();
  let gr = c.createLinearGradient(40, 0, 290, 0);
  gr.addColorStop(0, 'rgba(120,150,210,.28)'); gr.addColorStop(.3, 'rgba(255,255,255,0)'); gr.addColorStop(.7, 'rgba(255,255,255,0)'); gr.addColorStop(1, 'rgba(90,120,190,.4)');
  c.fillStyle = gr; c.fillRect(0, 0, 324, 360);
  // lip + neck bands
  c.fillStyle = B1; c.fillRect(0, 12, 324, 18);

function buildTreasure(g, E, i){

function addGlint(g, idx){

function cleanCell(g, idx, b){

/* ---------- bots ---------- */
function newBot(t, x, y){ return { t, x, y, tx:x, ty:y, hx:x, hy:y, mode:'idle', acc:0, accT:Math.random() * .3, fxT:Math.random() * .1, pop:1, seed:Math.random() * 10, ang:1.2, side:Math.random() < .5 ? -1 : 1 }; }
function pickTarget(g, b){
  if(g.dirtyN <= 0){ b.mode = 'idle'; return; }
  const rx = b.mode === 'park' || b.mode === 'idle' ? b.x : b.tx, ry = b.mode === 'park' || b.mode === 'idle' ? b.y : b.ty;
  let best = -1, bs = 1e18;
  const tries = Math.min(10, g.dirtyN);
  for(let k = 0; k < tries; k++){
    const idx = g.dlist[Math.floor(Math.random() * g.dirtyN)];
    const px = AX + (idx % GW) * CELL + 3, py = AY + (idx / GW | 0) * CELL + 3;
    let d = Math.hypot(px - rx, py - ry);
    for(const o of g.bots){ if(o !== b && (o.mode === 'spray' || o.mode === 'fly')){ const dd = Math.hypot(px - o.tx, py - o.ty); if(dd < 56) d += (56 - dd) * 3; } }
    if(d < bs){ bs = d; best = idx; }
  }
  let tx = AX + (best % GW) * CELL + 3, ty = AY + (best / GW | 0) * CELL + 3;
  const dx = tx - rx, dy = ty - ry, dl = Math.hypot(dx, dy);
  if(dl > 1 && dl < 120){ const sh = sprayR(b.t) * .6; tx += dx / dl * sh; ty += dy / dl * sh; }
  b.tx = Math.max(AX + 2, Math.min(AX + AW - 2, tx)); b.ty = Math.max(AY + 2, Math.min(AY + AH - 2, ty));
  if(Math.abs(b.x - b.tx) > 40) b.side = b.x < b.tx ? -1 : 1;
  const off = 24 + b.t * 1.8;
  b.hx = Math.max(16, Math.min(W - 16, b.tx + b.side * off));
  b.hy = b.ty - 30 - b.t * 1.5; if(b.hy < AY + 2) b.hy = b.ty + 30 + b.t * 1.5;
  b.mode = 'fly';
}
function spray(g, b, dt){
  const r = sprayR(b.t), p = botPower(g, b.t) * dt, h = g.hard, r2 = r * r;
  const gx0 = Math.max(0, Math.floor((b.tx - AX - r) / CELL)), gx1 = Math.min(GW - 1, Math.floor((b.tx - AX + r) / CELL));
  const gy0 = Math.max(0, Math.floor((b.ty - AY - r) / CELL)), gy1 = Math.min(GH - 1, Math.floor((b.ty - AY + r) / CELL));
  let left = 0;
  for(let gy = gy0; gy <= gy1; gy++){
    const cy = AY + gy * CELL + 3 - b.ty, row = gy * GW;
    for(let gx = gx0; gx <= gx1; gx++){
      const idx = row + gx;
      if(g.dirt[idx] <= 0) continue;
      const cx = AX + gx * CELL + 3 - b.tx;
      if(cx * cx + cy * cy > r2) continue;
      const d = g.dirt[idx] - p;
      if(d <= 0){ cleanCell(g, idx, b); continue; }
      g.dirt[idx] = d; left++;
      const st = Math.ceil(d / h * 3);
      if(st !== g.stage[idx]){ g.stage[idx] = st; paintCell(g, idx); }
    }
  }
  if(!left) pickTarget(g, b);
}
function botMove(b, x, y, sp, dt){
  const dx = x - b.x, dy = y - b.y, d = Math.hypot(dx, dy);
  if(d > .3){ const m = Math.min(d, sp * dt); b.x += dx / d * m; b.y += dy / d * m; }
  return d;
}

function drawBot(c, E, t, x, y, ang, T, sleep, sc, seed){

function drawSpray(c, b, T, bob){

  step(g, dt, E){
    g.cv = cellValue(g);
    if(g.introT < 1) g.introT = Math.min(1, g.introT + dt * 1.9);
    // museum income
    g.musAcc += dt;
    if(g.musAcc >= 1){
      g.musAcc -= 1;
      const r = museumRate(g);
      if(r > 0){
        const k = g.musK++ % g.museum;
        E.earn(r, slotX(k), 70, { col:'#ffe27a', size:12, quiet:true });
        E.spawn(slotX(k), 34, { n:3, cols:['#ffe27a','#fff'], kind:'star', size:3, spread:.8, up:.4, life:.5 });
      }
    }
    // glints
    for(let i = g.glints.length - 1; i >= 0; i--){ const q = g.glints[i]; q.life += dt; if(q.life >= q.max) g.glints.splice(i, 1); }
    g.glT += dt;
    if(g.glT > (g.phase === 'done' ? .07 : .18)){
      g.glT = 0;
      const k = g.cells[Math.floor(Math.random() * g.N)];
      if(g.dirt[k] <= 0) addGlint(g, k);
    }
    // phases
    if(g.phase === 'clean' && g.dirtyN <= g.N * (1 - FINISH)){ g.phase = 'sweep'; g.sweep = -40; g.sweepAcc = 0; E.sfx.splash(); for(const b of g.bots) b.mode = 'park'; }
    if(g.phase === 'sweep'){
      g.sweep += dt * 440;
      for(let j = g.dirtyN - 1; j >= 0; j--){
        const idx = g.dlist[j], lx = (idx % GW) * CELL, ly = (idx / GW | 0) * CELL;
        if(lx + ly * .4 < g.sweep){ cleanCell(g, idx, null); g.sweepAcc += g.cv; }
      }
      g.sweepFx += dt;
      if(g.sweepFx > .05){
        g.sweepFx = 0;
        const yy = Math.random() * AH, xx = g.sweep - yy * .4;
        if(xx > 0 && xx < AW) E.spawn(AX + xx, AY + yy, { n:1, cols:['#fff','#ffe27a'], kind:'star', size:4, spread:.6, up:.3, life:.5 });
      }
      if(g.sweep > AW + AH * .4 + 40) finishRestore(g, E);
    }
    if(g.bonusLeft > 0){
      g.bonusT -= dt;
      if(g.bonusT <= 0){
        g.bonusT = .5;
        const v = Math.min(g.bonusLeft, g.bonusPart), k = g.cells[Math.floor(Math.random() * g.N)];
        const onPed = g.phase === 'done' && g.cur === g.bonusSlot;
        const x = onPed ? AX + (k % GW) * CELL : slotX(g.bonusSlot) + E.rand(-14, 14), y = onPed ? AY + (k / GW | 0) * CELL : 44;
        g.bonusLeft -= v; if(g.bonusLeft < g.bonusPart * .01) g.bonusLeft = 0;
        E.earn(v, x, y - 10, { col:'#ffe27a', size:17 });
        E.spawn(x, y, { n:5, cols:['#ffe27a','#fff','#f2b632'], kind:'star', size:4.5, spread:1.6, up:1.2 });
      }
    }
    if(g.phase === 'done'){
      g.restT += dt;
      if(g.discT >= 0){
        g.discT -= dt;
        if(g.discT < 0) E.discover('Treasure restored!', TREASURES[g.cur].name, 'Museum +' + E.fmt(museumOne(g, g.cur)) + '/s forever', miniIcon(MINI, g.cur));
      }
      if(g.flyT < 1){
        g.flyT += dt / .9;
        if(g.flyT >= 1){
          g.museum = Math.max(g.museum, g.cur + 1); E.redrawStatic();
          E.spawn(slotX(g.cur), 34, { n:12, cols:['#ffe27a','#fff','#6fd0c5'], spread:2, up:.8, kind:'star', size:4.5 });
          E.sfx.pop();
        }
      }
      g.shineWait -= dt;
      if(g.shineWait <= 0){ g.shineT = 0; g.shineWait = 3.4; }
      if(g.shineT < 1) g.shineT = Math.min(1, g.shineT + dt / 1.1);
    }
    // bots
    const nb = g.bots.length, work = g.phase === 'clean', every = Math.max(.3, .1 * nb);
    g.bots.forEach((b, i) => {
      if(b.pop > 0) b.pop = Math.max(0, b.pop - dt * 2);
      const sp = botSpeed(g, b.t);
      if(!work){
        if(b.mode !== 'park') b.mode = 'park';
        botMove(b, parkX(i), parkY(i, b.t), sp * .7, dt);
      } else {
        if(b.mode === 'park' || b.mode === 'idle') pickTarget(g, b);
        if(b.mode === 'fly' || b.mode === 'spray'){
          const d = botMove(b, b.hx, b.hy, sp, dt);
          if(b.mode === 'fly' && d < 5) b.mode = 'spray';
        }
        if(b.mode === 'spray'){
          spray(g, b, dt);
          b.fxT += dt;
          if(b.fxT > .16){ b.fxT = 0; const r = sprayR(b.t) * .6; E.spawn(b.tx + (Math.random() - .5) * r, b.ty + (Math.random() - .5) * r, { n:1, cols:['#bfeaff','#ffffff','#8fd3ff'], kind:'dot', size:2.4, spread:1.4, up:.9, life:.35 }); }
        }
      }
      b.accT += dt;
      if(b.accT >= every){
        b.accT = 0;
        if(b.acc >= 1){
          E.earn(b.acc, b.x, b.y - botR(b.t) - 12, { col:'#fff1b3', size:13 });
          E.spawn(b.x, b.y - 8, { n:2, cols:['#ffe27a','#fff'], kind:'star', size:3.5, spread:1, up:.7, life:.5 });
          b.acc = 0;
        }
      }
    });
  },

      c.restore();
    } else if(g.phase === 'done'){
      const last = g.cur >= NT - 1, pulse = 1 + Math.sin(T * 5) * .04;
      const txt = last ? 'Museum complete! ★' : 'All clean — tap Next!';
      c.save(); c.translate(210, AY + 22); c.scale(pulse, pulse);
      c.font = "16px 'Lilita One', 'Nunito', sans-serif";
      const w = c.measureText(txt).width + 30;
      E.rr(c, -w / 2, -15, w, 30, 15); E.fo(c, last ? '#ffe27a' : '#fffaf0', 3, OUT);
      c.fillStyle = last ? '#6b4a00' : '#1d6b62'; c.fillText(txt, 0, 1);
      c.restore();
    }
  }
};
})();

IdleEngine.start(GAME);
</script>
