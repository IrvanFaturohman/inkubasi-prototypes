<!doctype html><html><head>
<meta name="viewport" content="width=device-width, initial-scale=1"><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Slice Falls</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;700;800;900&display=swap">
<style>
  :root{
    color-scheme: light;
    --bg:#ffe6d5; --ink:#3b1d2a; --ink-2:#7d5563;
    --cash:#ffc12e; --cash-ink:#5a3a00;
    --btn:#ffffff; --btn-edge:#e8b39c; --main:#ff4f5e; --main-edge:#b52f3c;
    --lock:#fbe3d6; --merge:#8a3ffc; --merge-edge:#5c24b3; --leaf:#2e9e4f;
    --display:"Lilita One","Arial Rounded MT Bold","Trebuchet MS",system-ui,sans-serif;
    --body:"Nunito","Segoe UI",system-ui,-apple-system,sans-serif;
  }
  [hidden]{display:none!important}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-weight:700;overflow:hidden;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
  .app{height:100%;max-width:480px;margin:0 auto;display:flex;flex-direction:column;gap:10px;padding-inline:16px;padding-block:10px 12px;box-sizing:border-box}
  button{font-family:inherit;color:inherit;cursor:pointer}
  button:focus-visible{outline:3px solid var(--main);outline-offset:2px}

  .hud{display:flex;align-items:center;gap:10px}
  .loc{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1}
  .loc b{font-family:var(--display);font-weight:400;font-size:14px;letter-spacing:.03em;text-transform:uppercase;color:var(--main);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .loc span{font-size:12px;color:var(--ink-2);font-weight:800}
  .money{text-align:center;display:flex;flex-direction:column;line-height:1;flex:none}
  .money #money{font-family:var(--display);font-size:clamp(28px,8vw,36px);color:var(--ink);font-variant-numeric:tabular-nums}
  .money #rate{font-size:12px;color:var(--ink-2);margin-top:3px;font-variant-numeric:tabular-nums}
  .tools{flex:none;display:flex;justify-content:flex-end;gap:6px}
  .icon-btn{width:38px;height:38px;border-radius:12px;border:0;background:var(--btn);box-shadow:0 3px 0 var(--btn-edge);display:grid;place-items:center;flex:none}
  .icon-btn svg{width:20px;height:20px}

  .stage{position:relative;flex:1;min-height:200px;border-radius:22px;overflow:hidden;background:#f7cdb8;box-shadow:inset 0 0 0 3px rgba(59,29,42,.12)}
  #cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
  .hint{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);background:rgba(59,29,42,.84);color:#fff;font-weight:800;font-size:12px;padding:6px 12px 6px 8px;border-radius:999px;display:flex;align-items:center;gap:7px;pointer-events:none;white-space:nowrap}
  .hint i{width:16px;height:16px;border-radius:50%;background:var(--cash);animation:tap 1.2s ease-in-out infinite}
  @keyframes tap{0%,100%{transform:scale(.8)}50%{transform:scale(1.1)}}
  .banner{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);background:var(--ink);color:#fff;border-radius:16px;padding:10px 18px 12px;text-align:center;pointer-events:none;box-shadow:0 5px 0 rgba(0,0,0,.25);animation:bn 2.2s ease-out forwards;white-space:nowrap}
  .banner small{display:block;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--cash);font-weight:900}
  .banner b{font-family:var(--display);font-weight:400;font-size:26px}
  @keyframes bn{0%{opacity:0;transform:translate(-50%,-50%) scale(.6)}12%{opacity:1;transform:translate(-50%,-50%) scale(1.08)}20%{transform:translate(-50%,-50%) scale(1)}85%{opacity:1}100%{opacity:0;transform:translate(-50%,-70%)}}

  .info{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:13px;color:var(--ink-2);font-weight:800;font-variant-numeric:tabular-nums}
  .info span:first-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pay{font-family:var(--display);font-weight:400;color:var(--main);font-size:17px;white-space:nowrap}

  .upgrades{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .up{border:0;border-radius:16px;background:var(--btn);box-shadow:0 4px 0 var(--btn-edge);padding:9px 8px;display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:left;min-width:0;transition:transform .06s}
  .up:active{transform:translateY(3px);box-shadow:0 1px 0 var(--btn-edge)}
  .up-h{display:flex;align-items:center;gap:6px;min-width:0}
  .up-h i{width:26px;height:26px;border-radius:8px;background:var(--lock);display:grid;place-items:center;flex:none}
  .up-h i svg{width:18px;height:18px}
  .up-h b{font-size:13px;font-weight:900;line-height:1.1}
  .up small{font-size:11px;color:var(--ink-2);line-height:1.2;min-height:2.4em;width:100%}
  .cost{font-family:var(--display);font-size:14px;background:var(--cash);color:var(--cash-ink);padding:2px 9px;border-radius:8px;font-variant-numeric:tabular-nums}
  .up.poor .cost,.up.off .cost{background:var(--lock);color:var(--ink-2)}
  .up.off{opacity:.62}
  .up.hot{background:var(--merge);color:#fff;box-shadow:0 4px 0 var(--merge-edge);animation:glow 1.2s ease-in-out infinite}
  .up.hot small{color:#e6dcff}.up.hot .up-h i{background:rgba(255,255,255,.2)}
  .up.buy{animation:pop .25s}
  @keyframes pop{50%{transform:scale(1.05)}}
  @keyframes glow{50%{filter:brightness(1.15)}}

  .expand{position:relative;overflow:hidden;border:0;border-radius:14px;height:46px;font-weight:900;font-size:14px;background:#d99a86;color:#fff;box-shadow:0 4px 0 #b37866;flex:none}
  .expand .fill{position:absolute;inset:0;width:0;background:var(--main)}
  .expand span{position:relative}
  .expand.ready{background:var(--main);box-shadow:0 4px 0 var(--main-edge);animation:glow 1.2s ease-in-out infinite}

  .modal{position:fixed;inset:0;background:rgba(40,16,26,.55);display:grid;place-items:center;padding-inline:16px;z-index:10}
  .sheet{background:#fff;border-radius:22px;padding:20px;width:100%;max-width:380px;box-sizing:border-box;box-shadow:0 8px 0 var(--btn-edge)}
  .sheet h2{font-family:var(--display);font-weight:400;font-size:24px;margin:0 0 6px;text-wrap:balance}
  .sheet p{margin:0 0 14px;color:var(--ink-2);font-size:14px;line-height:1.45}
  .sheet .big{font-family:var(--display);font-size:34px;color:var(--main);margin:6px 0 14px;font-variant-numeric:tabular-nums}
  .row{display:flex;gap:8px}
  .row button{flex:1;border:0;border-radius:14px;height:46px;font-weight:900;font-size:14px}
  .b-alt{background:var(--lock);box-shadow:0 4px 0 #e6bfae}
  .b-gold{background:var(--cash);color:var(--cash-ink);box-shadow:0 4px 0 #c7921a}
  .b-red{background:#d6452b;color:#fff;box-shadow:0 4px 0 #9c2f1c}
  .toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 14px);transform:translateX(-50%);background:var(--ink);color:#fff;font-weight:800;font-size:13px;padding:8px 14px;border-radius:999px;z-index:20;pointer-events:none;white-space:nowrap}
  @media (prefers-reduced-motion: reduce){.hint i,.expand.ready,.up.hot,.up.buy{animation:none}.banner{animation-duration:.01s}}
  @media (max-height:680px){.up small{min-height:0}.app{gap:7px;padding-block:8px 10px}.up{padding:7px 8px}.expand{height:42px}}
</style>

<div class="app">
  <header class="hud">
    <div class="loc"><b id="tierName">Kitchen Counter</b><span id="tierStep">Tier 1 of 5</span></div>
    <div class="money"><span id="money">$30</span><span id="rate">$0 / min</span></div>
    <div class="tools">
      <button class="icon-btn" id="sndBtn" aria-label="Turn sound on"><svg viewBox="0 0 24 24" fill="none" stroke="#3b1d2a" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h4l5-4v14l-5-4H4z" fill="#3b1d2a"/><path id="sndWave" d="M16 9l5 6M21 9l-5 6"/></svg></button>
      <button class="icon-btn" id="resetBtn" aria-label="Start over"><svg viewBox="0 0 24 24" fill="none" stroke="#3b1d2a" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12a8 8 0 1 0 2.4-5.7"/><path d="M4 4v4.5h4.5"/></svg></button>
    </div>
  </header>

  <div class="stage" id="stage">
    <canvas id="cv"></canvas>
    <div class="hint" id="hint"><i></i>Every cut pays · tap to drop extra fruit</div>
  </div>

  <div class="info"><span id="slots">Blades 1/6 · Crates 0/1</span><span class="pay" id="ips">$0 /s</span></div>

  <div class="upgrades">
    <button class="up" id="bAdd"><div class="up-h"><i><svg viewBox="0 0 24 24"><path d="M4 20L15 6c1.5-1.8 3.6-2 4.4-1.2.3.3-.2 1.4-1 2.3L7.6 21z" fill="#c9d3da" stroke="#6b7680" stroke-width="1.2" stroke-linejoin="round"/><path d="M3 21l3-3.5 2.4 2.1L5.4 23z" fill="#8a5a3b"/></svg></i><b>Add Blade</b></div><small></small><span class="cost"></span></button>
    <button class="up" id="bMerge"><div class="up-h"><i><svg viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-width="2.4"><path d="M5 5l6 6M19 5l-6 6" stroke="#8a3ffc"/><path d="M12 11v9" stroke="#8a3ffc"/><circle cx="12" cy="20" r="2" fill="#8a3ffc" stroke="none"/></svg></i><b>Merge</b></div><small></small><span class="cost"></span></button>
    <button class="up" id="bStation"><div class="up-h"><i><svg viewBox="0 0 24 24"><circle cx="8" cy="9" r="3.4" fill="#e8283d"/><circle cx="15.5" cy="8.5" r="3.8" fill="#3aa84a"/><rect x="3" y="11" width="18" height="10" rx="1.6" fill="#c98b4b"/><path d="M3 15.5h18" stroke="#9c6632" stroke-width="1.6"/></svg></i><b>Add Crate</b></div><small></small><span class="cost"></span></button>
  </div>
  <button class="expand" id="bExpand"><div class="fill" id="expFill"></div><span id="expLabel">Taller Tower</span></button>
</div>

<div class="modal" id="modal" hidden><div class="sheet" id="sheet"></div></div>

<script>
(()=>{
'use strict';
const $=s=>document.querySelector(s);
const stage=$('#stage'),cv=$('#cv'),ctx=cv.getContext('2d');
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const TAU=Math.PI*2;

/* ================= design data ================= */
const TIERS=[
  {name:'Kitchen Counter',rows:[1,2,3],    wall:[16,96], base:.58,  drop:.75,fs:1,   st:1,exp:400},
  {name:'Fruit Stand',    rows:[1,2,3,2],  wall:[16,96], base:2.2,  drop:.85,fs:1.07,st:2,exp:5000},
  {name:'Juice Bar',      rows:[1,2,3,4],  wall:[4,108], base:8,    drop:.9, fs:1.13,st:3,exp:60000},
  {name:'Fruit Factory',  rows:[1,2,3,4,3],wall:[4,108], base:30,   drop:1,  fs:1.19,st:4,exp:800000},
  {name:'Sky Orchard',    rows:[1,2,3,4,3,2],wall:[4,108],base:100,drop:1.1,fs:1.25,st:5,exp:null}];
const LV=[
  {name:'Paring Knife',col:'#c9d3da'},{name:'Chef Knife',col:'#e9eef2'},{name:'Cleaver',col:'#9fb0bc'},{name:'Circular Saw',col:'#ffb703'},
  {name:'Katana',col:'#e23a4e'},{name:'Chainsaw',col:'#ff7a1a'},{name:'Plasma Blade',col:'#ff3dcf'},{name:'Laser Line',col:'#2af5ff'}];
const ST=[{name:'Apple Crate',b:.5,fr:'apple'},{name:'Melon Crate',b:.8,fr:'melon'},{name:'Pineapple Crate',b:1.2,fr:'pine'},
  {name:'Dragonfruit Crate',b:1.8,fr:'dragon'},{name:'Golden Melon Crate',b:2.6,fr:'gold'}];
const FR={
  orange:{r:6,  ax:1,   ay:1,   skin:'#ff9a1f',rind:'#ec7a0b',flesh:'#ffb547',edge:'#e98f22',pith:'#fff0d0',juice:'#ffa22e',rw:.75,det:'seg',segc:'#fff4dc'},
  lemon: {r:5.4,ax:1.16,ay:.9,  skin:'#ffe03a',rind:'#efc100',flesh:'#fff29a',edge:'#e8d45a',pith:'#fffbe6',juice:'#ffe95c',rw:.65,det:'seg',segc:'#fffdf0'},
  apple: {r:5.9,ax:1,   ay:.95, skin:'#e8283d',rind:'#c41c30',flesh:'#fff2cf',edge:'#ecd59c',juice:'#fff0b8',rw:.5, det:'core'},
  melon: {r:8.2,ax:1.1, ay:.96, skin:'#3aa84a',rind:'#26782f',flesh:'#ff4a5f',edge:'#d93448',pith:'#dcf7c8',juice:'#ff5b6e',rw:1.2,det:'seeds',stripes:'#1f6a2b',seed:'#2a1616'},
  pine:  {r:6.8,ax:.84, ay:1.12,skin:'#e0a12e',rind:'#a86a17',flesh:'#ffe25e',edge:'#e9c43c',juice:'#ffe76a',rw:1,  det:'pine',core:'#fff4b0'},
  dragon:{r:6.6,ax:.92, ay:1.08,skin:'#f23b8f',rind:'#d11f70',flesh:'#fbf7f9',edge:'#e8d4dd',juice:'#ff64ad',rw:.8, det:'dots',seed:'#1c1c1c'},
  gold:  {r:8,  ax:1.06,ay:1,   skin:'#ffcf3a',rind:'#d49b0c',flesh:'#fff1ae',edge:'#ead27a',pith:'#fffbe0',juice:'#ffdc6b',rw:1.1,det:'seeds',stripes:'#f2b51c',seed:'#b07d12',glow:1}};
const THEME=[
  {bg:'#fbe9d7',board:'#e9c38e',grain:'#d9a86b',post:'#b9824a',shelf:'#9a6a3a',stage:'#fbe9d7'},
  {bg:'#bfe7ff',board:'#d99d5e',grain:'#b77b3d',post:'#8c5a2b',shelf:'#6f4420'},
  {bg:'#1fa89c',board:'#e7fbf5',grain:'#c7eee4',post:'#ff5c8a',shelf:'#d63d6b'},
  {bg:'#4f5d6e',board:'#cfd8e0',grain:'#b3c0cb',post:'#39434f',shelf:'#2a323b'},
  {bg:'#8fd6ff',board:'#ffffff',grain:'#e3f3ff',post:'#5fae4c',shelf:'#3f8a33'}];

/* ================= geometry ================= */
const CX=56,RS=22,L0=19,CRX=[42,70,31,81,20];
const GEO=TIERS.map(T=>{const binTop=14+(T.rows.length-1)*RS+16;return{wl:T.wall[0],wr:T.wall[1],binTop,binBot:binTop+14,surf:binTop+5.6};});
const SLOTS=TIERS.map(T=>{const out=[];T.rows.forEach((n,r)=>{const xs=[];for(let i=0;i<n;i++)xs.push(CX+(i-(n-1)/2)*26);
  xs.sort((a,b)=>Math.abs(a-CX)-Math.abs(b-CX)||a-b);
  for(const x of xs){const col=Math.round((x-CX)/13),lean=(((col+r)/2)+100)&1;out.push({x,y:14+r*RS,th:(lean?112:68)*Math.PI/180});}});return out;});

/* ================= state & economy ================= */
const KEY='slice-falls-v1';
const FRESH=()=>({money:30,tier:0,bl:[1],st:0,buys:0,merges:0,seen:1,rate:0,t:Date.now(),hint:0});
const S=FRESH();
try{const s=JSON.parse(localStorage.getItem(KEY)||'null');if(s&&Array.isArray(s.bl)&&s.bl.length)Object.assign(S,s);}catch(e){}
S.tier=Math.max(0,Math.min(TIERS.length-1,S.tier|0));S.bl=S.bl.slice(0,SLOTS[S.tier].length).map(l=>Math.max(1,Math.min(8,l|0)));S.st=Math.min(S.st|0,TIERS[S.tier].st);
if(!S.buys&&S.tier===0&&S.money<30)S.money=30;
function save(){if(SIM)return;try{S.t=Date.now();localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
const T=()=>TIERS[S.tier];
const addCost=()=>12*Math.pow(1.3,S.buys),mergeCost=()=>20*Math.pow(1.38,S.merges),stCost=()=>60*Math.pow(7,S.st);
const stBonus=()=>{let b=0;for(let i=0;i<S.st;i++)b+=ST[i].b;return b;};
const cutVal=lv=>T().base*Math.pow(2.2,lv-1)*(1+stBonus());
let JV=.4;const juiceVal=()=>T().base*JV*(1+stBonus());
function findPair(){const c={};for(const l of S.bl)c[l]=(c[l]||0)+1;let best=0;for(const k in c)if(c[k]>=2&&+k<LV.length&&+k>best)best=+k;return best;}  // merge the highest pair: same cost, biggest gain
function fmt(n){if(n<1000)return '$'+Math.floor(n).toLocaleString('en-US');const u=['K','M','B','T','Qa'];let i=-1;while(n>=1000&&i<u.length-1){n/=1000;i++;}
  return '$'+parseFloat(n<10?n.toFixed(2):n<100?n.toFixed(1):Math.floor(n))+u[i];}
const fmtS=n=>n<10?'$'+(Math.round(n*10)/10):fmt(n);

/* ================= physics constants & pools ================= */
const REFA=Math.PI*7.2*7.2;let GRAV=150,TV=50,DRAG=7,SPR=3.5,HS=13,SEP=40,MINA=3.2,FRAC=.14;const MAXP=210;
let SIM=false,FX=true,NOPAY=false,gt=0;
const stats={cuts:0,fruits:0,juiced:0,bh:new Array(20).fill(0),rej:0};
const pool=[],live=[];
for(let i=0;i<MAXP;i++)pool.push({v:new Float32Array(112),n:0,tx:0,f:null,cx:0,cy:0,x:0,y:0,a:0,vx:0,vy:0,w:0,area:0,rad:0,mask:0,whole:false,glow:0,g1x:0,g1y:0,g2x:0,g2y:0,sc:1});
const AC={a:0,cx:0,cy:0};
function polyAC(v,n){let A=0,cx=0,cy=0;for(let i=0,j=n-1;i<n;j=i++){const cr=v[2*j]*v[2*i+1]-v[2*i]*v[2*j+1];A+=cr;cx+=(v[2*j]+v[2*i])*cr;cy+=(v[2*j+1]+v[2*i+1])*cr;}
  if(Math.abs(A)<1e-9){AC.a=0;AC.cx=v[0];AC.cy=v[1];return;}AC.a=Math.abs(A)*.5;AC.cx=cx/(3*A);AC.cy=cy/(3*A);}
function radOf(v,n,cx,cy){let m=0;for(let i=0;i<n;i++){const dx=v[2*i]-cx,dy=v[2*i+1]-cy,d=dx*dx+dy*dy;if(d>m)m=d;}return Math.sqrt(m);}
function hull(P){P.sort((a,b)=>a[0]-b[0]||a[1]-b[1]);const cr=(o,a,b)=>(a[0]-o[0])*(b[1]-o[1])-(a[1]-o[1])*(b[0]-o[0]),lo=[],up=[];
  for(const p of P){while(lo.length>=2&&cr(lo[lo.length-2],lo[lo.length-1],p)<=0)lo.pop();lo.push(p);}
  for(let i=P.length-1;i>=0;i--){const p=P[i];while(up.length>=2&&cr(up[up.length-2],up[up.length-1],p)<=0)up.pop();up.push(p);}
  up.pop();lo.pop();return lo.concat(up);}

/* ================= fruit ================= */
function pickType(){let tot=2;for(let i=0;i<S.st;i++)tot+=1.5+i*.5;let r=Math.random()*tot;if(r<1)return 'orange';if(r<2)return 'lemon';r-=2;
  for(let i=0;i<S.st;i++){r-=1.5+i*.5;if(r<0)return ST[i].fr;}return 'orange';}
function makeFruit(type){const D=FR[type],r=D.r*1.2*T().fs*(.94+Math.random()*.12),N=18,P=[];
  for(let i=0;i<N;i++){const a=i/N*TAU+Math.random()*.06,c=Math.cos(a),s=Math.sin(a);let x=c*r*D.ax,y=s*r*D.ay;
    if(type==='lemon')x*=1+.2*Math.pow(Math.abs(c),8);else if(type==='apple'){x*=1+.1*(-s);if(s>0)y*=.93;}else if(type==='dragon'&&s<0)y*=1+.12*Math.pow(-s,6);
    const w=1+(Math.random()-.5)*.03;P.push([x*w,y*w]);}
  const H=hull(P),n=H.length,v=new Float32Array(n*2);H.forEach((p,i)=>{v[i*2]=p[0];v[i*2+1]=p[1];});
  polyAC(v,n);const ox=AC.cx,oy=AC.cy;for(let i=0;i<n;i++){v[2*i]-=ox;v[2*i+1]-=oy;}
  const f={type,D,v,n,r,area:AC.a,R:radOf(v,n,0,0),count:1,rot:Math.random()*TAU,det:null};
  const d=[];
  if(D.det==='seeds'){const k=type==='gold'?9:13,rr=type==='gold'?.3:.56;for(let i=0;i<k;i++){const a=i/k*TAU+Math.random()*.3,q=r*(rr+Math.random()*.1);d.push(Math.cos(a)*q*D.ax,Math.sin(a)*q*D.ay,a);}}
  else if(D.det==='dots'){for(let i=0;i<34;i++){const a=Math.random()*TAU,q=r*.78*Math.sqrt(Math.random());d.push(Math.cos(a)*q*D.ax,Math.sin(a)*q*D.ay,0);}}

  if(FX){
    for(let i=0;i<PN;i++){if(pl[i]<=0)continue;pl[i]-=dt;pvy[i]+=GRAV*.6*dt;px_[i]+=pvx[i]*dt;py_[i]+=pvy[i]*dt;pvx[i]*=.985;}
    for(let i=0;i<SN;i++)if(sk[i*5+4]>0)sk[i*5+4]-=dt*4.5;
    for(const f of FL)if(f.on&&(f.t+=dt)>=f.life)f.on=false;
    if(fcV>0){pendX+=fcX;pendY+=fcY;pendV+=fcV;fcV=fcX=fcY=0;}
    if(pendV>0&&gt-lastFloat>(live.length>60?.22:.12)){addFloat(pendX/pendV,pendY/pendV-2,'+'+fmtS(pendV),pendV>=cutVal(1)*5?1:0);pendV=pendX=pendY=0;lastFloat=gt;}
    if((stainFade+=dt)>.5){stainFade=0;stx.globalCompositeOperation='destination-out';stx.fillStyle='rgba(0,0,0,.05)';stx.fillRect(0,0,stc.width,stc.height);stx.globalCompositeOperation='source-over';}}
  tickT+=dt;if(tickT>=.5){if(tickAcc>0)earnLog.push(gt,tickAcc);tickAcc=0;tickT=0;while(earnLog.length&&gt-earnLog[0]>60)earnLog.splice(0,2);}
}
function juice(p){const v=juiceVal();earn(v);stats.juiced++;if(!NOPAY){juicePend+=v;juiceX=p.x;}
  const c=p.f.D.juice,n=parseInt(c.slice(1),16),k=.04;binCol[0]+=((n>>16)-binCol[0])*k;binCol[1]+=((n>>8&255)-binCol[1])*k;binCol[2]+=((n&255)-binCol[2])*k;binLvl=Math.min(.9,binLvl+.012);
  if(FX){if(!reduce)for(let j=0;j<2;j++)emit(p.x+(Math.random()-.5)*2,GEO[S.tier].surf,(Math.random()-.5)*16,-14-Math.random()*16,c,.35+Math.random()*.4,.35);sPlop();}}

/* ================= money, text ================= */
const earnLog=[];let t0=0;
function ratePerSec(){let s=0;for(let i=1;i<earnLog.length;i+=2)s+=earnLog[i];const span=Math.min(60,Math.max(10,gt-t0));return s/span;}
function banner(small,big){if(SIM)return;const el=document.createElement('div');el.className='banner';el.innerHTML=`<small>${small}</small><b>${big}</b>`;stage.appendChild(el);setTimeout(()=>el.remove(),2300);}
let tt=null;function toast(m){let t=$('.toast');if(!t){t=document.createElement('div');t.className='toast';document.body.appendChild(t);}t.textContent=m;t.hidden=false;clearTimeout(tt);tt=setTimeout(()=>t.hidden=true,1600);}
function bump(el){if(!el)return;el.classList.remove('buy');void el.offsetWidth;el.classList.add('buy');}
function sparkle(x,y,col,n){if(!FX)return;for(let k=0;k<(reduce?6:n);k++){const a=Math.random()*TAU,s=10+Math.random()*30;emit(x,y,Math.cos(a)*s,Math.sin(a)*s-10,Math.random()<.5?col:'#ffffff',.4+Math.random()*.6,.5+Math.random()*.3);}}

/* ================= actions ================= */
function doAdd(){if(S.bl.length>=SLOTS[S.tier].length)return 'full';const c=addCost();if(S.money<c)return 'poor';
  S.money-=c;S.buys++;S.bl.push(1);const b=newBlade(1,S.bl.length-1,true);blades.push(b);sparkle(b.x,b.y,'#c9d3da',14);blip([660,880],.05,.1);return 'ok';}
function doMerge(){const L=findPair();if(!L)return 'none';const c=mergeCost();if(S.money<c)return 'poor';
  S.money-=c;S.merges++;const ids=[];for(let i=0;i<blades.length&&ids.length<2;i++)if(blades[i].lv===L)ids.push(i);
  for(const i of ids)sparkle(blades[i].x,blades[i].y,LV[L].col,12);
  const keep=ids[0];blades.splice(ids[1],1);const nb=blades[keep];nb.lv=L+1;nb.born=0;nb.fl=1;S.bl=blades.map(x=>x.lv);
  for(let i=0;i<blades.length;i++)blades[i].id=i;
  if(L+1>S.seen){S.seen=L+1;banner('New blade unlocked',LV[L].name);blip([784,988,1319,1568],.08);buzz([15,30,15]);return 'new';}
  blip([523,784],.07);buzz(12);return 'ok';}
function doStation(){if(S.st>=T().st)return 'full';const c=stCost();if(S.money<c)return 'poor';
  S.money-=c;crateBorn[S.st]=0;S.st++;banner('Crate added · +'+Math.round(ST[S.st-1].b*100)+'% pay',ST[S.st-1].name);sparkle(CRX[S.st-1],-8,FR[ST[S.st-1].fr].skin,20);blip([523,659,784],.07);buzz(15);return 'ok';}
function doExpand(){const Ti=T(),nx=TIERS[S.tier+1];if(!nx)return 'max';if(S.st<Ti.st)return 'st';if(S.money<Ti.exp)return 'poor';
  S.money-=Ti.exp;S.tier++;camGoal();banner('Tower expanded',nx.name);blip([523,659,784,1047],.09);buzz([20,40,20]);return 'ok';}

$('#bAdd').addEventListener('click',e=>{initAudio();const r=doAdd();if(r==='full')toast(findPair()?'Tower full — merge two blades!':'Tower full — build a taller tower');
  else if(r==='poor')toast(`Need ${fmt(addCost()-S.money)} more`);else{bump(e.currentTarget);updateUI();save();}});
$('#bMerge').addEventListener('click',e=>{initAudio();const r=doMerge();if(r==='none')toast('Need two blades of the same level');
  else if(r==='poor')toast(`Need ${fmt(mergeCost()-S.money)} more`);else{bump(e.currentTarget);updateUI();save();}});
$('#bStation').addEventListener('click',e=>{initAudio();const r=doStation();if(r==='full')toast(S.tier<TIERS.length-1?'Crate rack full — build a taller tower':'All crates built');
  else if(r==='poor')toast(`Need ${fmt(stCost()-S.money)} more`);else{bump(e.currentTarget);updateUI();save();}});
$('#bExpand').addEventListener('click',()=>{initAudio();const Ti=T(),r=doExpand();if(r==='st')toast(`Add all ${Ti.st} crate${Ti.st>1?'s':''} first`);
  else if(r==='poor')toast(`Need ${fmt(Ti.exp-S.money)} more`);else if(r==='ok'){updateUI();save();}});

/* ================= input: tap to drop extra fruit ================= */
let lastTap=-9,taps=0;
cv.addEventListener('pointerdown',e=>{initAudio();const r=cv.getBoundingClientRect(),G=GEO[S.tier];if(gt-lastTap<.22)return;
  let x=(e.clientX-r.left-cam.ox)/cam.s,y=(e.clientY-r.top-cam.oy)/cam.s;x=Math.max(G.wl+7,Math.min(G.wr-7,x));y=Math.max(-1,Math.min(6,y));
  if(spawnFruit(x,y,true)){lastTap=gt;buzz(6);sparkle(x,y,'#ffffff',6);if(++taps>=3&&!S.hint){S.hint=1;$('#hint').hidden=true;}}});

/* ================= UI ================= */
function setBtn(el,sub,cost,state){el.querySelector('small').textContent=sub;el.querySelector('.cost').textContent=cost;el.className='up'+(state?' '+state:'');}
function updateUI(){if(SIM)return;
  $('#money').textContent=fmt(S.money);const rps=ratePerSec();$('#rate').textContent=fmt(rps*60)+' / min';if(rps>0)S.rate=rps;
  $('#ips').textContent=fmtS(rps)+' /s';
  const Ti=T(),SL=SLOTS[S.tier].length,full=S.bl.length>=SL,pair=findPair();
  $('#tierName').textContent=Ti.name;$('#tierStep').textContent=`Tier ${S.tier+1} of ${TIERS.length}`;
  $('#slots').textContent=`Blades ${S.bl.length}/${SL} · Crates ${S.st}/${Ti.st}`;
  const ac=addCost();setBtn($('#bAdd'),full?'Tower full':`${S.bl.length}/${SL} slots · ${LV[0].name}`,full?'FULL':fmt(ac),full?'off':S.money<ac?'poor':'');
  const mc=mergeCost();setBtn($('#bMerge'),pair?`2× ${LV[pair-1].name} → ${LV[pair].name}`:'Need 2 of the same level',pair?fmt(mc):'—',!pair?'off':S.money<mc?'poor':full?'hot':'');
  const sfull=S.st>=Ti.st,sc=stCost();setBtn($('#bStation'),sfull?'Rack full':`${ST[S.st].name} · +${Math.round(ST[S.st].b*100)}% pay`,sfull?'FULL':fmt(sc),sfull?'off':S.money<sc?'poor':'');
  const nx=TIERS[S.tier+1],ex=$('#bExpand');
  if(!nx){$('#expLabel').textContent='Sky Orchard · the tallest tower';$('#expFill').style.width='100%';ex.classList.remove('ready');}
  else if(S.st<Ti.st){$('#expLabel').textContent=`Taller Tower · add ${Ti.st-S.st} more crate${Ti.st-S.st>1?'s':''} first`;$('#expFill').style.width=(S.st/Ti.st*50)+'%';ex.classList.remove('ready');}
  else{$('#expLabel').textContent=`Taller Tower → ${nx.name} · ${fmt(Ti.exp)}`;$('#expFill').style.width=(50+Math.min(50,S.money/Ti.exp*50))+'%';ex.classList.toggle('ready',S.money>=Ti.exp);}}

/* ================= modals ================= */
const modal=$('#modal'),sheet=$('#sheet');
function open(html){sheet.innerHTML=html;modal.hidden=false;}function close(){modal.hidden=true;}
modal.addEventListener('click',e=>{if(e.target===modal)close();});
function clearWorld(){while(live.length)release(live.length-1);pl.fill(0);for(let i=0;i<SN;i++)sk[i*5+4]=0;for(const f of FL)f.on=false;stx.clearRect(0,0,stc.width,stc.height);}
$('#resetBtn').addEventListener('click',()=>{open(`<h2>Start over?</h2><p>This wipes your cash, blades, crates and tower so you can play the prototype from the beginning.</p><div class="row"><button class="b-alt" id="mNo">Keep playing</button><button class="b-red" id="mYes">Start over</button></div>`);
  $('#mNo').onclick=close;$('#mYes').onclick=()=>{try{localStorage.removeItem(KEY);}catch(_){}Object.assign(S,FRESH());earnLog.length=0;t0=gt;crateBorn.length=0;$('#hint').hidden=false;taps=0;
    clearWorld();buildBlades();camGoal();cam.s=cg.s;cam.ox=cg.ox;cam.oy=cg.oy;warm();close();updateUI();};});
function offline(){const away=Math.min(7200,(Date.now()-S.t)/1000);if(away<60||!S.rate)return;const v=S.rate*away*.5;if(v<1)return;const h=Math.floor(away/3600),m=Math.floor(away%3600/60);
  open(`<h2>Welcome back</h2><p>Your blades kept slicing for ${h?h+'h ':''}${m}m while you were away (half speed, max 2h).</p><div class="big">+${fmt(v)}</div>
    <div class="row"><button class="b-alt" id="mTake">Collect</button><button class="b-gold" id="mAd">Collect ×2</button></div><p style="margin:10px 0 0;font-size:12px">In the real game ×2 plays a rewarded ad. In this prototype it just doubles.</p>`);
  $('#mTake').onclick=()=>{S.money+=v;close();updateUI();save();};$('#mAd').onclick=()=>{S.money+=v*2;close();updateUI();save();};}

/* ================= loop ================= */
let last=0,lastUI=0;
function frame(now){const dt=Math.min(.05,(now-last)/1000);last=now;const n=Math.max(1,Math.ceil(dt/(1/60)-.01)),h=dt/n;for(let i=0;i<n;i++)step(h);
  draw();if(now-lastUI>150){lastUI=now;updateUI();}requestAnimationFrame(frame);}
/* warm-up: the first frame already shows fruit falling through the blades (no pay during warm-up) */
function warm(){NOPAY=true;FX=false;dropT=99;for(let i=0;i<150;i++){if(i===120)FX=true;step(1/60);}NOPAY=false;earnLog.length=0;juicePend=0;pendV=0;for(const f of FL)f.on=false;t0=gt;}

/* ================= headless pacing check (debug only) ================= */
window.__sf={sim(sec,opt){opt=opt||{};SIM=true;FX=false;const bk=JSON.stringify(S);Object.assign(S,FRESH());clearWorld();buildBlades();crateBorn.length=0;
  gt=0;t0=0;earnLog.length=0;tickAcc=0;tickT=0;dropT=99;stats.cuts=stats.fruits=stats.juiced=0;const ev=[],samples=[];let nextBot=1,nextS=30,adds=0,ipsAt3=null,t3=null;
  for(let t=0;t<sec;t+=1/60){step(1/60);
    if(gt>=nextBot){nextBot+=opt.think||1;const Ti=T();let r='';
      if(opt.policy==='cheap'){const full=S.bl.length>=SLOTS[S.tier].length,pair=findPair(),c=[];
        if(TIERS[S.tier+1]&&S.st>=Ti.st)c.push([Ti.exp,'x']);if(S.st<Ti.st)c.push([stCost(),'s']);if(pair)c.push([mergeCost(),'m']);if(!full)c.push([addCost(),'a']);
        c.sort((a,b)=>a[0]-b[0]);const k=c[0];if(k&&S.money>=k[0]){if(k[1]==='x'){doExpand();r='EXPAND → '+T().name;}else if(k[1]==='s'){doStation();r='crate '+ST[S.st-1].name;}
          else if(k[1]==='m'){const x=doMerge();r='merge → '+LV[pair].name+(x==='new'?' (NEW)':'');}else{doAdd();adds++;r='add ('+S.bl.length+')';if(adds===2&&!t3)t3=gt;}}}
      else if(TIERS[S.tier+1]&&S.st>=Ti.st&&S.money>=Ti.exp){doExpand();r='EXPAND → '+T().name;}
      else if(S.st<Ti.st&&S.money>=stCost()){doStation();r='crate '+ST[S.st-1].name;}
      else{const full=S.bl.length>=SLOTS[S.tier].length,pair=findPair();
        if(pair&&S.money>=mergeCost()&&(full||mergeCost()<=addCost())){const x=doMerge();r='merge → '+LV[pair].name+(x==='new'?' (NEW)':'');}
        else if(!full&&S.money>=addCost()){doAdd();adds++;r='add ('+S.bl.length+')';if(adds===2&&!t3)t3=gt;}}
      if(r)ev.push(Math.round(gt)+'s '+r);}
    if(t3&&ipsAt3===null&&gt>t3+20)ipsAt3=ratePerSec();
    if(gt>=nextS){nextS+=30;samples.push(Math.round(gt)+'s $'+Math.round(S.money)+' ips='+ratePerSec().toFixed(1)+' bl=['+S.bl.join(',')+'] st='+S.st+' tier='+(S.tier+1)+' live='+live.length);}}
  const out={ev,samples,ipsAfter3Blades:ipsAt3,cutsPerFruit:stats.cuts/stats.fruits,piecesPerFruit:stats.juiced/stats.fruits};
  Object.assign(S,JSON.parse(bk));clearWorld();buildBlades();camGoal();SIM=false;FX=true;gt=0;t0=0;earnLog.length=0;return out;},
  cascade(lv,n,sec){SIM=true;FX=false;const bk=JSON.stringify(S);S.bl=Array(n).fill(lv);S.st=0;clearWorld();buildBlades();gt=0;stats.cuts=stats.fruits=stats.juiced=stats.rej=0;stats.bh.fill(0);
   for(let t=0;t<sec;t+=1/60)step(1/60);const out={cpf:+(stats.cuts/stats.fruits).toFixed(2),perBlade:stats.bh.slice(0,n).map(h=>+(h/stats.fruits).toFixed(2)),rej:+(stats.rej/stats.fruits).toFixed(2)};
    Object.assign(S,JSON.parse(bk));clearWorld();buildBlades();SIM=false;FX=true;return out;},
  bench(n){const t=performance.now();for(let i=0;i<n;i++){step(1/60);draw();}return {msPerFrame:(performance.now()-t)/n,live:live.length};},
  state:S,tune(o){if('SEP'in o)SEP=o.SEP;if('DRAG'in o)DRAG=o.DRAG;if('FRAC'in o)FRAC=o.FRAC;if('TV'in o)TV=o.TV;if('SPR'in o)SPR=o.SPR;if('HS'in o)HS=o.HS;if('JV'in o)JV=o.JV;if(o.base)o.base.forEach((b,i)=>TIERS[i].base=b);if(o.drop)o.drop.forEach((b,i)=>TIERS[i].drop=b);}};

/* ================= boot ================= */
if(S.hint)$('#hint').hidden=true;
for(let i=0;i<S.st;i++)crateBorn[i]=1;
new ResizeObserver(()=>{resize();}).observe(stage);
resize();buildBlades();warm();draw();updateUI();offline();
setInterval(save,5000);document.addEventListener('visibilitychange',()=>{if(document.hidden)save();});
requestAnimationFrame(t=>{last=t;requestAnimationFrame(frame);});
})();
</script>

</body></html>
