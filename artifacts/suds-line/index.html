<!doctype html><html><head>
<meta name="viewport" content="width=device-width, initial-scale=1"><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Suds Line</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;700;800;900&display=swap">
<style>
  :root{
    color-scheme: light;
    --page:#e4f6fa; --ink:#0d3a48; --ink-2:#4a7684;
    --btn:#ffffff; --btn-edge:#b4dce6; --lock:#e2f2f6;
    --aqua:#13b5cf; --aqua-edge:#0a8398; --aqua-soft:#8fd7e4; --aqua-soft-edge:#6cbccb;
    --cash:#ffd23f; --cash-ink:#5a3d00;
    --red:#ff4257; --pink:#ff5fa2; --pink-edge:#c93c7c;
    --display:"Lilita One","Arial Rounded MT Bold","Trebuchet MS",system-ui,sans-serif;
    --body:"Nunito","Segoe UI",system-ui,-apple-system,sans-serif;
  }
  [hidden]{display:none!important}
  html,body{height:100%;margin:0}
  body{background:var(--page) radial-gradient(120% 70% at 50% 0%,#f4fcfe 0%,var(--page) 60%,#cfeef5 100%);color:var(--ink);font-family:var(--body);font-weight:700;overflow:hidden;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
  .app{height:100%;max-width:480px;margin:0 auto;display:flex;flex-direction:column;gap:9px;padding-inline:16px;padding-block:10px 12px;box-sizing:border-box}
  button{font-family:inherit;color:inherit;cursor:pointer}
  button:focus-visible{outline:3px solid var(--pink);outline-offset:2px}

  .hud{display:flex;align-items:center;gap:10px}
  .loc{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1}
  .loc b{font-family:var(--display);font-weight:400;font-size:14px;line-height:1.02;letter-spacing:.03em;text-transform:uppercase;color:var(--aqua-edge);overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
  .loc span{font-size:11.5px;color:var(--ink-2);font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .money{text-align:center;display:flex;flex-direction:column;line-height:1;flex:none}
  .money #money{font-family:var(--display);font-size:clamp(27px,8vw,35px);color:var(--ink);font-variant-numeric:tabular-nums}
  .money #rate{font-size:12px;color:var(--ink-2);margin-top:3px;font-variant-numeric:tabular-nums}
  .tools{flex:1;display:flex;justify-content:flex-end;gap:6px}
  .icon-btn{width:38px;height:38px;border-radius:12px;border:0;background:var(--btn);box-shadow:0 3px 0 var(--btn-edge);display:grid;place-items:center;flex:none}
  .icon-btn svg{width:20px;height:20px}

  .stage{position:relative;flex:1;min-height:220px;border-radius:22px;overflow:hidden;background:#d6f1f7;box-shadow:inset 0 0 0 3px rgba(13,58,72,.12)}
  #cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
  .hint{position:absolute;left:50%;top:8px;transform:translateX(-50%);background:rgba(8,48,60,.86);color:#fff;font-weight:800;font-size:11.5px;padding:7px 13px 7px 9px;border-radius:999px;display:flex;align-items:center;gap:8px;pointer-events:none;white-space:nowrap;max-width:calc(100% - 16px);box-sizing:border-box}
  .hint i{width:16px;height:16px;border-radius:50%;background:var(--cash);animation:tap 1.1s ease-in-out infinite;flex:none}
  @keyframes tap{0%,100%{transform:scale(1)}40%{transform:scale(.7)}60%{transform:scale(1.1)}}
  .float{position:absolute;font-family:var(--display);color:var(--cash);text-shadow:0 2px 0 #08303c,1.5px 0 0 #08303c,-1.5px 0 0 #08303c,0 -1.5px 0 #08303c;pointer-events:none;white-space:nowrap;font-size:16px;animation:rise 1.1s ease-out forwards}
  .float.lv{color:#fff;font-size:14px}
  @keyframes rise{0%{opacity:0;transform:translate(-50%,-30%) scale(.7)}15%{opacity:1;transform:translate(-50%,-50%) scale(1.1)}100%{opacity:0;transform:translate(-50%,-170%) scale(1)}}
  .banner{position:absolute;left:50%;top:32%;transform:translate(-50%,-50%);background:#08303c;color:#fff;border-radius:16px;padding:10px 18px 12px;text-align:center;pointer-events:none;box-shadow:0 5px 0 rgba(0,0,0,.2);animation:bn 2.4s ease-out forwards;white-space:nowrap;z-index:2;max-width:92%}
  .banner small{display:block;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#7fe6f7;font-weight:900}
  .banner b{font-family:var(--display);font-weight:400;font-size:24px}
  .banner.gold{background:linear-gradient(#ffe066,#f2b21c);color:#3b2400;box-shadow:0 5px 0 #a8740c}.banner.gold small{color:#6b3f00}
  .banner.pink{background:linear-gradient(#ff7cb6,#ff4f98);box-shadow:0 5px 0 var(--pink-edge)}.banner.pink small{color:#fff0f7}
  @keyframes bn{0%{opacity:0;transform:translate(-50%,-50%) scale(.6)}12%{opacity:1;transform:translate(-50%,-50%) scale(1.08)}20%{transform:translate(-50%,-50%) scale(1)}85%{opacity:1}100%{opacity:0;transform:translate(-50%,-70%)}}

  .info{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:12.5px;color:var(--ink-2);font-weight:800;font-variant-numeric:tabular-nums}
  .info span:first-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pay{font-family:var(--display);font-weight:400;color:var(--aqua-edge);font-size:16px;white-space:nowrap}

  .upgrades{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .up{border:0;border-radius:16px;background:var(--btn);box-shadow:0 4px 0 var(--btn-edge);padding:9px 8px;display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:left;min-width:0;transition:transform .06s}
  .up:active{transform:translateY(3px);box-shadow:0 1px 0 var(--btn-edge)}
  .up-h{display:flex;align-items:center;gap:6px;min-width:0}
  .up-h i{width:26px;height:26px;border-radius:8px;background:var(--lock);display:grid;place-items:center;flex:none}
  .up-h i svg{width:18px;height:18px}
  .up-h b{font-size:13px;font-weight:900;line-height:1.1}
  .up small{font-size:11px;color:var(--ink-2);line-height:1.2;min-height:2.4em;width:100%;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
  .cost{font-family:var(--display);font-size:14px;background:var(--cash);color:var(--cash-ink);padding:2px 9px;border-radius:8px;font-variant-numeric:tabular-nums}
  .up.poor .cost,.up.off .cost{background:var(--lock);color:var(--ink-2)}
  .up.off{opacity:.62}
  .up.prime{background:var(--aqua);color:#fff;box-shadow:0 4px 0 var(--aqua-edge)}
  .up.prime small{color:#e3fbff}.up.prime .up-h i{background:rgba(255,255,255,.22)}
  .up.prime:active{box-shadow:0 1px 0 var(--aqua-edge)}
  .up.prime.poor{background:var(--aqua-soft);box-shadow:0 4px 0 var(--aqua-soft-edge)}
  .up.prime.poor .cost{background:rgba(255,255,255,.55);color:var(--ink)}
  .up.hot{background:var(--pink);color:#fff;box-shadow:0 4px 0 var(--pink-edge);animation:glow 1.2s ease-in-out infinite}
  .up.hot small{color:#fff0f7}.up.hot .up-h i{background:rgba(255,255,255,.22)}
  .up.buy{animation:pop .25s}
  @keyframes pop{50%{transform:scale(1.05)}}
  @keyframes glow{50%{filter:brightness(1.12)}}

  .expand{position:relative;overflow:hidden;border:0;border-radius:14px;height:46px;font-weight:900;font-size:13.5px;background:#7fb3c0;color:#fff;box-shadow:0 4px 0 #5d8f9c;flex:none}
  .expand .fill{position:absolute;inset:0;width:0;background:#0b7f95;transition:width .2s}
  .expand span{position:relative}
  .expand.ready{background:#0b7f95;box-shadow:0 4px 0 #065e6f;animation:glow 1.2s ease-in-out infinite}

  .modal{position:fixed;inset:0;background:rgba(8,48,60,.55);display:grid;place-items:center;padding-inline:16px;z-index:10}
  .sheet{background:#fff;border-radius:22px;padding:20px;width:100%;max-width:380px;box-sizing:border-box;box-shadow:0 8px 0 var(--btn-edge)}
  .sheet h2{font-family:var(--display);font-weight:400;font-size:24px;margin:0 0 6px;text-wrap:balance}
  .sheet p{margin:0 0 14px;color:var(--ink-2);font-size:14px;line-height:1.45}
  .sheet .big{font-family:var(--display);font-size:34px;color:var(--aqua-edge);margin:6px 0 14px;font-variant-numeric:tabular-nums}
  .row{display:flex;gap:8px}
  .row button{flex:1;border:0;border-radius:14px;height:46px;font-weight:900;font-size:14px}
  .b-alt{background:var(--lock);box-shadow:0 4px 0 #bfdde5}
  .b-gold{background:var(--cash);color:var(--cash-ink);box-shadow:0 4px 0 #c79a1e}
  .b-red{background:#e5394b;color:#fff;box-shadow:0 4px 0 #a51f2f}
  .toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 14px);transform:translateX(-50%);background:#08303c;color:#fff;font-weight:800;font-size:13px;padding:8px 14px;border-radius:999px;z-index:20;pointer-events:none;white-space:nowrap}
  @media (prefers-reduced-motion: reduce){.hint i,.expand.ready,.up.hot,.up.buy{animation:none}.float,.banner{animation-duration:.01s}}
  @media (max-height:680px){.up small{min-height:0}.app{gap:7px;padding-block:8px 10px}.up{padding:7px 7px}.expand{height:42px}}
</style>

<div class="app">
  <header class="hud">
    <div class="loc"><b id="tierName">Driveway Wash</b><span id="tierStep">Tier 1 of 5</span></div>
    <div class="money"><span id="money">$0</span><span id="rate">$0 / min</span></div>
    <div class="tools">
      <button class="icon-btn" id="sndBtn" aria-label="Turn sound on"><svg viewBox="0 0 24 24" fill="none" stroke="#0d3a48" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h4l5-4v14l-5-4H4z" fill="#0d3a48"/><path id="sndWave" d="M16 9l5 6M21 9l-5 6"/></svg></button>
      <button class="icon-btn" id="resetBtn" aria-label="Start over"><svg viewBox="0 0 24 24" fill="none" stroke="#0d3a48" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12a8 8 0 1 0 2.4-5.7"/><path d="M4 4v4.5h4.5"/></svg></button>
    </div>
  </header>

  <div class="stage" id="stage">
    <canvas id="cv"></canvas>
    <div class="hint" id="hint"><i></i>Tap a station to upgrade · tap the belt to rush</div>
  </div>

  <div class="info"><span id="status">Hatchbacks · 24/min · $5.6 each</span><span class="pay" id="ips">$0/s</span></div>

  <div class="upgrades">
    <button class="up prime" id="bUp"><div class="up-h"><i><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20V6"/><path d="M6 11l6-6 6 6"/><path d="M5 21h14" stroke-width="2"/></svg></i><b>Upgrade</b></div><small></small><span class="cost"></span></button>
    <button class="up" id="bMach"><div class="up-h"><i><svg viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M4 21V7a2 2 0 012-2h12a2 2 0 012 2v14" stroke="#0a8398" stroke-width="2.4"/><path d="M8 5v3M12 5v3M16 5v3" stroke="#13b5cf" stroke-width="2"/><path d="M9 14h6M12 11v6" stroke="#ff5fa2" stroke-width="2.4"/></svg></i><b>Add Machine</b></div><small></small><span class="cost"></span></button>
    <button class="up" id="bLoy"><div class="up-h"><i><svg viewBox="0 0 24 24" fill="none"><rect x="2.5" y="5.5" width="19" height="13" rx="2.5" fill="#ff5fa2"/><rect x="2.5" y="8.5" width="19" height="2.4" fill="#c93c7c"/><path d="M15.5 12.8l.9 1.8 2 .3-1.45 1.4.35 2-1.8-.95-1.8.95.35-2-1.45-1.4 2-.3z" fill="#ffd23f"/></svg></i><b>Loyalty Club</b></div><small></small><span class="cost"></span></button>
  </div>
  <button class="expand" id="bExpand"><div class="fill" id="expFill"></div><span id="expLabel">Expand</span></button>
</div>

<div class="modal" id="modal" hidden><div class="sheet" id="sheet"></div></div>

<script>
(()=>{
'use strict';
const $=s=>document.querySelector(s);
const stage=$('#stage'),cv=$('#cv'),ctx=cv.getContext('2d');
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const clamp=(v,a,b)=>v<a?a:v>b?b:v;

/* ======================= economy (tuned with a headless bot, see __suds.simulate) ======================= */
// b = base throughput (cars/s at Lv 1), vm = value multiplier per car, cost = build cost (machines only)
const SD={
  queue: {name:'Street Queue',   b:.55, vm:1,    col:'#8fa6b2'},
  soak:  {name:'Pre-Soak',       b:.50, vm:1.25, col:'#4fc3ea'},
  foam:  {name:'Foam Cannon',    b:.46, vm:1.4,  col:'#ff6fae'},
  brush: {name:'Roller Brushes', b:.40, vm:1.6,  col:'#4d7cff'},
  rinse: {name:'Rinse Arch',     b:.44, vm:1.8,  col:'#19b3c4', cost:90},
  dry:   {name:'Dryer',          b:.42, vm:1.6,  col:'#98a9b6', cost:450},
  wheel: {name:'Wheel Scrubber', b:.45, vm:1.8,  col:'#ff9f2e', cost:2e5},
  wax:   {name:'Wax Booth',      b:.43, vm:1.8,  col:'#a86bff', cost:2.2e6},
  tire:  {name:'Tire Shine',     b:.47, vm:1.8,  col:'#3a4552', cost:4.6e8},
  polish:{name:'Polish Robot',   b:.41, vm:2,    col:'#f2b820', cost:7.3e10},
  exit:  {name:'Exit & Pay',     b:.60, vm:1,    col:'#2fbf71'}
};
const ORDER=['queue','soak','foam','brush','rinse','dry','wheel','wax','tire','polish','exit'];
const BASE=['queue','soak','foam','brush','exit'];
const TIERS=[
  {name:'Driveway Wash',   prod:'Hatchbacks',           short:'Hatchbacks',           veh:['hatch'],        add:['rinse','dry'],  exp:12000,  val:2},
  {name:'Corner Car Wash', prod:'Sports Cars',          short:'Sports cars',          veh:['sports'],       add:['wheel','wax'],  exp:2e7,    val:10},
  {name:'Express Tunnel',  prod:'Pickup Trucks & Vans', short:'Pickups & vans', veh:['pickup','van'], add:['tire'],         exp:7e9,    val:50},
  {name:'Fleet Depot',     prod:'Buses',                short:'Buses',                veh:['bus'],          add:['polish'],       exp:7e11,   val:250},
  {name:'Mega Wash Plaza', prod:'Monster Trucks',       short:'Monster trucks',       veh:['monster'],      add:[],               exp:null,   val:1250}
];
const RG=1.3, UC0=6, UCG=1.5, LOY0=60, LOYG=2.2, LOYB=.2;
const RANKS=['Bronze Card','Silver Card','Gold Card','Platinum Card','Diamond Card','VIP','VIP Gold','VIP Diamond','Legend'];
const RANKCOL=['#c98b5a','#b9c6cf','#f2c230','#a9e6f0','#7fd8ff','#ff5fa2','#ffcf3f','#b28dff','#10222b'];
const rankName=k=>k<1?'No card':k<=RANKS.length?RANKS[k-1]:'Legend '+(k-RANKS.length+1);
const rankCol=k=>k<1?'#dfeef2':RANKCOL[Math.min(k,RANKCOL.length)-1];

const lineIds=s=>ORDER.filter(id=>BASE.includes(id)||s.built.includes(id));
function slotIds(tier){const a=new Set(BASE);for(let t=0;t<=tier;t++)TIERS[t].add.forEach(id=>a.add(id));return ORDER.filter(id=>a.has(id));}
const rate=(id,l)=>SD[id].b*Math.pow(RG,l-1);
const upCost=(l,s)=>UC0*TIERS[s.tier].val/2*Math.pow(UCG,l-1);
function lineRate(s){let m=Infinity,bi=null;for(const id of lineIds(s)){const r=rate(id,s.lv[id]);if(r<m-1e-12){m=r;bi=id;}}return[m,bi];}
function carValue(s){let v=TIERS[s.tier].val;for(const id of lineIds(s))v*=SD[id].vm;return v;}
const loyMult=s=>1+LOYB*s.loy, loyCost=s=>LOY0*Math.pow(LOYG,s.loy);
const incomeSec=s=>lineRate(s)[0]*carValue(s)*loyMult(s);
function nextMachine(s){for(const id of TIERS[s.tier].add)if(!s.built.includes(id))return id;return null;}
function startLv(s,id){const r=lineRate(s)[0];let l=1;while(rate(id,l)<r*1.02&&l<999)l++;return l;}

/* ======================= state ======================= */
const KEY='suds-line-v1';
const FRESH=()=>({money:30,tier:0,built:[],lv:{queue:1,soak:1,foam:1,brush:1,exit:1},loy:0,t:Date.now(),hint:0});
const S=FRESH();
try{const s=JSON.parse(localStorage.getItem(KEY)||'null');if(s&&s.lv&&Array.isArray(s.built))Object.assign(S,s);}catch(e){}
(function sanitize(){S.tier=clamp(S.tier|0,0,TIERS.length-1);const ok=new Set(slotIds(S.tier));S.built=S.built.filter(id=>ok.has(id)&&!BASE.includes(id));
  S.built=[...new Set(S.built)];for(const id of lineIds(S))S.lv[id]=Math.max(1,(S.lv[id]|0)||1);S.loy=Math.max(0,S.loy|0);if(!(S.money>=0))S.money=0;})();
function save(){try{S.t=Date.now();localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
const T=()=>TIERS[S.tier];

function fmt(n){if(!isFinite(n))return '$∞';if(n<1000)return '$'+Math.floor(n).toLocaleString('en-US');const u=['K','M','B','T','Qa','Qi','Sx','Sp','Oc'];let i=-1;while(n>=1000&&i<u.length-1){n/=1000;i++;}
  return '$'+parseFloat(n<10?n.toFixed(2):n<100?n.toFixed(1):Math.floor(n))+u[i];}
const fmtS=n=>n<.995?'$'+n.toFixed(2):n<9.95?'$'+n.toFixed(1):fmt(n);
const fmtN=n=>n<10?n.toFixed(1):n<1000?Math.round(n).toString():fmt(n).slice(1);

/* ======================= vehicle art (side view, canvas paths; faces right) ======================= */
function shade(hex,a){const n=parseInt(hex.slice(1),16);let r=n>>16,g=n>>8&255,b=n&255;
  const f=a<0?0:255,t=Math.abs(a);r=Math.round((f-r)*t+r);g=Math.round((f-g)*t+g);b=Math.round((f-b)*t+b);
  return '#'+((1<<24)|(r<<16)|(g<<8)|b).toString(16).slice(1);}
function mkPal(main){return{main,dark:shade(main,-.32),light:shade(main,.35),glass:'#a6dbee',metal:'#cfd8dc',tire:'#24282a',white:'#f4f6f5'};}
function rr(c,x,y,w,h,r){r=Math.max(0,Math.min(r,w/2,h/2));c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();}
function circ(c,x,y,r,col){c.fillStyle=col;c.beginPath();c.arc(x,y,r,0,Math.PI*2);c.fill();}
function wheel(c,x,y,r,p,big){circ(c,x,y,r,p.tire);if(big){c.fillStyle='#3a4044';for(let k=0;k<12;k++){const a=k*Math.PI/6;c.save();c.translate(x+Math.cos(a)*r*.93,y+Math.sin(a)*r*.93);c.rotate(a);c.fillRect(-r*.08,-r*.12,r*.16,r*.24);c.restore();}}
  circ(c,x,y,r*.52,p.metal);circ(c,x,y,r*.2,p.dark);}
// ar = box height / length, gy = ground (wheel bottom) as fraction of h, top = roof fraction, wh = wheels [x,y,r] (r in h units)
const VEH={
  hatch:{ar:.5,gy:.87,top:.17,wh:[[.21,.72,.15],[.79,.72,.15]],draw(c,w,h,p){
    c.fillStyle=p.main;rr(c,w*.04,h*.42,w*.92,h*.3,h*.1);c.fill();
    c.beginPath();c.moveTo(w*.06,h*.46);c.lineTo(w*.09,h*.25);c.quadraticCurveTo(w*.11,h*.17,w*.2,h*.17);c.lineTo(w*.54,h*.17);c.quadraticCurveTo(w*.62,h*.18,w*.7,h*.3);c.lineTo(w*.8,h*.45);c.closePath();c.fill();
    c.fillStyle=p.glass;
    c.beginPath();c.moveTo(w*.14,h*.41);c.lineTo(w*.155,h*.26);c.quadraticCurveTo(w*.165,h*.22,w*.21,h*.22);c.lineTo(w*.39,h*.22);c.lineTo(w*.39,h*.41);c.closePath();c.fill();
    c.beginPath();c.moveTo(w*.42,h*.41);c.lineTo(w*.42,h*.22);c.lineTo(w*.54,h*.22);c.quadraticCurveTo(w*.6,h*.23,w*.66,h*.32);c.lineTo(w*.71,h*.41);c.closePath();c.fill();
    c.fillStyle=p.light;c.fillRect(w*.06,h*.5,w*.88,h*.035);
    c.strokeStyle=p.dark;c.lineWidth=Math.max(1,h*.012);c.beginPath();c.moveTo(w*.405,h*.42);c.lineTo(w*.405,h*.66);c.stroke();
    c.fillStyle=p.dark;c.fillRect(w*.46,h*.54,w*.05,h*.02);

  let l=0;for(let i=0;i<d.length;i++){const w=Math.random()*2-1;l=l*.7+w*.3;d[i]=l;}
  const src=AC.createBufferSource();src.buffer=b;src.loop=true;const f=AC.createBiquadFilter();f.type='bandpass';f.frequency.value=1600;f.Q.value=.5;
  hiss=AC.createGain();hiss.gain.value=0;src.connect(f).connect(hiss).connect(AC.destination);src.start();}catch(e){AC=null;}}

  g.gain.setValueAtTime(0,t+i*dur);g.gain.linearRampToValueAtTime(vol,t+i*dur+.01);g.gain.exponentialRampToValueAtTime(.001,t+i*dur+dur*1.6);o.connect(g).connect(AC.destination);o.start(t+i*dur);o.stop(t+i*dur+dur*2);});}catch(e){}}

/* ======================= main loop ======================= */
function update(dt,t){
  if(!warm){owed+=incomeSec(S)*(rushT>0?1.5:1)*dt;}
  rushT=Math.max(0,rushT-dt);beltPh+=BELT_V*(rushT>0?1.5:1)*dt;
  updateCars(dt);
  for(const st of STN){st.act+=((st.occ?1:0)-st.act)*Math.min(1,dt*6);st.pop=Math.max(0,st.pop-dt*2.4);}
  if(payT>0){payT-=dt;if(payT<=0&&payAcc>0){floatAt('+'+fmtS(payAcc),payX,payY,'');payAcc=0;payT=0;}}
}
function draw(t){
  ctx.setTransform(dpr,0,0,dpr,0,0);ctx.drawImage(bgCv,0,0,W,H);
  if(!reduce){ctx.strokeStyle='rgba(255,255,255,.6)';ctx.lineWidth=1;for(let k=0;k<10;k++){const sp=12+k*3,x=(k*97.3+Math.sin(t*.6+k)*8)%W,y=H-((t*sp+k*71)%(H+20));ctx.beginPath();ctx.arc(x,y,2+k%4,0,6.3);ctx.stroke();}}
  // belt

  for(const st of STN)drawStationBack(st,t);
  for(let i=cars.length-1;i>=0;i--)drawCar(cars[i]);

  for(const st of STN)drawStationFrame(st,t);
  drawLabels(t);drawParts();
  if(rushT>0){ctx.font='900 11px Nunito,system-ui,sans-serif';const txt='RUSH ×1.5',tw=ctx.measureText(txt).width+16;ctx.fillStyle='#ff5fa2';rr(ctx,W-tw-8,8,tw,20,10);ctx.fill();ctx.fillStyle='#fff';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(txt,W-tw/2-8,18.5);
    ctx.fillStyle='rgba(255,255,255,.7)';ctx.fillRect(W-tw,25,(tw-16)*Math.min(1,rushT/4),2);}
  if(flashT>0){ctx.fillStyle=`rgba(255,255,255,${flashT*.85})`;ctx.fillRect(0,0,W,H);}
}

  if(hiss&&AC&&!muted&&now-lastHiss>150){lastHiss=now;let busy=0;for(const st of STN)busy+=st.act;try{hiss.gain.setTargetAtTime(Math.min(.05,.008+busy*.005)*(rushT>0?1.4:1),AC.currentTime,.1);}catch(e){}}

/* ======================= debug / pacing bot (uses the live economy functions) ======================= */
function simulate(maxT=1800){
  const s={money:30,tier:0,built:[],lv:{queue:1,soak:1,foam:1,brush:1,exit:1},loy:0};
  const cl=o=>({money:o.money,tier:o.tier,built:o.built.slice(),lv:Object.assign({},o.lv),loy:o.loy});
  let t=0;const ev=[],dt=.25,inc=[];
  while(t<maxT){s.money+=incomeSec(s)*dt;t+=dt;if(t%60===0)inc.push([t,incomeSec(s)]);
    for(let k=0;k<20;k++){const I=incomeSec(s),c=[],bi=lineRate(s)[1],n=lineIds(s).length;
      c.push({k:'up',cost:upCost(s.lv[bi],s),g:I*(RG-1)/(n*.5),go:()=>{s.lv[bi]++;}});
      {const n2=cl(s);n2.loy++;c.push({k:'loy',cost:loyCost(s),g:incomeSec(n2)-I,go:()=>{s.loy++;}});}
      const nm=nextMachine(s);
      if(nm){const n2=cl(s);n2.lv[nm]=startLv(s,nm);n2.built.push(nm);c.push({k:'mach',id:nm,cost:SD[nm].cost,g:incomeSec(n2)-I,go:()=>{s.lv[nm]=startLv(s,nm);s.built.push(nm);}});}
      else if(TIERS[s.tier].exp){const n2=cl(s);n2.tier++;c.push({k:'tier',cost:TIERS[s.tier].exp,g:incomeSec(n2)-I,go:()=>{s.tier++;}});}
      let best=null,bs=Infinity;for(const x of c){const sc=Math.max(0,x.cost-s.money)/I+x.cost/Math.max(1e-12,x.g);if(sc<bs){bs=sc;best=x;}}
      if(best&&s.money>=best.cost){s.money-=best.cost;best.go();ev.push([t,best.k==='tier'?'tier '+(s.tier+1):best.k==='mach'?'machine '+SD[best.id].name:best.k==='loy'?'loyalty '+s.loy:'up']);}else break;}}
  const at=re=>{const e=ev.find(e=>re.test(e[1]));return e?e[0]:null;};
  const news=ev.filter(e=>e[1]!=='up'&&e[0]<=900).map(e=>e[0]);let gap=0,gapAt=0,p=0;for(const x of news){if(x-p>gap){gap=x-p;gapAt=p;}p=x;}if(900-p>gap){gap=900-p;gapAt=p;}
  return{incomeAt1s:+incomeSec({money:30,tier:0,built:[],lv:{queue:1,soak:1,foam:1,brush:1,exit:1},loy:0}).toFixed(2),firstUpgrade:at(/^up$/),firstMachine:at(/^machine/),firstLoyalty:at(/^loyalty/),
    tier2:at(/^tier 2/),tier3:at(/^tier 3/),tier4:at(/^tier 4/),tier5:at(/^tier 5/),longestGapFirst15min:gap,gapStartsAt:gapAt,upgradesFirst15min:ev.filter(e=>e[1]==='up'&&e[0]<=900).length,
    milestones:ev.filter(e=>e[1]!=='up'&&e[0]<=1500).map(e=>Math.round(e[0])+'s '+e[1]).join(' | '),incomePerMin:inc.map(([a,b])=>a+'s:'+fmt(b)+'/s').join(' ')};}
window.__suds={state:S,simulate,cars:()=>cars.length,stations:()=>STN.map(s=>({id:s.id,built:s.built,lv:S.lv[s.id],cx:Math.round(s.cx),gy:Math.round(s.gy)})),layout:()=>({W,H,Lc:+Lc.toFixed(1),rows:SEGS.filter(s=>!s.k).length,bottleneck:BI}),
  give(n){S.money+=n;updateUI();},income:()=>incomeSec(S),
  bench(n=300){const t0=performance.now();for(let i=0;i<n;i++){update(1/60,i/60);stepParts(1/60);draw(i/60);}return (performance.now()-t0)/n;}};

/* ======================= boot ======================= */
if(S.hint)$('#hint').hidden=true;
layout();prewarm();updateUI();draw(performance.now()/1000);
offline((Date.now()-(S.t||Date.now()))/1000);
setInterval(save,5000);
requestAnimationFrame(t=>{last=t;requestAnimationFrame(frame);});
})();
